<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{

  --t-a:#f0a47f;--t-b:#f2e076;--t-c:#abdfa6;--dim:rgba(255,255,255,.72);
  --ok:#5fa85f;--warn:#d8a24a;--bad:#c96a5a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:'Hanken Grotesk',-apple-system,sans-serif;background:#171015;color:#fff;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 16px 60px;gap:14px}

.chrome{width:100%;max-width:930px;display:flex;flex-direction:column;gap:9px}

.vsw{display:flex;gap:6px;align-items:center;margin-top:2px}
.vsw span{font-size:11px;color:#7d6d76;margin-right:4px}

  font-weight:600;padding:6px 11px;border-radius:7px;cursor:pointer}
.vsw button.on{background:var(--lilac);color:#fff;border-color:var(--lilac)}
.conf{border-top:1px solid #e0d9c9;margin-top:15px;padding-top:13px;cursor:pointer}

.lace{background:rgba(255,255,255,.08);border-radius:9px;padding:12px 14px;margin-top:14px}
.lace .lk{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--lilac)}
.lace p{font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.82);margin-top:7px}
.digest{margin-top:18px}
.digest .dk{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.digest .di{background:var(--cream);color:var(--ink);border-radius:12px;padding:15px 16px;margin-top:11px}
.digest .dt{font-family:'Newsreader',serif;font-size:19px;line-height:1.2}
.digest .dd{font-size:13.5px;line-height:1.5;color:#6b5f64;margin-top:6px}
.rowa{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
  border-bottom:1px solid rgba(255,255,255,.14);padding:10px 0;font-size:13.5px}
.rowa .q{color:var(--dim);flex:1}
.rowa .a{color:#fff;font-weight:600}
.rowa .ed{color:var(--lilac);font-size:12px;text-decoration:underline;cursor:pointer;flex:none}
.two{display:flex;gap:9px;margin-top:16px}
.two .f{flex:1;background:var(--cream);color:var(--ink);border-radius:12px;padding:15px 14px}
.two .f .fk{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#a3967f}
.two .f .fh{font-family:'Newsreader',serif;font-size:18px;line-height:1.2;margin-top:7px}
.two .f .fd{font-size:12.5px;line-height:1.5;color:#5f5459;margin-top:9px}
.two .f .fd b{color:var(--ink)}
.note{font-size:12px;color:#7d6d76;max-width:930px;line-height:1.5;text-align:center}

.device{width:392px;height:812px;background:var(--plum);border-radius:44px;
  box-shadow:0 0 0 10px #100b0e,0 0 0 12px #2c2027,0 34px 70px rgba(0,0,0,.6);overflow:hidden;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px}
.body::-webkit-scrollbar{width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 22px 6px;flex:none}
.wm{font-family:'Newsreader',serif;font-size:19px}
.burger{width:22px}.burger span{display:block;height:1.5px;background:#fff;margin:5px 0}
.avatar{width:34px;height:34px;border-radius:9px;background:var(--lilac);display:flex;align-items:center;
  justify-content:center;font-family:'Newsreader',serif;font-size:19px;margin:16px 0 14px}
.avatar.c{margin:14px auto 16px}
.hero{font-family:'Newsreader',serif;font-size:29px;line-height:1.16;text-align:center}

.said{font-family:'Newsreader',serif;font-size:23px;line-height:1.26;color:#fff}
.sub{font-size:16px;line-height:1.5;color:rgba(255,255,255,.78);margin-top:11px}
.sub b{color:#fff;font-weight:600}
.ask{font-size:16px;font-weight:600;line-height:1.4;margin-top:18px;color:#fff}
.qwhy{font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.6);font-style:italic;margin-top:9px}
.fieldfoot{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:12.5px;color:var(--dim)}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}

.turn{margin-top:8px;max-width:96%;margin-right:auto}
.fade{animation:fu .34s cubic-bezier(.2,.7,.2,1) both}
.fade2{animation:fu .40s cubic-bezier(.2,.7,.2,1) .16s both}
.fade3{animation:fu .40s cubic-bezier(.2,.7,.2,1) .32s both}
@keyframes fu{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes dis{from{opacity:0}to{opacity:1}}
.dissolve{animation:dis .34s ease both}

.mine{display:flex;justify-content:flex-end;margin:26px 0 30px}
.mine .b{background:#5e4557;color:#f3efe5;border-radius:14px;padding:18px 20px;

.mathhead{font-family:'Newsreader',serif;font-size:22px;color:#fff;margin-top:26px}
ul.t{margin:13px 0 0;padding:0;list-style:none}

ul.t li:before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4)}

.mod{background:var(--cream);color:var(--ink);border-radius:12px;padding:17px;margin-top:18px}
.mod h3{font-family:'Newsreader',serif;font-size:21px;font-weight:400;line-height:1.18}

  cursor:pointer;border:3px solid var(--cream)}
.trow{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:#6b5f52;
  padding:10px 0;border-bottom:1px solid #e0d9c9}
.trows{margin-top:14px;border-top:1px solid #e0d9c9}
.trow b{color:var(--ink);font-weight:700;text-align:right;white-space:nowrap}
.trow.tot{border-bottom:0;padding-top:12px}
.trow.tot span{font-weight:700;color:var(--ink)}
.trow.tot b{font-size:18px}
.trow .neg{color:#8a5a4e}
.cmpt{background:var(--cream);color:var(--ink);border-radius:12px;padding:6px 14px 14px;margin-top:18px}

.cmpt th{text-align:right;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;

.cmpt th:nth-child(2){width:26%}

/* three-lender variant — four columns in 392px */
.cmpt.three table{font-size:11px}
.cmpt.three th:first-child{width:31%}

  padding:12px 14px;margin-top:15px;color:#6b5f64}
.tipk{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#a07a44}
.tipq{font-family:'Newsreader',serif;font-size:16.5px;line-height:1.42;color:#4a4038;margin-top:8px}

  padding:6px 12px;border-radius:999px;cursor:pointer}
.qb{background:#e9e2d4;border-left:3px solid var(--plum);border-radius:0 8px 8px 0;
  padding:12px 13px;margin-top:14px;font-size:14px;line-height:1.5;color:#4a4038;font-style:italic}
.opd{margin-top:15px;border-top:1px solid #e0d9c9;padding-top:14px}
.opd .oh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.opd .on1{font-family:'Newsreader',serif;font-size:21px;line-height:1.15}
.opd .op{font-size:19px;font-weight:700;white-space:nowrap}
.opd .om{font-size:12.5px;color:#7a6f62;margin-top:6px;line-height:1.45}
.opd .orow{display:flex;justify-content:space-between;font-size:13.5px;
  border-bottom:1px solid #e0d9c9;padding:10px 0}
.opd .orow:first-of-type{border-top:1px solid #e0d9c9;margin-top:13px}
.opd .orow span{color:#6b5f52}
.opd .orow b{font-weight:700}
.opd .orow b.up{color:#8a5a4e}
.dl2{display:block;font-size:10.5px;color:#a3967f;margin-top:2px;font-weight:400}
.cmpt td.ql{font-weight:400;font-size:11.5px;color:#4a4038;line-height:1.35;text-align:right}
.cmpt .dl{font-size:10.5px;font-weight:400;color:#8a7f70;display:block;margin-top:2px}

.cmpt .neu{color:#4a4038}
.cmpt .win{color:#3f6b3f}
.scen{display:flex;gap:7px;margin-top:15px}
.scen .c{flex:1;background:var(--cream-2);border-radius:9px;padding:11px 9px;cursor:pointer;
  border:2px solid transparent;transition:.15s}
.scen .c.on{border-color:var(--ink);background:#fff}
.scen .c .k{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:#7a6f74;font-weight:700;line-height:1.3}
.scen .c .v{font-family:'Newsreader',serif;font-size:21px;line-height:1;margin-top:6px}
.scen .c .s{font-size:10.5px;color:#7a6f74;margin-top:3px}
.bar{margin-top:13px}
.bar .bl{display:flex;justify-content:space-between;font-size:12px;color:#6b5f52;margin-bottom:5px}
.bar .bl b{color:var(--ink)}
.bar .tr{height:11px;background:#ddd7c9;border-radius:6px;position:relative;overflow:visible}
.bar .fl{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar .ceil{position:absolute;top:-3px;bottom:-3px;width:2px;background:#7a6f74}
.bar .ceill{font-size:10px;color:#8a5a4e;margin-top:6px}
.stack{display:flex;height:36px;border-radius:8px;overflow:hidden;margin-top:15px}
.stack div{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;
  color:#2c1d24;transition:flex-grow .5s cubic-bezier(.2,.7,.2,1);overflow:hidden;white-space:nowrap}
.stackkey{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:#6b5f52;margin-top:10px}
.stackkey i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}

.grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  font-weight:700;margin-top:20px}

/* handoff / proposed pack — in chat */
.prop{background:var(--cream);color:var(--ink);border-radius:12px;padding:18px 17px;margin-top:16px}
.prop .lab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#7a6f74}
.prop h3{font-family:'Newsreader',serif;font-size:25px;font-weight:400;margin-top:5px;line-height:1.2}
.prop .tgt{font-size:14px;line-height:1.45;color:#4d4048;margin-top:9px}
.pact{display:flex;gap:11px;padding:13px 0;border-top:1px solid #ddd7c9}
.pact .pn{flex:none;width:23px;height:23px;border:1px solid #9c948a;border-radius:5px;display:flex;
  align-items:center;justify-content:center;font-size:12px;margin-top:1px}
.pact .pt{font-size:15px;font-weight:600;line-height:1.3;margin-top:0}

.who{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;

.assume{background:#e6e0d1;border-radius:8px;padding:12px 13px;font-size:12.5px;line-height:1.45;
  margin-top:14px;color:#5c5145}

/* ---- object pages ---- */
.body.page{background:#f6f2e9;color:var(--ink);padding:0 18px 0}

.pghead{padding:14px 0 4px}

.modh{font-family:'Newsreader',serif;font-size:20px;font-weight:400;line-height:1.22;margin-top:8px}
.modp{font-size:13px;line-height:1.55;color:#5c5145;margin-top:11px}

  padding:9px 0;border-bottom:1px solid #e6dfd0;font-weight:400}

.src{font-size:10.5px;color:#a89b8a;margin-top:12px}
.page .mod .pcard{background:#f0eade}
.pcard{background:#e9e2d4;color:var(--ink);border-radius:7px;padding:12px 13px 11px;margin-bottom:10px}
.eyebrow{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.07em;
  color:#5c5145;background:#f3eee4;border:1px solid #ddd5c6;border-radius:4px;padding:3px 7px}
.pt{font-size:15.5px;font-weight:500;line-height:1.25;margin-top:9px;letter-spacing:-.005em}
.pb{font-size:12.5px;line-height:1.42;color:#7a6f62;margin-top:3px}
.prow{display:flex;align-items:center;justify-content:space-between;margin-top:11px}

.chev{color:#a89b8a;font-size:11px;flex:none}

function rateTracker(){

  var mx=Math.max.apply(null,v), mn=Math.min.apply(null,v);
  var X=function(r){return PAD+r.x*(W-PAD*2)};
  var Y=function(x){return H-PAD-((x-mn)/((mx-mn)||1))*(H-PAD*2)};
  var last=RATES[RATES.length-1];
  var pts=RATES.map(function(r){return X(r)+','+Y(r.v)}).join(' ');
  var area='M'+X(RATES[0])+','+(H-PAD)+' L'+pts.split(' ').join(' L')+' L'+X(last)+','+(H-PAD)+' Z';
  return '<div class="mod"><div class="modk">Monitoring</div>'+
   '<h3 class="modh">New-auto rates have been easing since spring</h3>'+
   '<div class="ratenow">6.45%<span>&darr; 0.45 since March</span></div>'+
   '<svg viewBox="0 0 '+W+' '+H+'" class="ratesvg">'+
     '<path d="'+area+'" fill="rgba(176,124,216,.14)"/>'+
     '<polyline fill="none" stroke="#b07cd8" stroke-width="2" points="'+pts+'"/>'+
     '<circle cx="'+X(last)+'" cy="'+Y(last.v)+'" r="3.5" fill="#b07cd8"/>'+
   '</svg>'+

  var h=thread()+henceBlock(S.t,false);
  if(t.opts){
    h+='<div class="opts">'+t.opts.map(function(o,i){
      return '<button class="opt" data-opt="'+i+'">'+o+'</button>'}).join('')+'</div>';
    if(t.banded) h+='<div class="fieldfoot"><span>Or enter a specific answer below</span>'+
      '<span class="skip" data-opt="0">Skip this question</span></div>';
  }
  if(t.more && !t.gate) h+='<button class="pill-more" data-more="1">'+t.cta+'</button>';
  h+='</div><div style="height:26px"></div>';
  return topBar()+'<div class="body" id="scroll">'+h+'</div>'+
    (t.answer?dockTyped(t.answer):dock());
}

function render(){
  var s=document.getElementById('screen');
  s.innerHTML = S.t==='signup' ? viewSignup() : S.t==='welcome' ? viewWelcome() : S.t==='home' ? viewHome() : S.t==='entry' ? viewEntry() : S.t==='priority' ? viewPriority() : S.t==='pack' ? viewPack() : viewTurn();
  wire();
  document.getElementById('note').textContent=NOTES[S.t]||'';
  document.querySelectorAll('#vsw button').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-m')===S.mode)});
  document.querySelectorAll('#steps button').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-v')===String(S.t))});
  if(S.welcomeTimer){clearTimeout(S.welcomeTimer);S.welcomeTimer=null;}
  if(S.t==='welcome') S.welcomeTimer=setTimeout(function(){S.t='home';render();},1900);
}

function wire(){
  var s=document.getElementById('screen');
  s.querySelectorAll('[data-go]').forEach(function(e){e.onclick=function(){
    var g=e.getAttribute('data-go');
    if(g==='entry'){S.t='entry';S.log=[];}
    else if(g==='priority'||g==='pack'||g==='home'||g==='signup'||g==='welcome'){S.t=g;}
    else {S.t=parseInt(g,10);}
    render();scrollToTurn();}});
  s.querySelectorAll('[data-opt]').forEach(function(e){e.onclick=function(){
    var t=D[S.t];
    S.log.push({who:'hence',i:S.t});
    if(t.answered) S.log.push({who:'me',text:t.answered});
    S.t=S.t+1;render();scrollToTurn();}});
  s.querySelectorAll('[data-send]').forEach(function(e){e.onclick=function(){
    var t=D[S.t];
    S.log.push({who:'hence',i:S.t});
    S.log.push({who:'me',text:t.answer});
    S.t=S.t+1;render();scrollToTurn();}});
  s.querySelectorAll('[data-more]').forEach(function(e){e.onclick=function(){
    S.log.push({who:'hence',i:S.t});
    S.t=S.t+1;render();scrollToTurn();}});
  s.querySelectorAll('input[type=range]').forEach(function(e){e.oninput=function(){
    var k=this.getAttribute('data-k');
    S[k]= k==='apr' ? parseFloat(this.value) : parseInt(this.value,10);
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;
  }});
  s.querySelectorAll('[data-exp]').forEach(function(e){e.onclick=function(){
    S.expOpen=true; render();
    var mods=document.querySelectorAll('#curturn .mod');
    if(mods.length) mods[mods.length-1].scrollIntoView({block:'start'});}});
  s.querySelectorAll('[data-goal]').forEach(function(e){e.onclick=function(){
    S.goalSet=true; S.log.push({who:'hence',i:S.t}); S.t=S.t+1; S.expOpen=false;
    render(); scrollToTurn();}});
  s.querySelectorAll('[data-decline]').forEach(function(e){e.onclick=function(){
    S.declined=true;
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
  s.querySelectorAll('[data-lend]').forEach(function(e){e.onclick=function(){
    S.lend=this.getAttribute('data-lend');
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
  s.querySelectorAll('[data-term]').forEach(function(e){e.onclick=function(){
    S.term=parseInt(this.getAttribute('data-term'),10);
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
  s.querySelectorAll('[data-refopen]').forEach(function(e){e.onclick=function(){
    S.refineOpen=!S.refineOpen;
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
  s.querySelectorAll('[data-refine]').forEach(function(e){e.onclick=function(){
    var k=this.getAttribute('data-refine'); S.refine[k]=!S.refine[k];
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
  s.querySelectorAll('[data-fan]').forEach(function(e){e.onclick=function(){S.fan=true;render();}});
  s.querySelectorAll('[data-sheet]').forEach(function(e){e.onclick=function(){
    S.sheet=this.getAttribute('data-sheet')==='1'; render();}});
  s.querySelectorAll('[data-tab]').forEach(function(e){e.onclick=function(){
    S.tab=this.getAttribute('data-tab'); render();}});
  s.querySelectorAll('[data-conf]').forEach(function(e){e.onclick=function(){
    S.confOpen=!S.confOpen;
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
}

function scrollToTurn(){
  var b=document.getElementById('scroll');
  if(!b) return;
  var t=document.getElementById('curturn');
  if(!t){ b.scrollTop=0; return; }
  b.scrollTop += t.getBoundingClientRect().top - b.getBoundingClientRect().top - 8;
}

document.getElementById('steps').innerHTML=STEPS.map(function(x){
  return '<button data-v="'+x[1]+'">'+x[0]+'</button>'}).join('');
document.getElementById('vsw').onclick=function(e){
  var m=e.target.getAttribute&&e.target.getAttribute('data-m'); if(!m) return;
  S.mode=m; render(); scrollToTurn();
};
document.getElementById('steps').onclick=function(e){
  var v=e.target.getAttribute&&e.target.getAttribute('data-v');if(!v)return;
  S.log=[];
  S.expOpen=false;
  if(v==='entry'||v==='priority'||v==='pack'||v==='home'||v==='signup'||v==='welcome'){S.t=v;render();return;}
  var n=parseInt(v,10);
  for(var i=0;i<n;i++){ S.log.push({who:'hence',i:i});
    var a=D[i].answer||D[i].answered; if(a) S.log.push({who:'me',text:a}); }
  S.t=n; render(); scrollToTurn();
};

render();
</script>
</body>
</html>
