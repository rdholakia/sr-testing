<style>

.note{font-size:12px;color:#7d6d76;max-width:930px;line-height:1.5;text-align:center}

.device{width:392px;height:812px;background:var(--plum);border-radius:44px;

.fade2{animation:fu .40s cubic-bezier(.2,.7,.2,1) .16s both}
.fade3{animation:fu .40s cubic-bezier(.2,.7,.2,1) .32s both}

@keyframes dis{from{opacity:0}to{opacity:1}}

/* ------------------------------------------------------------------

   His question and figures from the Round 1 session (34620).

   Beat 0's answer is his own words, stitched from the warm-up at
   6:41 and 7:29. His question was a meta-question — "What questions

   product's own reviewer flagged that it never addressed it. This

   The $9,202 error is reproduced, compressed to two beats, and moved

function modPaths(){

   '<tr><td>Cost</td>'+PATHS.map(function(p){

function modTrade(){
  var cap=Math.max(300,takeHome()-S.ess);
  if(S.pay>cap) S.pay=cap;
  var sel=PATHS.filter(function(p){return p.id===S.path})[0]||PATHS[0];
  var apr=sel.apr!==undefined?sel.apr:S.apr;
  var n=monthsToClear(S.debt,apr,S.pay), grows=n===null;
  var MAX=2500;
  return '<div class="mod">'+
   '<div class="modk">Explore trade-offs</div>'+
   '<div class="bar" style="margin-top:14px"><div class="bl"><span>Toward the debt</span><b>'+usd(S.pay)+'</b></div>'+
     '<div class="tr"><div class="fl" style="width:'+Math.min(S.pay/MAX*100,100)+'%;background:'+(grows?'var(--t-a)':'var(--t-c)')+'"></div>'+
     '<div class="ceil" style="left:'+(intMo(apr)/MAX*100)+'%"></div></div>'+
     '<div class="ceill">The line is '+usd(intMo(apr))+' &mdash; the interest. Below it the balance rises.</div></div>'+
   '<div class="sl"><label>Toward the debt <b>'+usd(S.pay)+'</b></label>'+
     '<input type="range" data-k="pay" min="300" max="'+Math.max(500,takeHome()-S.ess)+'" step="25" value="'+Math.min(S.pay,takeHome()-S.ess)+'"></div>'+
   '<div class="sl"><label>Fixed monthly necessities <b>'+usd(S.ess)+'</b></label>'+
     '<input type="range" data-k="ess" min="9000" max="10500" step="50" value="'+S.ess+'"></div>'+
   '<div class="slout">Leaves <b>'+usd(takeHome()-S.ess)+' a month</b> to work with</div>'+
   '<div class="trows">'+
     '<div class="trow"><span>Interest accruing at '+apr+'%</span><b>'+usd(intMo(apr))+'/mo</b></div>'+
     '<div class="trow"><span>Actually reducing the balance</span><b'+(S.pay-intMo(apr)<=0?' class="neg"':'')+'>'+
       (S.pay-intMo(apr)<=0 ? 'Nothing yet' : usd(S.pay-intMo(apr))+'/mo')+'</b></div>'+
     '<div class="trow"><span>Total interest along the way</span><b'+(grows?' class="neg"':'')+'>'+(grows?'Unbounded':usd(S.pay*n-S.debt))+'</b></div>'+
   '</div>'+
   modConfidence()+
   '<div class="modfoot"><div class="mfl"><div class="mfh">'+(grows
       ? usd(Math.ceil(intMo(apr)/25)*25+25)+' a month before it starts falling'
       : (sel.id==='xfer'&&n>21?Math.round(n)+' months &mdash; past the window':(n/12).toFixed(1)+' years to clear'))+'</div>'+
     '<div class="mfs">'+usd(S.pay)+' a month, '+sel.n.toLowerCase()+(sel.id==='xfer'?', 0% for 21 months':', at '+apr+'%')+'</div></div>'+
     (S.goalSet
       ? '<span class="btn-set ghost">Target set &#10003;</span>'
       : '<button class="btn-set" data-goal="1">Set my target</button>')+
   '</div></div>';
}

function modTransfer(){
  var fee=S.debt*0.03, need=(S.debt+fee)/18, avoided=intMo(S.apr)*18;
  var fits=S.pay>=need;
  return '<div class="mod"><h3>'+usd(need)+' a month to make the transfer work</h3>'+
   '<div class="cap">$50,000 moved at a 3% fee, 18 months at 0%. The fee and the window are the market&rsquo;s; the payment is yours.</div>'+
   '<div class="trows">'+

     '<div class="trow"><span>Interest avoided over 18 months<span class="dl2">At your '+S.apr+'%</span></span><b>'+usd(avoided)+'</b></div>'+

     '<div class="trow tot"><span>Payment required to clear it</span><b'+(fits?'':' class="neg"')+'>'+usd(need)+'/mo</b></div>'+
   '</div>'+
   '<div class="modnote">'+(fits
     ? 'At '+usd(S.pay)+' a month you clear it inside the window and keep the '+usd(avoided-fee)+'.'

       'Whatever is left when the promotional rate ends reprices at the new card&rsquo;s standard APR, which is typically higher than the 15&ndash;20% you are paying now.')+
   ' A transfer that is not cleared in the window is a deferral, not a saving &mdash; and it is the version most people end up with.</div></div>';
}

function aprTracker(){
  var W=300,H=72,PAD=8, v=AVG.map(function(r){return r.v});
  var mx=Math.max.apply(null,v), mn=Math.min.apply(null,v);
  var X=function(r){return PAD+r.x*(W-PAD*2)};
  var Y=function(x){return H-PAD-((x-mn)/((mx-mn)||1))*(H-PAD*2)};
  var last=AVG[AVG.length-1];
  var pts=AVG.map(function(r){return X(r)+','+Y(r.v)}).join(' ');
  var area='M'+X(AVG[0])+','+(H-PAD)+' L'+pts.split(' ').join(' L')+' L'+X(last)+','+(H-PAD)+' Z';
  return '<div class="mod"><div class="modk">Monitoring</div>'+
   '<h3 class="modh">The average card APR, against yours</h3>'+
   '<div class="ratenow">21.4%<span style="color:#8a5a4e">&uarr; 5.1 since 2022</span></div>'+
   '<svg viewBox="0 0 '+W+' '+H+'" class="ratesvg">'+
     '<path d="'+area+'" fill="rgba(176,124,216,.14)"/>'+
     '<polyline fill="none" stroke="#b07cd8" stroke-width="2" points="'+pts+'"/>'+
     '<circle cx="'+X(last)+'" cy="'+Y(last.v)+'" r="3.5" fill="#b07cd8"/>'+
   '</svg>'+
   '<div class="ratex"><span>2022</span><span>2023</span><span>2024</span><span>2025</span><span>2026</span></div>'+

   '<p class="modp">Issuers reprice variable APRs without much notice. If any of your cards moves, I&rsquo;ll tell you which and what it does to the payoff order.</p>'+

function viewEntry(){
  return topBar()+'<div class="body" style="display:flex;flex-direction:column;justify-content:center">'+
   '<div class="avatar c">F</div><div class="hero">What&rsquo;s on your<br>money mind?</div></div>'+
   '<div class="dock"><div class="inp"><span class="ic">&#128206;</span><span class="ic">&#127908;</span>'+
   '<span class="ph" style="color:#2c1d24">I am in roughly $50,000 in credit card debt due to some recent major purchases. My wife and I currently bring home roughly $11,000 per month. Our family consists of myself, my wife, and our two children. We What questions do I need to answer for you to help me begin a plan to get out of that debt?</span>'+
   '<button class="snd" data-go="0">&uarr;</button></div></div>';
}

function viewTurn(){
  var t=D[S.t];
  var h=thread()+henceBlock(S.t,false);
  if(t.opts){
    h+='<div class="opts">'+t.opts.map(function(o,i){
      return '<button class="opt" data-opt="'+i+'">'+o+'</button>'}).join('')+'</div>';
    if(t.banded) h+='<div class="fieldfoot"><span>Or enter a specific answer below</span>'+
      '<span class="skip" data-opt="0">Skip this question</span></div>';
  }
  if(t.more && !t.gate) h+='<button class="pill-more" data-more="1">'+t.cta+'</button>';
  h+='</div><div style="height:26px"></div>';
  return topBar()+'<div class="body" id="scroll">'+h+'</div>'+
    (t.answer?dockTyped(t.answer):dock());
}

function render(){
  var s=document.getElementById('screen');
  s.innerHTML = S.t==='signup' ? viewSignup() : S.t==='welcome' ? viewWelcome() : S.t==='home' ? viewHome() : S.t==='entry' ? viewEntry() : S.t==='priority' ? viewPriority() : S.t==='pack' ? viewPack() : viewTurn();
  wire();
  document.getElementById('note').textContent=NOTES[S.t]||'';
  document.querySelectorAll('#vsw button').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-m')===S.mode)});
  document.querySelectorAll('#steps button').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-v')===String(S.t))});
  if(S.welcomeTimer){clearTimeout(S.welcomeTimer);S.welcomeTimer=null;}
  if(S.t==='welcome') S.welcomeTimer=setTimeout(function(){S.t='home';render();},1900);
}

function wire(){
  var s=document.getElementById('screen');
  s.querySelectorAll('[data-go]').forEach(function(e){e.onclick=function(){
    var g=e.getAttribute('data-go');
    if(g==='entry'){S.t='entry';S.log=[];}
    else if(g==='priority'||g==='pack'||g==='home'||g==='signup'||g==='welcome'){S.t=g;}
    else {S.t=parseInt(g,10);}
    render();scrollToTurn();}});
  s.querySelectorAll('[data-opt]').forEach(function(e){e.onclick=function(){
    var t=D[S.t];
    S.log.push({who:'hence',i:S.t});
    if(t.answered) S.log.push({who:'me',text:t.answered});
    S.t=S.t+1;syncCorrected();render();scrollToTurn();}});
  s.querySelectorAll('[data-send]').forEach(function(e){e.onclick=function(){
    var t=D[S.t];
    S.log.push({who:'hence',i:S.t});
    S.log.push({who:'me',text:t.answer});
    S.t=S.t+1;syncCorrected();render();scrollToTurn();}});
  s.querySelectorAll('[data-more]').forEach(function(e){e.onclick=function(){
    S.log.push({who:'hence',i:S.t});
    S.t=S.t+1;syncCorrected();render();scrollToTurn();}});
  s.querySelectorAll('input[type=range]').forEach(function(e){
    e.addEventListener('change',function(){
      if(this.getAttribute('data-k')==='ess'){ var cap=takeHome()-S.ess; if(S.pay>cap) S.pay=Math.max(300,cap); }
    },true);e.oninput=function(){
    var k=this.getAttribute('data-k');
    if(k==='apr10') S.apr=parseInt(this.value,10)/10;
    else S[k]=parseInt(this.value,10);
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;
  }});
  s.querySelectorAll('[data-exp]').forEach(function(e){e.onclick=function(){
    S.expOpen=true; render();
    var mods=document.querySelectorAll('#curturn .mod');
    if(mods.length) mods[mods.length-1].scrollIntoView({block:'start'});}});
  s.querySelectorAll('[data-goal]').forEach(function(e){e.onclick=function(){
    S.goalSet=true; S.log.push({who:'hence',i:S.t}); S.t=S.t+1; S.expOpen=false;
    render(); scrollToTurn();}});
  s.querySelectorAll('[data-decline]').forEach(function(e){e.onclick=function(){
    S.declined=true;
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
  s.querySelectorAll('[data-path]').forEach(function(e){e.onclick=function(){
    S.path=this.getAttribute('data-path');
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
  s.querySelectorAll('[data-refopen]').forEach(function(e){e.onclick=function(){
    S.refineOpen=!S.refineOpen;
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
  s.querySelectorAll('[data-refine]').forEach(function(e){e.onclick=function(){
    var k=this.getAttribute('data-refine'); S.refine[k]=!S.refine[k];
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
  s.querySelectorAll('[data-fan]').forEach(function(e){e.onclick=function(){S.fan=true;render();}});
  s.querySelectorAll('[data-sheet]').forEach(function(e){e.onclick=function(){
    S.sheet=this.getAttribute('data-sheet')==='1'; render();}});
  s.querySelectorAll('[data-tab]').forEach(function(e){e.onclick=function(){
    S.tab=this.getAttribute('data-tab'); render();}});
  s.querySelectorAll('[data-conf]').forEach(function(e){e.onclick=function(){
    S.confOpen=!S.confOpen;
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
}

/* the income conflict is resolved at beat 9 and stays resolved after it */
function syncCorrected(){
  return;
}

function scrollToTurn(){
  var b=document.getElementById('scroll');
  if(!b) return;
  var t=document.getElementById('curturn');
  if(!t){ b.scrollTop=0; return; }
  b.scrollTop += t.getBoundingClientRect().top - b.getBoundingClientRect().top - 8;
}

document.getElementById('steps').innerHTML=STEPS.map(function(x){
  return '<button data-v="'+x[1]+'">'+x[0]+'</button>'}).join('');
document.getElementById('vsw').onclick=function(e){
  var m=e.target.getAttribute&&e.target.getAttribute('data-m'); if(!m) return;
  S.mode=m; render(); scrollToTurn();
};
document.getElementById('steps').onclick=function(e){
  var v=e.target.getAttribute&&e.target.getAttribute('data-v');if(!v)return;
  S.log=[];
  S.expOpen=false;
  if(v==='entry'||v==='priority'||v==='pack'||v==='home'||v==='signup'||v==='welcome'){S.t=v;syncCorrected();render();return;}
  var n=parseInt(v,10);
  for(var i=0;i<n;i++){ S.log.push({who:'hence',i:i});
    var a=D[i].answer||D[i].answered; if(a) S.log.push({who:'me',text:a}); }
  S.t=n; syncCorrected(); render(); scrollToTurn();
};

render();
</script>
</body>
</html>
