<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finneas — Ask, paced. Luke / home upgrade pathway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#4b2a39;--cream:#f3efe5;--cream-2:#e9e4d6;--ink:#2c1d24;--lilac:#b57ce0;
  --t-a:#f0a47f;--t-b:#f2e076;--t-c:#abdfa6;--dim:rgba(255,255,255,.72);
  --ok:#5fa85f;--warn:#d8a24a;--bad:#c96a5a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:'Hanken Grotesk',-apple-system,sans-serif;background:#171015;color:#fff;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 16px 60px;gap:14px}

.chrome{width:100%;max-width:930px;display:flex;flex-direction:column;gap:9px}
.chrome h1{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8a7a83}
.steps{display:flex;gap:5px;flex-wrap:wrap}
.steps button{background:#241a20;border:1px solid #3a2c33;color:#bda9b4;font:inherit;font-size:11px;
  font-weight:600;padding:6px 10px;border-radius:7px;cursor:pointer}
.steps button.on{background:#fff;color:#171015;border-color:#fff}
.steps button.home{border-color:#6b4f5e}
.vsw{display:flex;gap:6px;align-items:center;margin-top:2px}
.vsw span{font-size:11px;color:#7d6d76;margin-right:4px}
.vsw button{background:#241a20;border:1px solid #3a2c33;color:#bda9b4;font:inherit;font-size:11px;
  font-weight:600;padding:6px 11px;border-radius:7px;cursor:pointer}
.vsw button.on{background:var(--lilac);color:#fff;border-color:var(--lilac)}
.conf{border-top:1px solid #e0d9c9;margin-top:15px;padding-top:13px;cursor:pointer}
.conf .ch{display:flex;align-items:center;gap:9px}
.conf .ck{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#a3967f}
.conf .cv{font-size:13px;font-weight:700;margin-left:auto}
.conf .cchev{font-size:10px;color:#a89b8a}
.conf .cbar{height:5px;background:#ddd7c9;border-radius:5px;margin-top:9px;overflow:hidden}
.conf .cbar i{display:block;height:100%;background:#c9a227;border-radius:5px}
.conf .cd{font-size:11.5px;color:#7a6f62;margin-top:7px;line-height:1.45}
.conf .clist{margin-top:12px}
.conf .cli{display:flex;gap:9px;font-size:12px;line-height:1.45;color:#5f5459;margin-top:7px}
.conf .cli i{flex:none;font-style:normal;font-size:11px;width:12px}
.conf .cli.miss{color:#8a5a4e}
.toast{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.10);
  border-radius:10px;padding:13px 15px;margin-top:16px}
.toast .tk{flex:none;width:22px;height:22px;border-radius:6px;background:var(--lilac);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px}
.toast .tt{font-size:14px;line-height:1.4;color:rgba(255,255,255,.9)}
.toast .tt b{color:#fff;font-weight:600}
.toast .tv{font-size:12.5px;font-weight:700;color:var(--lilac);cursor:pointer;flex:none;margin-left:auto}
.lace{background:rgba(255,255,255,.08);border-radius:9px;padding:12px 14px;margin-top:14px}
.lace .lk{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--lilac)}
.lace p{font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.82);margin-top:7px}
.digest{margin-top:18px}
.digest .dk{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.digest .di{background:var(--cream);color:var(--ink);border-radius:12px;padding:15px 16px;margin-top:11px}
.digest .dt{font-family:'Newsreader',serif;font-size:19px;line-height:1.2}
.digest .dd{font-size:13.5px;line-height:1.5;color:#6b5f64;margin-top:6px}
.rowa{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
  border-bottom:1px solid rgba(255,255,255,.14);padding:10px 0;font-size:13.5px}
.rowa .q{color:var(--dim);flex:1}
.rowa .a{color:#fff;font-weight:600}
.rowa .ed{color:var(--lilac);font-size:12px;text-decoration:underline;cursor:pointer;flex:none}
.two{display:flex;gap:9px;margin-top:16px}
.two .f{flex:1;background:var(--cream);color:var(--ink);border-radius:12px;padding:15px 14px}
.two .f .fk{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#a3967f}
.two .f .fh{font-family:'Newsreader',serif;font-size:18px;line-height:1.2;margin-top:7px}
.two .f .fd{font-size:12.5px;line-height:1.5;color:#5f5459;margin-top:9px}
.two .f .fd b{color:var(--ink)}
.note{font-size:12px;color:#7d6d76;max-width:930px;line-height:1.5;text-align:center}

.device{width:392px;height:812px;background:var(--plum);border-radius:44px;
  box-shadow:0 0 0 10px #100b0e,0 0 0 12px #2c2027,0 34px 70px rgba(0,0,0,.6);overflow:hidden;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px}
.body::-webkit-scrollbar{width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 22px 6px;flex:none}
.wm{font-family:'Newsreader',serif;font-size:19px}
.burger{width:22px}.burger span{display:block;height:1.5px;background:#fff;margin:5px 0}
.avatar{width:34px;height:34px;border-radius:9px;background:var(--lilac);display:flex;align-items:center;
  justify-content:center;font-family:'Newsreader',serif;font-size:19px;margin:16px 0 14px}
.avatar.c{margin:14px auto 16px}
.hero{font-family:'Newsreader',serif;font-size:29px;line-height:1.16;text-align:center}

.said{font-family:'Newsreader',serif;font-size:23px;line-height:1.26;color:#fff}
.sub{font-size:16px;line-height:1.5;color:rgba(255,255,255,.78);margin-top:11px}
.sub b{color:#fff;font-weight:600}
.ask{font-size:16px;font-weight:600;line-height:1.4;margin-top:18px;color:#fff}
.qwhy{font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.6);font-style:italic;margin-top:9px}
.fieldfoot{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:12.5px;color:var(--dim)}
.fieldfoot .skip{cursor:pointer;text-decoration:underline}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{background:transparent;border:1px solid rgba(255,255,255,.42);color:#fff;font:inherit;font-size:14.5px;
  padding:12px 15px;border-radius:22px;text-align:left;cursor:pointer;transition:.14s}
.opt:hover{background:rgba(255,255,255,.1)}
.opt.ghost{border-style:dashed;color:var(--dim)}
.turn{margin-top:8px;max-width:96%;margin-right:auto}
.fade{animation:fu .34s cubic-bezier(.2,.7,.2,1) both}
.fade2{animation:fu .40s cubic-bezier(.2,.7,.2,1) .16s both}
.fade3{animation:fu .40s cubic-bezier(.2,.7,.2,1) .32s both}
@keyframes fu{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes dis{from{opacity:0}to{opacity:1}}
.dissolve{animation:dis .34s ease both}

.mine{display:flex;justify-content:flex-end;margin:26px 0 30px}
.mine .b{background:#5e4557;color:#f3efe5;border-radius:14px;padding:18px 20px;
  font-size:16.5px;line-height:1.45;max-width:88%;text-align:left}
.recap{background:rgba(255,255,255,.08);border-radius:9px;padding:12px 14px;font-size:13.5px;
  line-height:1.45;color:rgba(255,255,255,.8);margin-top:13px}


.mathhead{font-family:'Newsreader',serif;font-size:22px;color:#fff;margin-top:26px}
ul.t{margin:13px 0 0;padding:0;list-style:none}
ul.t li{font-size:15px;line-height:1.5;color:rgba(255,255,255,.8);padding-left:16px;position:relative;margin-top:9px}
ul.t li:before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4)}
ul.t li b{color:#fff;font-weight:600}
.closing{background:rgba(255,255,255,.09);border-left:3px solid var(--lilac);border-radius:0 9px 9px 0;
  padding:14px 15px;margin-top:17px;font-size:15px;line-height:1.5}
.gapbox{border:1px dashed rgba(255,255,255,.3);border-radius:11px;padding:14px 15px;margin-top:15px}
.gapbox .gl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--lilac)}
.gapbox p{font-size:13.5px;line-height:1.5;color:var(--dim);margin-top:8px}

/* ---- cream artifacts ---- */
.mod{background:var(--cream);color:var(--ink);border-radius:12px;padding:17px;margin-top:18px}
.mod h3{font-family:'Newsreader',serif;font-size:21px;font-weight:400;line-height:1.18}
.mod .cap{font-size:12px;color:#7a6f74;margin-top:4px;line-height:1.45}
.mod .modnote{font-size:11.5px;line-height:1.5;color:#7a6f74;margin-top:12px}
.mod .modnote b{color:var(--ink)}
.big{font-family:'Newsreader',serif;font-size:36px;line-height:1;margin-top:13px}
.bigsub{font-size:12.5px;color:#7a6f74;margin-top:3px}
.sl{margin-top:15px}
.sl label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:#7a6f74;margin-bottom:2px}
.sl label b{color:var(--ink);font-size:13.5px}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;background:#d3ccbd;border-radius:4px;outline:0;margin-top:7px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--ink);cursor:pointer;border:3px solid var(--cream)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ink);
  cursor:pointer;border:3px solid var(--cream)}
.trow{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:#6b5f52;
  padding:10px 0;border-bottom:1px solid #e0d9c9}
.trows{margin-top:14px;border-top:1px solid #e0d9c9}
.trow b{color:var(--ink);font-weight:700;text-align:right;white-space:nowrap}
.trow.tot{border-bottom:0;padding-top:12px}
.trow.tot span{font-weight:700;color:var(--ink)}
.trow.tot b{font-size:18px}
.trow .neg{color:#8a5a4e}
.cmpt{background:var(--cream);color:var(--ink);border-radius:12px;padding:6px 14px 14px;margin-top:18px}
.cmpt table{border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed}
.cmpt th{text-align:right;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:#7a6f62;padding:12px 0 8px 6px;border-bottom:1px solid #cfc6b5;line-height:1.25}
.cmpt th:first-child{text-align:left;width:42%;padding-left:0}
.cmpt th:nth-child(2){width:26%}
.cmpt td{padding:9px 0 9px 6px;border-bottom:1px solid #e6dfd0;line-height:1.3;text-align:right;
  font-weight:700}
.cmpt td:first-child{text-align:left;font-weight:400;color:#6b5f52;padding-left:0}
.cmpt tr:last-child td{border-bottom:0}
.cmpt tr.hi td{background:#e6dfd0}
.cmpt tr.sec td{padding-top:16px;border-bottom:1px solid #cfc6b5}
.cmpt tr.sec td:first-child{font-size:9px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:#a3967f}
.mapw{margin-top:15px}
.mapw svg{width:100%;display:block;border-radius:9px;background:#e6dfd0}
.mapsl{margin-top:2px}
.maplab{display:flex;justify-content:space-between;font-size:10px;color:#8a7f70;margin-top:6px}
.maplab span{flex:1;text-align:center}
.maplab span:first-child{text-align:left}
.maplab span:last-child{text-align:right}
.maplab span.on{color:var(--ink);font-weight:700}
.opd{margin-top:15px;border-top:1px solid #e0d9c9;padding-top:14px}
.opd .oh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.opd .on1{font-family:'Newsreader',serif;font-size:21px;line-height:1.15}
.opd .op{font-size:19px;font-weight:700;white-space:nowrap}
.opd .om{font-size:12.5px;color:#7a6f62;margin-top:6px;line-height:1.45}
.opd .orow{display:flex;justify-content:space-between;font-size:13.5px;
  border-bottom:1px solid #e0d9c9;padding:10px 0}
.opd .orow:first-of-type{border-top:1px solid #e0d9c9;margin-top:13px}
.opd .orow span{color:#6b5f52}
.opd .orow b{font-weight:700}
.opd .orow b.up{color:#8a5a4e}
.dl2{display:block;font-size:10.5px;color:#a3967f;margin-top:2px}
.cmpt td.ql{font-weight:400;font-size:11.5px;color:#4a4038;line-height:1.35;text-align:right}
.cmpt .dl{font-size:10.5px;font-weight:400;color:#8a7f70;display:block;margin-top:2px}
.cmpt .up{color:#8a5a4e}
.cmpt .neu{color:#4a4038}
.scen{display:flex;gap:7px;margin-top:15px}
.scen .c{flex:1;background:var(--cream-2);border-radius:9px;padding:11px 9px;cursor:pointer;
  border:2px solid transparent;transition:.15s}
.scen .c.on{border-color:var(--ink);background:#fff}
.scen .c .k{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:#7a6f74;font-weight:700;line-height:1.3}
.scen .c .v{font-family:'Newsreader',serif;font-size:21px;line-height:1;margin-top:6px}
.scen .c .s{font-size:10.5px;color:#7a6f74;margin-top:3px}
.bar{margin-top:13px}
.bar .bl{display:flex;justify-content:space-between;font-size:12px;color:#6b5f52;margin-bottom:5px}
.bar .bl b{color:var(--ink)}
.bar .tr{height:11px;background:#ddd7c9;border-radius:6px;position:relative;overflow:visible}
.bar .fl{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar .ceil{position:absolute;top:-3px;bottom:-3px;width:2px;background:#7a6f74}
.stack{display:flex;height:36px;border-radius:8px;overflow:hidden;margin-top:15px}
.stack div{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;
  color:#2c1d24;transition:flex-grow .5s cubic-bezier(.2,.7,.2,1);overflow:hidden;white-space:nowrap}
.stackkey{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:#6b5f52;margin-top:10px}
.stackkey i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}

.grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  font-weight:700;margin-top:20px}


/* handoff / proposed pack — in chat */
.prop{background:var(--cream);color:var(--ink);border-radius:12px;padding:18px 17px;margin-top:16px}
.prop .lab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#7a6f74}
.prop h3{font-family:'Newsreader',serif;font-size:25px;font-weight:400;margin-top:5px;line-height:1.2}
.prop .tgt{font-size:14px;line-height:1.45;color:#4d4048;margin-top:9px}
.pact{display:flex;gap:11px;padding:13px 0;border-top:1px solid #ddd7c9}
.pact .pn{flex:none;width:23px;height:23px;border:1px solid #9c948a;border-radius:5px;display:flex;
  align-items:center;justify-content:center;font-size:12px;margin-top:1px}
.pact .pt{font-size:15px;font-weight:600;line-height:1.3;margin-top:0}
.pact .pd{font-size:12.5px;line-height:1.4;color:#6b5f64;margin-top:3px}
.who{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:2px 7px;border-radius:20px;margin-top:6px}
.who.h{background:#dfd8c8;color:#5c5145}
.who.u{background:#e6d3dd;color:#6b3f56}
.assume{background:#e6e0d1;border-radius:8px;padding:12px 13px;font-size:12.5px;line-height:1.45;
  margin-top:14px;color:#5c5145}
.assume b{color:var(--ink)}

/* ---- object pages: same system as the rent/buy prototype ---- */
.body.page{background:#f6f2e9;color:var(--ink);padding:0 18px 0}
.top.light{background:#f6f2e9}
.top.light .wm{color:var(--ink)}
.top.light .burger span{background:var(--ink)}
.pghead{padding:14px 0 4px}
.pgt{font-family:'Newsreader',serif;font-size:30px;font-weight:400;line-height:1.12;
  letter-spacing:-.012em;margin-top:11px}
.progbar{height:5px;background:#e2dac9;border-radius:5px;overflow:hidden;margin-top:16px}
.progbar i{display:block;height:100%;background:var(--lilac);border-radius:5px}
.progl{font-size:11.5px;color:#8a7f70;margin-top:7px}
.secH{font-family:'Newsreader',serif;font-size:25px;font-weight:400;letter-spacing:-.012em;
  line-height:1.15;margin:28px 0 0}
.page .mod{background:#fdfbf6;border:1px solid #e6dfd0;border-radius:12px;padding:15px 15px 14px;margin-top:13px}
.page .mod.plain{padding:14px 13px 12px}
.modk{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#a3967f}
.modh{font-family:'Newsreader',serif;font-size:20px;font-weight:400;line-height:1.22;margin-top:8px}
.modp{font-size:13px;line-height:1.55;color:#5c5145;margin-top:11px}
.page .trow{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:#6b5f52;
  padding:9px 0;border-bottom:1px solid #e6dfd0;font-weight:400}
.page .trow:last-of-type{border-bottom:0}
.page .trow b{color:var(--ink);font-weight:600;text-align:right}
.page .modnote{font-size:12px;line-height:1.5;color:#7a6f62;margin-top:11px}
.src{font-size:10.5px;color:#a89b8a;margin-top:12px}
.page .mod .pcard{background:#f0eade}
.pcard{background:#e9e2d4;color:var(--ink);border-radius:7px;padding:12px 13px 11px;margin-bottom:10px}
.eyebrow{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.07em;
  color:#5c5145;background:#f3eee4;border:1px solid #ddd5c6;border-radius:4px;padding:3px 7px}
.pt{font-size:15.5px;font-weight:500;line-height:1.25;margin-top:9px;letter-spacing:-.005em}
.pb{font-size:12.5px;line-height:1.42;color:#7a6f62;margin-top:3px}
.prow{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
.dur{font-size:8.5px;font-weight:700;letter-spacing:.07em;color:#5c5145;
  border:1px solid #c9bda9;border-radius:4px;padding:3px 8px}
.ta{font-size:12.5px;font-weight:700;cursor:pointer}
.ta i{font-style:normal;font-size:9px;vertical-align:1px;margin-left:2px}
.urg{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  border-radius:999px;padding:3px 9px}
.urg.high{background:#f0dc7a;color:#5c4a10}
.stepc{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid #e6dfd0}
.stepc:last-child{border-bottom:0}
.stepn{flex:none;width:24px;height:24px;border:1px solid #b3a795;border-radius:5px;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#5c5145;margin-top:8px}
.stepb{flex:1}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 0;border-bottom:1px solid #e6dfd0}
.qrow:last-child{border-bottom:0}
.chev{color:#a89b8a;font-size:11px;flex:none}
.pt2{font-family:'Newsreader',serif;font-size:19px;font-weight:400}
.ratenow{font-family:'Newsreader',serif;font-size:31px;margin-top:10px}
.ratenow span{font-size:12px;font-family:'Hanken Grotesk';color:#8a5a4e;margin-left:8px}
.ratesvg{width:100%;display:block;margin-top:8px}
.ratex{display:flex;justify-content:space-between;font-size:10px;color:#a89b8a;margin-top:4px}
.cmpt th.selth{color:var(--ink);border-bottom:2px solid var(--ink)}
.cmpt td.selc{background:#efe9db}

function henceBlock(n,past){

  if(t.math) h+='<div class="mathhead">'+t.math+'</div>';
  if(t.sub) h+='<div class="sub'+(past?'':' fade2')+'">'+t.sub+'</div>';
  if(t.toast) h+='<div class="toast'+(past?'':' fade3')+'" data-go="priority">'+
    '<span class="tk">&#10003;</span>'+

    '<span class="tv">View</span></div>';
  if(t.lace && S.mode==='laced') h+='<div class="lace'+(past?'':' fade3')+'"><div class="lk">'+t.lace[0]+'</div><p>'+t.lace[1]+'</p></div>';
  if(t.recapRows){ h+='<div class="fade2">'+ROWS.map(function(r){
      return '<div class="rowa"><span class="q">'+r[0]+'</span><span class="a">'+r[1]+'</span><span class="ed">Edit</span></div>';}).join('')+'</div>';
      if(S.mode==='held') h+=digest(); }
  if(t.two) h+= past ? '<div>'+twoSided()+'</div>' : '<div class="fade2">'+twoSided()+'</div>';
  if(t.mod) h+= past ? '<div>'+t.mod()+'</div>' : '<div class="fade2">'+t.mod()+'</div>';
  if(t.after) h+='<div class="sub'+(past?'':' fade3')+'">'+t.after+'</div>';
  if(t.handoff) h+= past ? '<div>'+packHTML()+'</div>' : '<div class="fade2">'+packHTML()+'</div>';
  if(t.authorise) h+=
    '<div class="said fade3" style="font-size:20px;margin-top:26px">Want me to keep this?</div>'+
    '<div class="sub fade3">Saving it puts these in your plan and starts watching comps on your block and mortgage rates. I&rsquo;ll only come back to you when something needs a decision.</div>'+

    '<button class="opt ghost" data-decline="1">Not now &mdash; just keep the answer</button></div>'+
    (S.declined?'<div class="declined fade3"><div class="dh">Kept, but not saved.</div>'+
      '<div class="dp">The answer stays in this conversation. Without an account I can&rsquo;t hold the plan, and I can&rsquo;t watch comps or rates &mdash; so nothing will reach you when they move.</div>'+
      '<button class="pill-more" data-go="signup" style="margin:14px auto 0">Actually, save it</button></div>':'');
  if(t.end) h+='<div class="avatar">F</div><div class="said">That&rsquo;s everything. It&rsquo;s on your plan now.</div>'+
    '<div class="sub">I&rsquo;ll keep an eye on the things that move, and bring you in when something needs a decision.</div>'+
    '<button class="pill-more" data-go="home" style="margin:22px auto 4px">Take me home</button>'+
    '<div class="gapbox"><div class="gl">Not designed yet &mdash; guide section 4</div>'+
    '<p>The check-in before options, and the visualized options summary, sit here. Neither exists in Figma or in this prototype, and nothing has been invented to stand in for them.</p>'+
    '<p>In Luke&rsquo;s real session the options pane read GENERATING YOUR OPTIONS with three skeleton cards labeled A, B and C, and never resolved. The Compare as options / Slides / PDF controls appeared once the response completed; he clicked none of them.</p></div>'+
    '<div class="gapbox"><div class="gl">Not designed yet &mdash; guide section 5</div>'+
    '<p>The confidence signal. Absent from Figma and from here. Pending the go/no-go.</p></div>';
  if(t.meta) h+='<div class="ask" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:700">'+t.meta+'</div>';
  if(t.ask) h+='<div class="ask">'+t.ask+'</div>';

  if(t.gapAfter && !past) h+='<div class="gapbox"><div class="gl">Not captured</div><p>'+t.gapAfter+'</p></div>';
  return h;

function rateTracker(){
  var W=300,H=72,PAD=8, v=RATES.map(function(r){return r.v});
  var mx=Math.max.apply(null,v), mn=Math.min.apply(null,v);
  var X=function(r){return PAD+r.x*(W-PAD*2)};
  var Y=function(x){return H-PAD-((x-mn)/((mx-mn)||1))*(H-PAD*2)};
  var pts=RATES.map(function(r){return X(r)+','+Y(r.v)}).join(' ');
  var area='M'+X(RATES[0])+','+(H-PAD)+' L'+pts.split(' ').join(' L')+' L'+X(RATES[RATES.length-1])+','+(H-PAD)+' Z';
  return '<div class="mod"><div class="modk">Monitoring</div>'+
   '<h3 class="modh">Rates have gone the wrong way since March</h3>'+
   '<div class="ratenow">6.69%<span>&uarr; 0.69 since March</span></div>'+
   '<svg viewBox="0 0 '+W+' '+H+'" class="ratesvg">'+
     '<path d="'+area+'" fill="rgba(176,124,216,.14)"/>'+
     '<polyline fill="none" stroke="#b07cd8" stroke-width="2" points="'+pts+'"/>'+
     '<circle cx="'+X(RATES[RATES.length-1])+'" cy="'+Y(6.69)+'" r="3.5" fill="#b07cd8"/>'+
   '</svg>'+
   '<div class="ratex"><span>Mar</span><span>Apr</span><span>Jun</span><span>Aug</span></div>'+
   '<p class="modp">On the $588,000 you&rsquo;d borrow at $735K, 6.69% costs $265 a month more than 6.00% did in March &mdash; $95,000 across a thirty-year loan.</p>'+
   '<p class="modp">I&rsquo;ll tell you if it moves half a point either way. That&rsquo;s worth $197 a month.</p>'+
   '<div class="src">Freddie Mac Primary Mortgage Market Survey &middot; 6 August 2026</div></div>';
}

function wire(){
  var s=document.getElementById('screen');
  s.querySelectorAll('[data-go]').forEach(function(e){e.onclick=function(){
    var g=e.getAttribute('data-go');
    if(g==='entry'){S.t='entry';S.log=[];}
    else if(g==='priority'||g==='pack'||g==='home'||g==='signup'||g==='welcome'){S.t=g;}
    else {S.t=parseInt(g,10);}
    render();scrollToTurn();}});
  s.querySelectorAll('[data-opt]').forEach(function(e){e.onclick=function(){
    var t=D[S.t];
    S.log.push({who:'hence',i:S.t});
    if(t.answered) S.log.push({who:'me',text:t.answered});
    S.t=S.t+1;render();scrollToTurn();}});
  s.querySelectorAll('[data-send]').forEach(function(e){e.onclick=function(){
    var t=D[S.t];
    S.log.push({who:'hence',i:S.t});
    S.log.push({who:'me',text:t.answer});
    S.t=S.t+1;render();scrollToTurn();}});
  s.querySelectorAll('[data-more]').forEach(function(e){e.onclick=function(){
    S.log.push({who:'hence',i:S.t});
    S.t=S.t+1;render();scrollToTurn();}});
  s.querySelectorAll('input[type=range]').forEach(function(e){
    e.oninput=function(){
      var k=this.getAttribute('data-k');
    if(k==='optIdx'){ S.opt=OPTS[parseInt(this.value,10)].id; }
    else { S[k]= k==='taxRate' ? parseFloat(this.value) : parseInt(this.value,10); }
      var lab=this.parentNode.querySelector('label b');
      if(lab && typeof usd==='function'){ var k=this.getAttribute('data-k'); if(S[k]!==undefined) lab.innerHTML=usd(S[k]); }
    };
    e.onchange=function(){
      var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
      render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;
    };
  });
  s.querySelectorAll('[data-fan]').forEach(function(e){e.onclick=function(){
    S.fan=true; render();}});
  s.querySelectorAll('[data-sheet]').forEach(function(e){e.onclick=function(){

    S.refineOpen=!S.refineOpen;

  s.querySelectorAll('[data-refine]').forEach(function(e){e.onclick=function(){
    var k=this.getAttribute('data-refine'); S.refine[k]=!S.refine[k];
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
  s.querySelectorAll('[data-exp]').forEach(function(e){e.onclick=function(){
    S.expOpen=true; render();
    var mods=document.querySelectorAll('#curturn .mod');
    if(mods.length) mods[mods.length-1].scrollIntoView({block:'start'});}});
  s.querySelectorAll('[data-goal]').forEach(function(e){e.onclick=function(){
    S.goalSet=true; S.log.push({who:'hence',i:S.t}); S.t=S.t+1; S.expOpen=false;
    render(); scrollToTurn();}});
  s.querySelectorAll('[data-decline]').forEach(function(e){e.onclick=function(){
    S.declined=true;
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
  s.querySelectorAll('[data-opt2]').forEach(function(e){e.onclick=function(){
    S.opt=this.getAttribute('data-opt2');
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;

  s.querySelectorAll('[data-conf]').forEach(function(e){e.onclick=function(){
    S.confOpen=!S.confOpen;
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});

  }});
}

 welcome:"The loader between signing up and home. Advances on its own.",
 home:"Where he lands once the conversation is done.",
 priority:"Priority detail. Target, actions, monitoring, questions asked, related.",
 pack:"Action detail: why it comes first, the steps, and what it counts toward."
};

document.getElementById('steps').innerHTML=STEPS.map(function(x){
  return '<button data-v="'+x[1]+'">'+x[0]+'</button>'}).join('');
document.getElementById('vsw').onclick=function(e){
  var m=e.target.getAttribute&&e.target.getAttribute('data-m'); if(!m) return;
  S.mode=m; render(); scrollToTurn();
};
document.getElementById('steps').onclick=function(e){
  var v=e.target.getAttribute&&e.target.getAttribute('data-v');if(!v)return;
  S.log=[];
  S.expOpen=false;
  if(v==='entry'||v==='priority'||v==='pack'||v==='home'||v==='signup'||v==='welcome'){S.t=v;render();return;}
  var n=parseInt(v,10);
  for(var i=0;i<n;i++){ S.log.push({who:'hence',i:i});
    var a=D[i].answer||D[i].answered; if(a) S.log.push({who:'me',text:a}); }
  S.t=n; render(); scrollToTurn();
};

render();
</script>
