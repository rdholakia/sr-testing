play:grid;grid-template-columns:repeat(3,1fr);gap:16px 6px}\n.fitem{text-align:center;font-size:12px;font-weight:600}\n.fdot{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;\n  margin:0 auto 7px;color:#fff;font-size:15px}\n.fdot.ok{background:#7ba86c}.fdot.warn{background:#d9a04a}.fdot.bad{background:#cf5f52}\n.fdot.grey{background:transparent;border:1.5px dashed #bdb2a0;color:#a89b8a;font-size:14px}\n.fitem.unknown{color:#a89b8a}\n.fnote{font-size:11.5px;line-height:1.45;color:#8a7f70;margin-top:11px}\n.viewf{text-align:right;font-size:12.5px;font-weight:600;margin-top:12px;cursor:pointer}\n.viewf i{font-style:normal;font-size:9px;vertical-align:1px;margin-left:2px}\n.sheet .wknext{background:#ebe4d6;border-radius:9px;padding:13px 14px;margin-top:14px}\n.wnk{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8a7f70}\n.wnr{font-size:12.5px;line-height:1.45;color:#6b5f52;padding:7px 0;border-bottom:1px solid #ddd5c6}\n.wnr:last-child{border-bottom:0}\n.sheet .abank{background:#ebe4d6;border-radius:9px;padding:4px 14px 6px;margin-top:14px}\n.abk{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8a7f70;\n  padding:11px 0 4px}\n.abr{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;\n  padding:11px 0;border-bottom:1px solid #ddd5c6}\n.abr:last-child{border-bottom:0}\n\n.myh{flex:none;background:var(--cream-2);color:var(--ink);text-align:center;padding:15px;\n  font-size:13px;font-weight:700;letter-spacing:.15em;cursor:pointer}\n.subhero{text-align:center;font-size:15px;line-height:1.4;color:var(--dim);margin-top:9px}\n\n\n.sheet .pcard .pt{font-family:'Hanken Grotesk',sans-serif;font-size:15.5px;font-weight:600;\n  line-height:1.28;letter-spacing:0;text-transform:none;color:#2f2620;margin-top:9px}\n.sheet .pcard .pb{font-family:'Hanken Grotesk',sans-serif;font-size:12.5px;font-weight:400;\n  line-height:1.45;letter-spacing:0;text-transform:none;color:#7a6f62;margin-top:4px}\n.sheet .prio .pt{font-family:'Newsreader',serif;font-size:19px;font-weight:400;\n  letter-spacing:0;text-transform:none;color:#2f2620}\n.sheet .rec .pt{font-family:'Newsreader',serif;font-size:19px;font-weight:400;\n  letter-spacing:0;text-transform:none;color:#2f2620}\n.sheet .prio .pb,.sheet .rec .pb,.sheet .past .pb{font-family:'Hanken Grotesk',sans-serif;\n  font-size:12.5px;font-weight:400;line-height:1.45;letter-spacing:0;text-transform:none;color:#7a6f62}\n.sheet .ta{font-family:'Hanken Grotesk',sans-serif;font-size:12.5px;font-weight:700;\n  letter-spacing:0;text-transform:none}\n\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style>\n<\/head>\n<body>\n\n<div class=\"chrome\">\n  <h1>Finneas \u00b7 Ask, paced \u00b7 Heather \u00b7 saving for Nolan's first car<\/h1>\n  <div class=\"steps\" id=\"steps\"><\/div>\n  <div class=\"vsw\" id=\"vsw\"><span>Insights:<\/span><button data-m=\"laced\">Laced through<\/button><button data-m=\"held\">Held to the end<\/button><\/div>\n<\/div>\n\n<div class=\"device\"><div class=\"screen\" id=\"screen\"><\/div><\/div>\n<div class=\"note\" id=\"note\"><\/div>\n\n<script>\n/* ------------------------------------------------------------------\n   Luke Russell \u2014 home upgrade pathway.\n   Finneas copy verbatim from the session 34515 extraction.\n   Nothing invented to bridge a gap; gaps are shown as gaps.\n   Interaction mirrors the rent/buy prototype: typed answers send from\n   the dock, banded answers are pills, analysis advances on a pill.\n------------------------------------------------------------------- */\n\nvar S={ t:'entry', refineOpen:false, refine:{}, fan:false, sheet:false, tab:'cal', mode:'laced', log:[], rules:{}, ruleAmt:{loan:310,debt:200,repair:50}, liquid:4.5, cd:5.0, confOpen:false, mo:100, yrs:6, apy:4.5, target:8000 };\n\nfunction usd(n){return '$'+Math.round(n).toLocaleString('en-US');}\nfunction usd0(n){return '$'+Math.round(n/1000)+'K';}\nfunction fv(pmt,rate,months){var r=rate/100/12;return pmt*((Math.pow(1+r,months)-1)/r);}\n\n/* ---------------- artifacts ---------------- */\n\nfunction ladderBalance(pmt,months){\n  // liquid at 4.5% for the first 3 months; from month 3 a rising share sits in 12-month CDs at 5%,\n  // reaching roughly 70% laddered by month 24. Blended rate climbs, then holds.\n  var bal=0;\n  for(var m=1;m<=months;m++){\n    var laddered = m<3 ? 0 : Math.min(0.70,(m-3)/21*0.70);\n    var r=(S.liquid*(1-laddered)+S.cd*laddered)/100/12;\n    bal=(bal+pmt)*(1+r);\n  }\n  return bal;\n}\nfunction blendedAt(m){\n  var laddered = m<3 ? 0 : Math.min(0.70,(m-3)/21*0.70);\n  return S.liquid*(1-laddered)+S.cd*laddered;\n}\n\nvar RULES=[\n {id:'loan', t:'When the car loan clears', d:'You owe $5,000&ndash;$15,000 on it. Whenever it ends, that payment is already leaving on a schedule &mdash; send it here instead.', amt:0},\n {id:'debt', t:'When you&rsquo;re debt free', d:'About two years out, by your own reckoning. Everything that was going to the payoff becomes free.', amt:0},\n {id:'repair', t:'When the repair fund is full', d:'That one has a ceiling. This one doesn&rsquo;t.', amt:0}\n];\n\nfunction modRedirect(){\n  var on=S.rules, base=S.mo;\n  var extra=0;\n  RULES.forEach(function(r){ if(on[r.id]) extra+=S.ruleAmt[r.id]; });\n  var later=base+extra;\n  var bal=ladderBalance(base,24)*Math.pow(1+blendedAt(S.yrs*12)/100/12,(S.yrs*12)-24)+ladderBalance(later,(S.yrs*12)-24);\n  return '<div class=\"mod\"><h3>What happens when something frees up<\/h3>'+\n   '<div class=\"cap\">Money that stops going somewhere else can come here automatically instead. Pick the ones you want and I&rsquo;ll set them up now, so you don&rsquo;t have to remember later.<\/div>'+\n   RULES.map(function(r){\n     var sel=on[r.id];\n     return '<div class=\"rule'+(sel?' on':'')+'\" data-rule=\"'+r.id+'\">'+\n       '<div class=\"rh\"><span class=\"rt\">'+r.t+'<\/span><span class=\"rc\">'+(sel?'&#10003;':'&#43;')+'<\/span><\/div>'+\n       '<div class=\"rd\">'+r.d+'<\/div>'+\n       (sel?'<div class=\"sl\"><label>Send here each month <b>'+usd(S.ruleAmt[r.id])+'<\/b><\/label>'+\n         '<input type=\"range\" data-k=\"rule:'+r.id+'\" min=\"0\" max=\"400\" step=\"10\" value=\"'+S.ruleAmt[r.id]+'\"><\/div>':'')+\n     '<\/div>';}).join('')+\n   '<div class=\"trows\">'+\n     '<div class=\"trow\"><span>Now<\/span><b>'+usd(base)+'/mo<\/b><\/div>'+\n     '<div class=\"trow\"><span>Once your rules fire<\/span><b>'+usd(later)+'/mo<\/b><\/div>'+\n     '<div class=\"trow tot\"><span>At '+S.yrs+' years<\/span><b>'+usd(bal)+'<\/b><\/div>'+\n   '<\/div>'+\n   '<div class=\"modnote\">'+(extra>0\n     ? 'Nothing about your paycheck changes. You&rsquo;re just deciding now where money goes when it stops going somewhere else &mdash; and I&rsquo;ll ask you to confirm before anything moves.'\n     : 'Nothing selected yet. Each of these is a decision you&rsquo;d otherwise have to remember to make, months or years from now.')+'<\/div><\/div>';\n}\n\nfunction modInvisible(){\n  var weekly=Math.round(S.mo/4.33), daily=(S.mo/30).toFixed(2);\n  return '<div class=\"mod\"><h3>What '+usd(S.mo)+' a month actually feels like<\/h3>'+\n   '<div class=\"cap\">The same money, four ways. Only the last one is invisible.<\/div>'+\n   '<div class=\"trows\">'+\n     '<div class=\"trow\"><span>Once a month, by hand<\/span><b>You decide '+S.yrs*12+' times<\/b><\/div>'+\n     '<div class=\"trow\"><span>'+usd(weekly)+' a week, by hand<\/span><b>You decide '+(S.yrs*52)+' times<\/b><\/div>'+\n     '<div class=\"trow\"><span>$'+daily+' a day, rounded up<\/span><b>You decide every day<\/b><\/div>'+\n     '<div class=\"trow tot\"><span>Auto-transfer, day after payday<\/span><b>You decide once<\/b><\/div>'+\n   '<\/div>'+\n   '<div class=\"modnote\">You said you want it to feel like it doesn&rsquo;t exist. That&rsquo;s about how many times you have to think about it, not how much goes in. <b>Pull it from checking rather than pushing it from savings<\/b>; a pull is harder to cancel by accident.<\/div><\/div>';\n}\n\nvar ACCTS=[\n {id:'hysa', n:'High-yield savings', apy:'4.5&ndash;5%', lock:'None &mdash; take it out any day',\n  who:'Ally, Marcus', good:'Simplest thing that works. Name it, automate it, ignore it.',\n  bad:'The rate floats. It can drop and nobody tells you.'},\n {id:'cd', n:'CD ladder', apy:'~5%, locked', lock:'12&ndash;18 months at a time',\n  who:'Discover, or your own bank', good:'The rate is fixed. You know the number.',\n  bad:'Touching it early costs 3&ndash;6 months of interest. And it is more to keep track of.'},\n {id:'both', n:'Savings now, CDs later', apy:'4.5% now, ~5% later', lock:'None for the first few months',\n  who:'Start at Ally, add CDs at month 3', good:'You can start this week and improve it later.',\n  bad:'It is two decisions instead of one, and the second one is easy to forget.'}\n];\n\nfunction modLadder(){\n  var start=3, bal=[];\n  for(var m=1;m<=24;m++){ bal.push(S.mo*m); }\n  return '<div class=\"mod\"><h3>How the money moves into CDs, one piece at a time<\/h3>'+\n   '<div class=\"cap\">Nothing moves for the first three months. After that, each rung locks in a rate for twelve months and rolls when it matures. The account underneath stays liquid the whole time.<\/div>'+\n   '<div class=\"trows\">'+\n     '<div class=\"trow\"><span>Months 1&ndash;3<span class=\"dl2\">Building a base<\/span><\/span><b>All liquid<\/b><\/div>'+\n     '<div class=\"trow\"><span>Month 3, once there&rsquo;s $300&ndash;$400<span class=\"dl2\">Roll a portion into a 12-month CD<\/span><\/span><b>First rung<\/b><\/div>'+\n     '<div class=\"trow\"><span>Every few months after<span class=\"dl2\">Another portion, another 12-month CD<\/span><\/span><b>Next rung<\/b><\/div>'+\n     '<div class=\"trow\"><span>Month 15 onward<span class=\"dl2\">The first CD matures &mdash; roll it again<\/span><\/span><b>Ladder running<\/b><\/div>'+\n     '<div class=\"trow tot\"><span>Always reachable<\/span><b>The newest months<\/b><\/div>'+\n   '<\/div>'+\n   '<div class=\"modnote\">A ladder means something is always maturing soon, so the money isn&rsquo;t locked away all at once. <b>Check the early-withdrawal penalty before each one<\/b> &mdash; most charge three to six months of interest. Small, but worth knowing. And if you find a CD meaningfully above 5%, a 2-year now beats a floating savings rate for this goal.<\/div><\/div>';\n}\n\nvar ACCT=[\n {id:'hysa', n:'Savings', rate:4.75, rl:'4.5&ndash;5%, floats',\n  early:'Any day, no penalty', dec:'None after setup',\n  d:'Open it this week, name it, automate it. The rate moves with the market and nobody tells you when it drops.'},\n {id:'cd',   n:'CD ladder', rate:5.0, rl:'~5%, locked',\n  early:'3&ndash;6 months&rsquo; interest', dec:'One every 12&ndash;18 months',\n  d:'Each rung fixes a rate for a year. More predictable, and more to keep track of.'},\n {id:'both', n:'Both', rate:4.9, rl:'4.5% now, ~5% later',\n  early:'Free on the newest months', dec:'One at month three',\n  d:'Start liquid this week, roll a portion into a CD once there&rsquo;s $300&ndash;$400 in there, and roll it again as each matures.'}\n];\n\nfunction goalIncome(){\n  var sel=ACCT.filter(function(a){return a.id===S.acct})[0]||ACCT[2];\n  return fv(S.mo,sel.rate,S.yrs*12);\n}\n\nvar REFINE=[\n {id:'rates', t:'The rate on anything you owe',\n  w:'You said you&rsquo;d have to check. If any of it is above 6%, that gets the money first and this waits &mdash; it outranks everything else here.'},\n {id:'timeline', t:'When he actually starts driving',\n  w:'I have used six years. If it is closer, the monthly figure has to rise and the CD ladder stops being worth the bother.'},\n {id:'car', t:'Whether you have a car in mind',\n  w:'If it is a specific one rather than a range, I&rsquo;ll work back from its real price instead of your $6,000&ndash;$10,000 band.'}\n];\n\nfunction modRefine(){\n  var n=0; REFINE.forEach(function(r){ if(S.refine[r.id]) n++; });\n  var open=S.refineOpen;\n  var h='<div class=\"mod refm\"><div class=\"rfhead\" data-refopen=\"1\">'+\n    '<div><div class=\"rfk\">Refine this answer<\/div>'+\n    '<div class=\"rfs\">'+(n?n+' added &mdash; I&rsquo;ll redo the numbers when they land':REFINE.length+' figures I had to estimate. Optional.')+'<\/div><\/div>'+\n    '<span class=\"rfchev\">'+(open?'&#9650;':'&#9660;')+'<\/span><\/div>';\n  if(open){\n    h+='<div class=\"rfbody\">'+REFINE.map(function(r){\n      var on=S.refine[r.id];\n      return '<div class=\"rfi\"><div class=\"rfh\"><div><div class=\"rft\">'+r.t+'<\/div>'+\n        '<div class=\"rfw\">'+r.w+'<\/div><\/div>'+\n        '<button class=\"rfb'+(on?' on':'')+'\" data-refine=\"'+r.id+'\">'+(on?'Added &#10003;':'&#43; Add')+'<\/button>'+\n        '<\/div><\/div>';\n    }).join('')+\n    '<div class=\"modnote\">None of it is required &mdash; the answer stands without it. Anything you add goes on your plan as something to find.<\/div><\/div>';\n  }\n  return h+'<\/div>';\n}\n\n\nfunction modAccounts(){\n  var sel=ACCT.filter(function(a){return a.id===S.acct})[0]||ACCT[2];\n  var best=Math.max.apply(null,ACCT.map(function(a){return fv(S.mo,a.rate,S.yrs*12)}));\n  var h='<div class=\"mod\"><h3>Three places to put it<\/h3>'+\n   '<div class=\"cap\">All three reach your target on '+usd(S.mo)+' a month. They differ in how locked-in it feels. Tap a column.<\/div>'+\n   '<div class=\"cmpt\" style=\"background:transparent;padding:0;margin-top:14px\"><table>'+\n   '<tr><th>&nbsp;<\/th>'+ACCT.map(function(a){\n      return '<th class=\"'+(a.id===S.acct?'selth':'')+'\" data-acct=\"'+a.id+'\" style=\"cursor:pointer\">'+a.n+'<\/th>';}).join('')+'<\/tr>'+\n   '<tr><td>Rate<\/td>'+ACCT.map(function(a){\n      return '<td class=\"neu'+(a.id===S.acct?' selc':'')+'\" data-acct=\"'+a.id+'\" style=\"font-weight:400;font-size:11px\">'+a.rl+'<\/td>';}).join('')+'<\/tr>'+\n   '<tr class=\"hi\"><td>At '+S.yrs+' years<\/td>'+ACCT.map(function(a){\n      return '<td class=\"neu'+(a.id===S.acct?' selc':'')+'\" data-acct=\"'+a.id+'\">'+usd(fv(S.mo,a.rate,S.yrs*12))+'<\/td>';}).join('')+'<\/tr>'+\n   '<tr><td>Getting at it early<\/td>'+ACCT.map(function(a){\n      return '<td class=\"neu'+(a.id===S.acct?' selc':'')+'\" data-acct=\"'+a.id+'\" style=\"font-weight:400;font-size:11px\">'+a.early+'<\/td>';}).join('')+'<\/tr>'+\n   '<tr><td>Decisions to make<\/td>'+ACCT.map(function(a){\n      return '<td class=\"neu'+(a.id===S.acct?' selc':'')+'\" data-acct=\"'+a.id+'\" style=\"font-weight:400;font-size:11px\">'+a.dec+'<\/td>';}).join('')+'<\/tr>'+\n   '<\/table><\/div>'+\n   '<div class=\"selbox\"><div class=\"selk\">'+sel.n+'<\/div><div class=\"selp\">'+sel.d+'<\/div><\/div>'+\n   '<div class=\"modnote\">The spread across all three is <b>'+usd(best-fv(S.mo,4.75,S.yrs*12))+'<\/b> at '+S.yrs+' years &mdash; less than the amount and the timeline move it.<\/div><\/div>';\n  if(S.expOpen || S.goalSet) h+=modTrade();\n  if(!S.expOpen && !S.goalSet) h+='<button class=\"pill-more\" data-exp=\"1\" style=\"margin:16px auto 0\">Explore trade-offs<\/button>';\n  return h;\n}\n\nfunction modTrade(){\n  var sel=ACCT.filter(function(a){return a.id===S.acct})[0]||ACCT[2];\n  var bal=fv(S.mo,sel.rate,S.yrs*12), put=S.mo*S.yrs*12;\n  var pctPut=Math.max(put/bal*100,6);\n  return '<div class=\"mod\">'+\n   '<div class=\"modk\">Explore trade-offs<\/div>'+\n   '<div class=\"stack\" style=\"margin-top:14px\">'+\n     '<div style=\"flex:'+pctPut+';background:var(--t-a)\">You put in<\/div>'+\n     '<div style=\"flex:'+(100-pctPut)+';background:var(--t-c)\">Interest<\/div><\/div>'+\n   '<div class=\"stackkey\"><span><i style=\"background:var(--t-a)\"><\/i>'+usd(put)+' from you<\/span>'+\n     '<span><i style=\"background:var(--t-c)\"><\/i>'+usd(bal-put)+' from the bank<\/span><\/div>'+\n   '<div class=\"sl\"><label>Every month <b>'+usd(S.mo)+'<\/b><\/label>'+\n     '<input type=\"range\" data-k ght;font-size:12.5px;font-weight:600;margin-top:12px;cursor:pointer}\n.viewf i{font-style:normal;font-size:9px;vertical-align:1px;margin-left:2px}\n.sheet .wknext{background:#ebe4d6;border-radius:9px;padding:13px 14px;margin-top:14px}\n.wnk{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8a7f70}\n.wnr{font-size:12.5px;line-height:1.45;color:#6b5f52;padding:7px 0;border-bottom:1px solid #ddd5c6}\n.wnr:last-child{border-bottom:0}\n.sheet .abank{background:#ebe4d6;border-radius:9px;padding:4px 14px 6px;margin-top:14px}\n.abk{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8a7f70;\n  padding:11px 0 4px}\n.abr{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;\n  padding:11px 0;border-bottom:1px solid #ddd5c6}\n.abr:last-child{border-bottom:0}\n\n.signup{margin-top:22px}\n.sso{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:#fff;color:#1c1c1c;\n  border:0;font:inherit;font-size:15px;font-weight:600;padding:14px;border-radius:10px;cursor:pointer;margin-bottom:9px}\n.ssoi{font-size:15px;font-weight:700}\n.ordiv{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--dim);font-size:12px}\n.ordiv::before,.ordiv::after{content:\"\";flex:1;height:1px;background:rgba(255,255,255,.22)}\n.signup .field{margin-top:4px}\n.signup label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;\n  color:var(--dim);margin-bottom:6px}\n.fakefield{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);border-radius:10px;\n  padding:14px 15px;font-size:15px;color:rgba(255,255,255,.5)}\n.mkacct{width:100%;background:var(--lilac);color:#fff;border:0;font:inherit;font-size:15px;font-weight:600;\n  padding:14px;border-radius:10px;cursor:pointer;margin-top:12px}\n.fineprint{font-size:11.5px;line-height:1.45;color:var(--dim);margin-top:12px}\n.welcome{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;\n  justify-content:center;background:#2e2620;color:#f6f1e6}\n.wmark{font-family:'Newsreader',serif;font-size:20px;letter-spacing:.02em;opacity:.6}\n.wtitle{font-family:'Newsreader',serif;font-size:32px;margin-top:14px;animation:fu .6s ease both}\n.wsub{font-size:13.5px;color:#a89b8a;margin-top:8px;animation:fu .6s .2s ease both}\n.wbar{width:150px;height:3px;background:rgba(255,255,255,.16);border-radius:3px;margin-top:22px;overflow:hidden}\n.wbar i{display:block;height:100%;width:0;background:#b57ce0;border-radius:3px;animation:fill 1.6s ease-out forwards}\n@keyframes fill{to{width:100%}}\n.myh{flex:none;background:var(--cream-2);color:var(--ink);text-align:center;padding:15px;\n  font-size:13px;font-weight:700;letter-spacing:.15em;cursor:pointer}\n.subhero{text-align:center;font-size:15px;line-height:1.4;color:var(--dim);margin-top:9px}\n\n.sheet .pcard .pt{font-family:'Hanken Grotesk',sans-serif;font-size:15.5px;font-weight:600;\n  line-height:1.28;letter-spacing:0;text-transform:none;color:#2f2620;margin-top:9px}\n.sheet .pcard .pb{font-family:'Hanken Grotesk',sans-serif;font-size:12.5px;font-weight:400;\n  line-height:1.45;letter-spacing:0;text-transform:none;color:#7a6f62;margin-top:4px}\n.sheet .prio .pt,.sheet .rec .pt{font-family:'Newsreader',serif;font-size:19px;font-weight:400;\n  letter-spacing:0;text-transform:none;color:#2f2620}\n.sheet .prio .pb,.sheet .rec .pb,.sheet .past .pb{font-family:'Hanken Grotesk',sans-serif;\n  font-size:12.5px;font-weight:400;line-height:1.45;letter-spacing:0;text-transform:none;color:#7a6f62}\n.sheet .ta{font-family:'Hanken Grotesk',sans-serif;font-size:12.5px;font-weight:700;\n  letter-spacing:0;text-transform:none}\n\n<\/style>\n<\/head>\n<body>\n\n<div class=\"chrome\">\n  <h1>Finneas \u00b7 Ask, paced \u00b7 Joshua \u00b7 retiring at 55 &nbsp;\u00b7&nbsp; BUILD 15:51<\/h1>\n  <div class=\"steps\" id=\"steps\"><\/div>\n  <div class=\"vsw\" id=\"vsw\"><span>Insights:<\/span><button data-m=\"laced\">Laced through<\/button><button data-m=\"held\">Held to the end<\/button><\/div>\n<\/div>\n\n<div class=\"device\"><div class=\"screen\" id=\"screen\"><\/div><\/div>\n<div class=\"note\" id=\"note\"><\/div>\n\n<script>\n/* ------------------------------------------------------------------\n   Joshua S \u2014 retiring at 55 on the FRS Special Risk pension.\n   His question and figures from the Round 1 session (34606).\n\n   Beat 0's answer is his own words, stitched from four moments in the\n   transcript: the young-man's-field line at 18:32, the \"room to\n   breathe\" passage at 11:56, \"bulletproof plan\" at 18:32, and the\n   distrust of the pension surviving at 9:04.\n\n   Housing: he was asked for his housing carry and answered with his\n   take-home. He caught it himself at 59:06 \u2014 \"I may have answered\n   that wrong. Because I thought it was asking me what my total take\n   home was.\" This build asks the question so the mismatch cannot\n   happen (nested inside the essentials figure) and runs on his real\n   $2,393.90 and his real $859/mo surplus.\n\n   Durations: he distrusted invented time estimates \u2014 \"I also\n   guarantee that calling my HR is going to be way more than 15\n   minutes.\" Nothing involving a third party carries one here, and the\n   FRS step says outright why it doesn't.\n------------------------------------------------------------------- */\n\nvar S={ t:'entry', refineOpen:false, refine:{}, declined:false, goalSet:false, expOpen:false, path:'a', fan:false, sheet:false, tab:'cal', mode:'laced', log:[], confOpen:false,\n        afc:110000, contrib:0, spouse:0, retire:55,   start:20000 };\n\nfunction usd(n){return '$'+Math.round(n).toLocaleString('en-US');}\nfunction usd0(n){return '$'+Math.round(n/1000)+'K';}\nfunction svcYrs(){return 23+(S.retire-55);}\nfunction pensionPct(){return Math.min(svcYrs()*3,80);}\nfunction pensionMo(){return S.afc*pensionPct()/100/12;}\nfunction yrsToGo(){return S.retire-40;}\nfunction fv(start,pmt,rate,yrs){\n  var r=rate/100/12,n=yrs*12;\n  return start*Math.pow(1+r,n)+pmt*((Math.pow(1+r,n)-1)/r);\n}\nfunction potMo(pot){return pot*0.04/12;}\nvar TARGET=10000;\n\n/* ---------------- artifacts ---------------- */\n\nfunction modPension(){\n  var y=svcYrs(), pct=pensionPct(), mo=pensionMo();\n  return '<div class=\"mod\"><h3>'+usd(mo)+' a month, for life<\/h3>'+\n   '<div class=\"cap\">'+y+' years of Special Risk service at 3% a year. Move the pay figure &mdash; it is the number the whole pension rests on.<\/div>'+\n   '<div class=\"sl\"><label>Average final compensation <b>'+usd(S.afc)+'<\/b><\/label>'+\n     '<input type=\"range\" data-k=\"afc\" min=\"80000\" max=\"140000\" step=\"2500\" value=\"'+S.afc+'\"><\/div>'+\n   '<div class=\"trows\">'+\n     '<div class=\"trow\"><span>Service at '+S.retire+'<\/span><b>'+y+' years<\/b><\/div>'+\n     '<div class=\"trow\"><span>Special Risk accrual<span class=\"dl2\">Higher than the 1.6% for regular class &mdash; confirm the rate<\/span><\/span><b>3% assumed<\/b><\/div>'+\n     '<div class=\"trow\"><span>Share of final pay<\/span><b>'+pct+'%<\/b><\/div>'+\n     '<div class=\"trow tot\"><span>Pension, every month<\/span><b>'+usd(mo)+'<\/b><\/div>'+\n   '<\/div>'+\n   '<div class=\"modnote\"><b>You have not told me your average final compensation, and I have not guessed at it.<\/b> '+\n   'It is the average of your highest eight years, not your last one. Across the range on that slider your pension moves by '+\n   usd(140000*0.69/12-80000*0.69/12)+' a month &mdash; which is why the FRS statement is the first thing on your list and not the fifth. '+\n   'Florida has no state income tax, so this figure arrives whole.<\/div><\/div>';\n}\n\nfunction modSurplus(){\n  var take=10724.84, ess=9865.55, house=2393.90, sur=take-ess;\n  var pct=sur/take*100;\n  return '<div class=\"mod\"><h3>'+usd(sur)+' a month<\/h3>'+\n   '<div class=\"cap\">Everything that lands, less everything that leaves. Your figures, to the cent.<\/div>'+\n   '<div class=\"bar\"><div class=\"bl\"><span>Share of take-home that is yours to direct<\/span><b>'+pct.toFixed(1)+'%<\/b><\/div>'+\n     '<div class=\"tr\"><div class=\"fl\" style=\"width:'+pct+'%;background:var(--t-b)\"><\/div><\/div><\/div>'+\n   '<div class=\"trows\">'+\n     '<div class=\"trow\"><span>Household take-home<\/span><b>'+usd(take)+'<\/b><\/div>'+\n     '<div class=\"trow\"><span>Essentials, all in<span class=\"dl2\">Of which housing carry is '+usd(house)+'<\/span><\/span><b>&minus;'+usd(ess)+'<\/b><\/div>'+\n     '<div class=\"trow tot\"><span>Yours to direct<\/span><b>'+usd(sur)+'<\/b><\/div>'+\n   '<\/div>'+\n   '<div class=\"modnote\">Your housing carry is <b>22% of take-home<\/b>. That is low, and it is the reason there is a surplus here at all.<\/div><\/div>';\n}\n\nfunction ssMo(){ return 2400; }  /* estimate, named as one in the confidence list */\n\nfunction ceiling(){return 859.29;}\n\nfunction planAt(age,contrib){\n  var yrs=age-40;\n  var pot=contrib>0?fv(S.start,contrib,7,yrs):0;\n  var svc=23+(age-55);\n  var pct=Math.min(svc*3,100);\n  return { pen:S.afc*pct/100/12, sav:potMo(pot), pot:pot, svc:svc, pct:pct };\n}\n\nfunction modConfidence(){\n  var open=S.confOpen;\n  return '<div class=\"conf\" data-conf=\"1\">'+\n   '<div class=\"ch\"><span class=\"ck\">Confidence<\/span>'+\n     '<span class=\"cv\">Moderate &middot; 45%<\/span>'+\n     '<span class=\"cchev\">'+(open?'&#9650;':'&#9660;')+'<\/span><\/div>'+\n   '<div class=\"cbar\"><i style=\"width:45%\"><\/i><\/div>'+\n   '<div class=\"cd\">Four figures are yours, two I looked up, and five I had to estimate. Tap to see which is which.<\/div>'+\n   (open?'<div class=\"clist\">'+\n     '<div class=\"cli\"><i>&#10003;<\/i><span><b>From you<\/b> &mdash; service years, take-home, essentials, housing carry. Used exactly as given.<\/span><\/div>'+\n     '<div class=\"cli\"><i>&#10003;<\/i><span><b>Looked up today<\/b> &mdash; the 2026 457(b) limit, no Florida income tax, the WEP repeal, and current Special Risk accrual. IRS and SSA sources.<\/span><\/div>'+\n     '<div class=\"cli miss\"><i>&#8722;<\/i><span><b>Your average final compensation.<\/b> One phone call. The biggest single estimate here.<\/span><\/div>'+\n     '<div class=\"cli miss\"><i>&#8722;<\/i><span><b>Your union retiree premium.<\/b> Not priced &mdash; the range is $120,000 to $180,000 wide across ten years. One phone call.<\/span><\/div>'+\n     '<div class=\"cli miss\"><i>&#8722;<\/i><span><b>What you have saved now.<\/b> $20,000 assumed, against your &ldquo;under $25,000&rdquo;.<\/span><\/div>'+\n     '<div class=\"cli miss\"><i>&#8722;<\/i><span><b>Your Social Security at 62.<\/b> $2,400 assumed. Your SSA statement has the real one.<\/span><\/div>'+\n     '<div class=\"cli miss\"><i>&#8722;<\/i><span><b>A 7% blended return.<\/b> An assumption about markets, and the one nobody can close.<\/span><\/div>'+\n     '<div class=\"cd\">The two phone calls take this to high. The sliders aren&rsquo;t estimates &mdash; they&rsquo;re yours to set, and they don&rsquo;t count against this score.<\/div>'+\n   '<\/div>':'')+\n  '<\/div>';\n}\n\nvar PATHS=[\n {id:'a', n:'Stop at 55', age:55, tgt:10000,\n  d:'What you asked for. The pension is at its smallest and you fund ten years of healthcare yourself.'},\n {id:'b', n:'Work to 58', age:58, tgt:10000,\n  d:'Three more years on the trucks. Three more points of pension a year, three fewer years of bridge to fund.'},\n {id:'c', n:'Aim for $8K', age:55, tgt:8000,\n  d:'Stop at 55 on a smaller number. Nothing about the plan changes &mdash; only what you are measuring it against.'}\n];\n\nfunction modGap(){\n  var set=S.contrib>0;\n  var p=planAt(S.retire,S.contrib);\n  var pen=p.pen, fromPot=p.sav, ss=ssMo();\n  var at=pen+fromPot+S.spouse, at62=at+ss;\n  var gap=TARGET-at, gap62=TARGET-at62;\n  var MAX=12000;\n  return '<div class=\"mod\">'+\n   '<div class=\"modk\">Explore trade-offs<\/div>'+\n   '<div class=\"bar\" style=\"margin-top:14px\"><div class=\"bl\"><span>At '+S.retire+'<\/span><b>'+usd(at)+'<\/b><\/div>'+\n     '<div class=\"tr\"><div class=\"fl\" style=\"width:'+Math.min(at/MAX*100,100)+'%;background:'+(gap>0?'var(--t-a)':'var(--t-c)')+'\"><\/div>'+\n     '<div class=\"ceil\" style=\"left:'+(TARGET/MAX*100)+'%\"><\/div><\/div><\/div>'+\n   '<div class=\"bar\"><div class=\"bl\"><span>From 62<\/span><b>'+usd(at62)+'<\/b><\/div>'+\n     '<div class=\"tr\"><div class=\"fl\" style=\"width:'+Math.min(at62/MAX*100,100)+'%;background:'+(gap62>0?'var(--t-b)':'var(--t-c)')+'\"><\/div>'+\n     '<div class=\"ceil\" style=\"left:'+(TARGET/MAX*100)+'%\"><\/div><\/div>'+\n     '<div class=\"ceill\">Line: '+usd(TARGET)+' a month.<\/div><\/div>'+\n   '<div class=\"trows\">'+\n     '<div class=\"trow\"><span>FRS pension<span class=\"dl2\">'+p.pct+'% of '+usd(S.afc)+', my estimate of your final pay<\/span><\/span><b>'+usd(pen)+'<\/b><\/div>'+\n     '<div class=\"trow\"><span>Social Security, from 62<\/span><b>'+usd(ss)+'<\/b><\/div>'+\n   '<\/div>'+\n   '<div class=\"agew\"><div class=\"agel\">Stop working at<\/div><div class=\"ages\">'+\n     [55,56,57,58,59,60].map(function(y){\n       return '<button class=\"ageb'+(S.retire===y?' on':'')+'\" data-age=\"'+y+'\">'+y+'<\/button>';}).join('')+'<\/div><\/div>'+\n   '<div class=\"sl\"><label>Added monthly savings <b>'+(set?usd(S.contrib)+'/mo':'&mdash;')+'<\/b><\/label>'+\n     '<input type=\"range\" data-k=\"contrib\" min=\"0\" max=\"'+Math.round(ceiling())+'\" step=\"25\" value=\"'+S.contrib+'\"><\/div>'+\n   (set?'<div class=\"slout\">Adds <b>'+usd(fromPot)+' a month<\/b> in retirement<\/div>':'')+\n   '<div class=\"sl\"><label>Her retirement income <b>'+(S.spouse>0?usd(S.spouse)+'/mo':'&mdash;')+'<\/b><\/label>'+\n     '<input type=\"range\" data-k=\"spouse\" min=\"0\" max=\"5000\" step=\"100\" value=\"'+S.spouse+'\"><\/div>'+\n   modConfidence()+\n   '<div class=\"modfoot\"><div class=\"mfl\"><div class=\"mfh\">'+usd(at)+' a month at '+S.retire+'<\/div>'+\n     '<div class=\"mfs\">'+usd(at62)+' once Social Security starts at 62<\/div><\/div>'+\n     (S.goalSet\n       ? '<span class=\"btn-set ghost\">Target set &#10003;<\/span>'\n       : '<button class=\"btn-set\" data-goal=\"1\">Set my target<\/button>')+\n   '<\/div><\/div>';\n}\n\nfunction goalIncome(){\n  var q=planAt(S.retire,S.contrib);\n  return q.pen+q.sav+S.spouse;\n}\n\nvar REFINE=[\n {id:'afc', t:'Your average final compensation',\n  w:'The pension is a percentage of it, and I have modelled $110,000. If your real average is nearer $90,000, the pension covers materially less of the target and the 457(b) stops being optional.'},\n {id:'prem', t:'The union retiree premium at 55',\n  w:'I have not priced it at all. Under $800 a month and you are in good shape; over $1,500 and the bridge alone eats $180,000 and wants its own bucket.'},\n {id:'has457', t:'Whether your department offers a 457(b)',\n  w:'One question to HR. If it doesn&rsquo;t, the bridge vehicle becomes Roth contributions plus a taxable brokerage, and the Rule of 55 matters again.'},\n {id:'spouse', t:'What your wife&rsquo;s retirement brings',\n  w:'If she has her own, $10,000 a month is a household number rather than yours alone. Nothing here needs to know where she works.'}\n];\n\nfunction modRefine(){\n  var n=0; REFINE.forEach(function(r){ if(S.refine[r.id]) n++; });\n  var open=S.refineOpen;\n  var h='<div class=\"mod refm\"><div class=\"rfhead\" data-refopen=\"1\">'+\n    '<div><div class=\"rfk\">Refine this answer<\/div>'+\n    '<div class=\"rfs\">'+(n?n+' added &mdash; I&rsquo;ll redo the numbers when they land':REFINE.length+' figures I had to estimate. Optional.')+'<\/div><\/div>'+\n    '<span class=\"rfchev\">'+(open?'&#9650;':'&#9660;')+'<\/span><\/div>';\n  if(open){\n    h+='<div class=\"rfbody\">'+REFINE.map(function(r){\n      var on=S.refine[r.id];\n      return '<div class=\"rfi\"><div class=\"rfh\"><div><div class=\"rft\">'+r.t+'<\/div>'+\n        '<div class=\"rfw\">'+r.w+'<\/div><\/div>'+\n        '<button class=\"rfb'+(on?' on':'')+'\" data-refine=\"'+r.id+'\">'+(on?'Added &#10003;':'&#43; Add')+'<\/button>'+\n        '<\/div><\/div>';\n    }).join('')+\n    '<div class=\"modnote\">None of it is required &mdash; the answer stands without it. Anything you add goes on your plan as something to find.<\/div><\/div>';\n  }\n  return h+'<\/div>';\n}\n\n\nfunction modOptions(){\n  var path=PATHS.filter(function(x){return x.id===S.path})[0]||PATHS[0];\n  function incomeAt(x){ var q=planAt(x.age,S.contrib); return q.pen+q.sav+S.spouse; }\n  var h='<div class=\"mod\"><h3>Three ways to close it<\/h3>'+\n   '<div class=\"cap\">'+(S.contrib>0||S.spouse>0\n     ? 'Built on what you&rsquo;ve set &mdash; '+(S.contrib>0?usd(S.contrib)+' a month saved':'nothing saved')+\n       (S.spouse>0?' and '+usd(S.spouse)+' from her side':' and nothing from her side')+'.'\n     : 'On your income alone, with nothing set aside yet.')+' Tap a column.<\/div>'+\n   '<div class=\"cmpt three\" style=\"background:transparent;padding:0;margin-top:14px\"><table>'+\n   '<tr><th>&nbsp;<\/th>'+PATHS.map(function(x){\n      return '<th class=\"'+(x.id===S.path?'selth':'')+'\" data-path=\"'+x.id+'\" style=\"cursor:pointer\">'+x.n+'<\/th>';}).join('')+'<\/tr>'+\n   '<tr><td>Pension<\/td>'+PATHS.map(function(x){\n      var q=planAt(x.age,S.contrib);\n      return '<td class=\"neu'+(x.id===S.path?' selc':'')+'\" data-path=\"'+x.id+'\">'+usd(q.pen)+'<span class=\"dl\">'+q.svc+' yrs<\/span><\/td>';}).join('')+'<\/tr>'+\n   '<tr><td>Income at that age<\/td>'+PATHS.map(function(x){\n      return '<td class=\"neu'+(x.id===S.path?' selc':'')+'\" data-path=\"'+x.id+'\">'+usd(incomeAt(x))+'<\/td>';}).join('')+'<\/tr>'+\n   '<tr class=\"hi\"><td>Against the target<\/td>'+PATHS.map(function(x){\n      var d=x.tgt-incomeAt(x);\n      return '<td class=\"'+(d>0?'up':'neu')+(x.id===S.path?' selc':'')+'\" data-path=\"'+x.id+'\">'+(d>0?'&minus;'+usd(d):'clears')+'<span class=\"dl\">'+usd(x.tgt)+' target<\/span><\/td>';}).join('')+'<\/tr>'+\n   '<tr><td>Years of bridge<\/td>'+PATHS.map(function(x){\n      return '<td class=\"neu'+(x.id===S.path?' selc':'')+'\" data-path=\"'+x.id+'\" style=\"font-weight:400;font-size:11px\">'+(65-x.age)+' years<\/td>';}).join('')+'<\/tr>'+\n   '<\/table><\/div>'+\n   '<div class=\"selbox\"><div class=\"selk\">'+path.n+'<\/div><div class=\"selp\">'+path.d+'<\/div><\/div>';\n\n  h+='<div class=\"modnote\">None of these is fixed. Open the trade-offs and you can move what you save, when you stop, or what her side brings &mdash; every column moves with it.<\/div><\/div>';\n  if(S.expOpen || S.goalSet) h+=modGap();\n  if(!S.expOpen && !S.goalSet) h+='<button class=\"pill-more\" data-exp=\"1\" style=\"margin:16px auto 0\">Explore trade-offs<\/button>';\n  return h;\n}\n\nvar ACC=[\n {n:'457(b)',   lim:'$24,500', pen:'None, at any age', use:'The bridge account'},\n {n:'Roth IRA', lim:'$7,500 each', pen:'None on contributions', use:'Tax-free later'},\n {n:'HSA',      lim:'If HDHP', pen:'None for medical', use:'Best-taxed of the three'}\n];\n\nfunction modAccounts(){\n  return '<div class=\"mod\"><h3>The three levers, in order<\/h3>'+\n   '<div class=\"cap\">Ordered by what they do for someone stopping at 55, not by size.<\/div>'+\n   '<div class=\"cmpt three\" style=\"background:transparent;padding:0;margin-top:14px\"><table>'+\n   '<tr><th>&nbsp;<\/th><th>1 &middot; 457(b)<\/th><th>2 &middot; Roth<\/th><th>3 &middot; HSA<\/th><\/tr>'+\n   '<tr><td>2026 limit<\/td>'+ACC.map(function(a,i){\n      return '<td class=\"'+(i===0?'win':'neu')+'\">'+a.lim+'<\/td>';}).join('')+'<\/tr>'+\n   '<tr class=\"hi\"><td>Penalty before 59&frac12;<\/td>'+ACC.map(function(a,i){\n      return '<td class=\"'+(i===0?'win':'neu')+'\" style=\"font-weight:'+(i===0?700:400)+';font-size:10.5px\">'+a.pen+'<\/td>';}).join('')+'<\/tr>'+\n   '<tr><td>What it is for<\/td>'+ACC.map(function(a){\n      return '<td class=\"neu\" style=\"font-weight:400;font-size:10.5px\">'+a.use+'<\/td>';}).join('')+'<\/tr>'+\n   '<\/table><\/div><\/div>';\n}\n\n\n/* ---------------- handoff pack ---------------- */\n\nvar PACK=[\n {g:'Week 1 &mdash; get the numbers', n:1,\n  t:'Pull your FRS Personalized Benefits Statement',\n  d:'frs.myflorida.com &rarr; My FRS &rarr; Benefits Statement. Write down three things: your Special Risk accrual rate, your projected monthly benefit at 55 with your expected service, and your DROP eligibility date. <b>If it shows Regular Class instead of Special Risk, flag it with HR immediately<\/b> &mdash; that is a filing error worth thousands a year.',\n  who:'u',wl:'You pull it &middot; I&rsquo;ll read it with you'},\n {n:2,t:'Get the union retiree health premium in writing',\n  d:'One call to your benefits office, the three questions, and ask them to email you the answer. Verbal quotes from benefits offices are worth what you paid for them.',\n  who:'u',wl:'You call &middot; I&rsquo;ll write the questions'},\n {n:3,t:'Ask HR whether the department offers a 457(b)',\n  d:'One email. Availability, provider, and how to enrol. Most Florida departments do &mdash; often through Nationwide, MissionSquare or Voya.',\n  who:'u',wl:'You send it &middot; I&rsquo;ll draft it'},\n {n:4,t:'List every debt on one page',\n  d:'Creditor, balance, rate, minimum payment, months remaining &mdash; mortgage, car loan, student loans, any cards. You need this before any sequencing decision, and I don&rsquo;t have any of it.',\n  who:'u',wl:'You list it &middot; I&rsquo;ll do the sequencing'},\n {n:5,t:'Pull your Social Security statement',\n  d:'ssa.gov &rarr; my Social Security &rarr; download the latest statement. Note the projected benefit at 62, 67 and 70. The Fairness Act repealed WEP, so your statement should show the full number rather than a reduced one.',\n  who:'u',wl:'You pull it &middot; I&rsquo;ll slot it in'},\n\n {g:'Week 2 &mdash; open the accounts', n:6,\n  t:'Enrol in the 457(b), if one exists',\n  d:'Start at $200 a month just to establish the account and get the auto-deduction rhythm going. Inside it, pick the target-date 2040 fund &mdash; it matches your timeline. If that isn&rsquo;t offered, take the lowest-expense S&amp;P 500 or total-market index option, ideally under 0.10%.',\n  who:'u',wl:'You enrol &middot; I&rsquo;ll check the fund choice'},\n {n:7,t:'Open Roth IRAs for you and your spouse',\n  d:'Fidelity or Schwab &mdash; both free, no minimums. Set up automatic monthly contributions toward the $7,500 cap each, at whatever level works.',\n  who:'u',wl:'You open them &middot; I&rsquo;ll set the amounts'},\n\n {g:'Month 2&ndash;3 &mdash; optimise and calibrate', n:8,\n  t:'Raise the 457(b) contribution',\n  d:'Once you have seen a couple of paychecks with the initial $200, bump toward the 2026 limit of $24,500 a year if cash flow allows. <b>If you can only hit half that you are still on track<\/b> &mdash; the account starting now matters more than maxing it.',\n  who:'u',wl:'You decide &middot; I&rsquo;ll tell you when the limit moves'},\n {n:9,t:'Confirm whether you&rsquo;re HSA-eligible',\n  d:'Ask HR whether your health plan is HSA-compatible. If it is, open one &mdash; it is the best-taxed account there is. If your union plan isn&rsquo;t compatible, skip it and don&rsquo;t lose sleep over it.',\n  who:'u',wl:'You ask &middot; one question'},\n {g:'What I&rsquo;ll watch', w:true,\n  t:'The 457(b) contribution limit',\n  d:'It rises most years. When it moves I&rsquo;ll tell you, so you raise the deduction rather than discovering it in April.'},\n {w:true, t:'Any change to FRS Special Risk',\n  d:'Accrual rate, DROP terms, vesting. You said part of why you want your own plan is in case the retirement you were promised isn&rsquo;t there &mdash; so I&rsquo;ll watch it rather than assume it.'},\n {w:true, t:'Your two numbers landing',\n  d:'The moment the FRS statement and the premium quote arrive, every figure here gets recomputed and the confidence on this answer moves.'}\n];\n\nfunction packHTML(){\n  var pot=fv(S.start,S.contrib,7,yrsToGo());\n  var h='<div class=\"prop\"><div class=\"lab\">What to do next<\/div>'+\n   '<h3>Retire at 55<\/h3>'+\n   '<div class=\"tgt\">Nine steps across the next three months, and three things I&rsquo;ll keep an eye on. Week one is all information &mdash; five errands that turn my estimates into your numbers.<\/div>';\n  PACK.forEach(function(p){\n    if(p.g) h+='<div class=\"pgrp\">'+p.g+'<\/div>';\n    if(p.w){\n      h+='<div class=\"pact watch\"><div class=\"pn eye\">&#9673;<\/div><div>'+\n         '<div class=\"pt\">'+p.t+'<\/div><div class=\"pd\">'+p.d+'<\/div><\/div><\/div>';\n    } else {\n      h+='<div class=\"pact\"><div class=\"pn\">'+p.n+'<\/div><div>'+\n         '<div class=\"pt\">'+p.t+'<\/div><div class=\"pd\">'+p.d+'<\/div>'+\n         '<span class=\"who '+p.who+'\">'+p.wl+'<\/span><\/div><\/div>';\n    }\n  });\n  h+='<div class=\"assume\">The figures here are calculated from the numbers you shared, or are reasonable estimates where a detail was unstated. The confidence note on the math names which is which.<\/div><\/div>';\n  return h;\n}\n\n/* ---------------- priority + action pages ---------------- */\n\nvar ACTIONS=[\n {pri:['Retire at 55'], t:'Pull the FRS benefits statement',\n  b:'Three numbers off one document. Your accrual rate, your projected benefit at 55, and your DROP date. Everything else on this priority sizes off them.',\n  tag:'3 STEPS'},\n {pri:['Retire at 55'], t:'Get the union retiree premium in writing',\n  b:'The widest unknown in the plan. Between $48,000 and $180,000 across the ten-year bridge, and one call settles which.',\n  tag:'3 QUESTIONS', cta:'Draft the questions'},\n {pri:['Retire at 55','Stay debt free'], t:'Open the 457(b) at $200 a month',\n  b:'No early-withdrawal penalty at any age once you separate. It is the only account built for stopping at 55.',\n  tag:'2 STEPS', cta:'Draft the email'},\n {pri:['Retire at 55'], t:'Rebuild the plan when the numbers land',\n  b:'Four of my ten figures are estimates. Two phone calls turn them into facts, and I redo everything.',\n  tag:'I&rsquo;LL RUN IT', cta:'Send to Finneas'}\n];\n\nvar ACT_STEPS=[\n {n:1,t:'Log in at frs.myflorida.com and open your Benefits Statement',\n  b:'My FRS &rarr; Benefits Statement. I am not putting a time on this one: you said you have not been in there before, so finding your login could take two minutes or twenty and I would only be guessing.',\n  cta:'Walk me through it', tag:'No estimate'},\n {n:2,t:'Write down three numbers',\n  b:'Your Special Risk accrual rate &mdash; it should read 3% a year, and if it says 1.6% you are filed as regular class and that needs fixing before anything else. Your projected benefit at 55 with 23 years. Your DROP eligibility date.',\n  cta:'Talk it through', tag:'On the statement'},\n {n:3,t:'Bring them back and I&rsquo;ll redo every figure',\n  b:'Your average final compensation is the single biggest estimate in this plan. The moment I have the real one, the pension, the gap, the bridge and the confidence score all move together.',\n  cta:'Send to Finneas', tag:\"I'll run it\"}\n];\n\nvar LIMITS=[{x:0,v:20500},{x:.25,v:22500},{x:.5,v:23000},{x:.75,v:23500},{x:1,v:24500}];\n\n/* ---------------- dialogue ---------------- */\nvar D=[\n\n/* 0 \u2014 open, voiced. Asks nothing about money. */\n{ says:\"Before I run anything &mdash; why fifteen years, and why now?\",\n  sub:\"Not the plan yet. Just what&rsquo;s behind it.\",\n  answer:\"I&rsquo;m 40, and 55 is when I age out. It&rsquo;s a young man&rsquo;s field &mdash; I don&rsquo;t want to be much older still trying to hop on and off trucks, because it does beat you up. For years the more I made, the more things cost, and we only just hit a place where we&rsquo;ve got room to breathe and don&rsquo;t feel like we&rsquo;re drowning. So now I want to shift from just paying the bills to actually building something. What I want is a bulletproof plan &mdash; one where I can feel confident there aren&rsquo;t holes in it. And part of it is in case the retirement I was promised isn&rsquo;t there when I reach that point.\" },\n\n/* 1 \u2014 the reframe. Short. Nothing asserted that he hasn't given me. */\n{ says:\"You&rsquo;ve already built most of your plan &mdash; we just need two more numbers.\",\n  sub:\"You asked for one with no holes in it. So I&rsquo;ll show my work: run your figures, name anything I had to estimate, and tell you which parts are phone calls rather than guesses.\",\n  ask:\"Does that land right?\",\n  opts:[\"That&rsquo;s it\",\"Close, but there&rsquo;s more to it\",\"Not really &mdash; let me restate it\"],\n  answered:\"That&rsquo;s it\" },\n\n/* 2 \u2014 intake. Six questions, not ten. */\n{ bare:true,\n  toast:\"Started a priority for you &mdash; <b>Retire at 55<\/b>. Nothing is saved until you say so.\",\n  meta:\"1 of 6\",\n  ask:\"Which FRS plan are you in?\",\n  why:\"This is the fork everything hangs off. The Pension Plan pays a formula for life; the Investment Plan is a portable balance. The whole strategy changes on the answer.\",\n  opts:[\"FRS Pension Plan &mdash; a monthly check for life\",\"FRS Investment Plan &mdash; a portable account\",\"I&rsquo;m already in DROP\",\"Not sure\"],\n  answered:\"FRS Pension Plan\" },\n\n/* 3 */\n{ bare:true, meta:\"2 of 6\",\n  ask:\"How many years of creditable service will you have at 55?\",\n  why:\"Special Risk accrues at 3% a year against your average final compensation. Every year is three percentage points of your pension, so 23 years and 28 years are a different retirement.\",\n  banded:true,\n  opts:[\"Under 20\",\"20&ndash;22\",\"23&ndash;25\",\"26&ndash;28\",\"29+\"],\n  answered:\"23 years\" },\n\n/* 4 */\n{ bare:true, meta:\"3 of 6\",\n  ask:\"What monthly income do you want to be living on?\",\n  why:\"In today&rsquo;s dollars. This is the target everything gets measured against, and I&rsquo;d rather have it from you than infer it from your spending.\",\n  banded:true,\n  opts:[\"Under $5,000\",\"$5,000&ndash;$7,000\",\"$7,000&ndash;$10,000\",\"$10,000\",\"More than $10,000\"],\n  answered:\"$10,000 a month\",\n  lace:[\"Working while you answer\",\"Two things are in your favour that most early retirees don&rsquo;t get. Florida has no state income tax, so a dollar of pension arrives whole. And the Social Security Fairness Act repealed WEP in January 2025 &mdash; your FRS pension no longer reduces your Social Security. If you&rsquo;ve read older planning material, it was wrong about that.\"] },\n\n/* 5 */\n{ bare:true, meta:\"4 of 6\",\n  ask:\"What&rsquo;s your household take-home each month, after tax?\",\n  why:\"Both of you combined &mdash; what actually lands in the account. This is the top of the cash-flow picture and nothing below it makes sense without it.\",\n  banded:true,\n  opts:[\"Under $6,000\",\"$6,000&ndash;$8,000\",\"$8,000&ndash;$11,000\",\"Over $11,000\"],\n  answered:\"$10,724.84\" },\n\n/* 6 */\n{ bare:true, meta:\"5 of 6\",\n  ask:\"And your monthly essentials, all in?\",\n  why:\"Housing, food, utilities, insurance, transport, minimum debt payments. Everything that goes out whether or not you decide anything that month.\",\n  banded:true,\n  opts:[\"Under $6,000\",\"$6,000&ndash;$8,000\",\"$8,000&ndash;$10,000\",\"Over $10,000\"],\n  answered:\"$9,865.55\" },\n\n/* 7 \u2014 the question he got wrong last time, asked so it can't happen */\n{ bare:true, meta:\"6 of 6\",\n  ask:\"Of that, how much is the housing carry?\",\n  why:\"A slice of the number you just gave me, not a new one. Mortgage principal and interest, property tax, insurance, HOA. Not utilities, not repairs, and not any extra principal you throw at it.\",\n  banded:true,\n  opts:[\"Under $2,000\",\"$2,000&ndash;$3,000\",\"$3,000&ndash;$4,500\",\"Over $4,500\"],\n  answered:\"$2,393.90\",\n  lace:[\"Working while you answer\",\"Florida homeowners&rsquo; insurance is up more than 40% statewide since 2020, and for most people it sits inside this number rather than beside it. I&rsquo;m taking your figure as current rather than assuming a trend on top of it.\"] },\n\n/* 8 \u2014 the answered set */\n{ recapRows:true,\n  says:\"That&rsquo;s everything I need.\",\n  sub:\"Six questions instead of ten. The rest I can look up, or it doesn&rsquo;t change the answer.\",\n  cta:\"Show me the math\",\n  more:true },\n\n/* 9 \u2014 the math: the whole answer, first */\n{ more:true, math:\"The Math\",\n  says:\"You&rsquo;re starting from a better position than most people who want to stop at 55.\",\n  sub:\"Three structural advantages, none of which you have to do anything to get. <b>Special Risk class<\/b> accrues your pension at a higher rate per year than regular class. <b>Florida has no state income tax<\/b>, so every dollar of that pension arrives whole. And a <b>union plan that follows you into retirement<\/b> covers the ten years before Medicare that stop most early retirements dead.<br><br>On your income alone, $10,000 a month probably means retiring later than 55. Right now you clear about $859/mo after expenses. Saving that into a retirement account and stopping at 55 gets you to about $7,423.\",\n  mod:function(){return modAccounts()+modRefine();}, recap:\"The three levers, side by side.\",\n  cta:\"See my options\" },\n\n/* 10 \u2014 the options, with the explorer generated inside */\n{ more:true,\n  mod:modOptions, recap:\"Three paths, and the trade-off you opened.\", gate:true,\n  cta:\"Let&rsquo;s talk about healthcare\" },\n\n/* 11 \u2014 the bridge */\n{ more:true, math:\"The healthcare bridge\",\n  toastFn:function(){\n    return 'Target added to <b>Retire at 55<\/b> &mdash; '+usd(goalIncome())+' a month at '+S.retire+\n      (S.contrib>0?', saving '+usd(S.contrib)+' a month':'')+\n      (S.spouse>0?', '+usd(S.spouse)+' from her side':'')+'.';\n  },\n  says:\"Retiring at 55 means ten years before Medicare.\",\n  sub:\"The premium is the single biggest unknown in this plan, and it isn&rsquo;t a number I can look up. It varies by department, by contract, and by whether your wife is covered too.\",\n  after:\"<b>Close this now, not at 54.<\/b> One call to your union benefits office, and I&rsquo;ve put the three questions on your plan.<br><br><b>$500&ndash;$800 a month and you&rsquo;re in great shape.<\/b> At $1,500+, or with gaps in the cover, ten years of it is $120,000&ndash;$180,000 &mdash; a line item rather than a footnote, and one that wants its own bucket.\",\n  cta:\"And the debt?\" },\n\n/* 12 \u2014 the debt piece */\n{ more:true, math:\"Your debt\",\n  says:\"Nothing here needs fixing. One thing needs a date.\",\n  sub:\"You&rsquo;re debt-free apart from the house and the cars, and you want to keep it that way. I don&rsquo;t have the balances or the rates, so I won&rsquo;t price any of it &mdash; but car loans at moderate rates can run alongside a savings plan rather than blocking it.\",\n  after:\"The one to put a date on is the mortgage. <b>Aim to have it paid off, or refinanced to a low fixed rate, well before 55.<\/b> Carrying it into early retirement is workable &mdash; it just shrinks your margin in the years where the margin is doing the most work.\",\n  cta:\"Get a step-by-step guide\" },\n\n/* 13 \u2014 the handoff */\n{ more:true,\n  says:\"Here&rsquo;s what I&rsquo;d put on your plan.\",\n  sub:\"Grouped by when. Week one is all information-gathering &mdash; nothing here asks you to move money before you know what you&rsquo;re working with.\",\n  handoff:true, authorise:true, gate:true },\n\n];\n\nvar ROWS=[\n ['Why this matters','A plan without holes in it'],\n ['FRS plan','Pension Plan &middot; Special Risk'],\n ['Service at 55','23 years'],\n ['Target in retirement','$10,000/mo'],\n ['Household take-home','$10,724.84/mo'],\n ['Essentials, all in','$9,865.55/mo'],\n ['Of that, housing','$2,393.90/mo']];\n\nvar STEPS=[['Entry','entry'],['Why are you asking','0'],['The reframe','1'],['Intake','2'] r plan and starts watching the 457(b) limit and any change to FRS Special Risk. I&rsquo;ll only come back to you when something needs a decision.<\/div>'+\n    '<div class=\"opts fade3\">'+\n    '<button class=\"opt\" data-go=\"signup\">Save it to my plan<\/button>'+\n    '<button class=\"opt\" data-go=\"10\">Change the target first<\/button>'+\n    '<button class=\"opt ghost\" data-decline=\"1\">Not now &mdash; just keep the answer<\/button><\/div>'+\n    (S.declined?'<div class=\"declined fade3\"><div class=\"dh\">Kept, but not saved.<\/div>'+\n      '<div class=\"dp\">The answer stays in this conversation. Without an account I can&rsquo;t hold the plan, and I can&rsquo;t watch the 457(b) limit or anything that changes in FRS Special Risk &mdash; so nothing will reach you when it moves.<\/div>'+\n      '<button class=\"pill-more\" data-go=\"signup\" style=\"margin:14px auto 0\">Actually, save it<\/button><\/div>':'');\n  if(false) h+='<div class=\"avatar\">F<\/div><div class=\"said\">Kept, but not saved.<\/div>'+\n    '<div class=\"sub\">The answer stays in this conversation. Without an account I can&rsquo;t hold the plan, and I can&rsquo;t watch the 457(b) limit or anything that changes in FRS Special Risk &mdash; so nothing will reach you when it moves.<\/div>'+\n    '<button class=\"pill-more\" data-go=\"signup\" style=\"margin:22px auto 4px\">Actually, save it<\/button>';\n  if(t.meta) h+='<div class=\"ask\" style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:700\">'+t.meta+'<\/div>';\n  if(t.ask) h+='<div class=\"ask\">'+t.ask+'<\/div>';\n  if(t.why) h+='<div class=\"qwhy\">'+t.why+'<\/div>';\n  return h;\n}\n\nfunction thread(){\n  return S.log.map(function(m){\n    return m.who==='me'\n      ? '<div class=\"mine\"><div class=\"b\">'+m.text+'<\/div><\/div>'\n      : henceBlock(m.i,true)+'<\/div>';\n  }).join('');\n}\n\nfunction lightBar(){\n  return '<div class=\"top light\"><div class=\"wm\" data-go=\"e ecked 21 August 2026<\/div><\/div>';\n}\nfunction viewPriority(){\n  var pot=fv(S.start,S.contrib,7,yrsToGo());\n  return lightBar()+'<div class=\"body page\" id=\"scroll\">'+\n   '<div class=\"pghead\">'+\n     '<span class=\"urg high\">Running<\/span>'+\n     '<h2 class=\"pgt\">Retire at 55<\/h2>'+\n     '<div class=\"progbar\"><i style=\"width:0%\"><\/i><\/div>'+\n     '<div class=\"progl\">0 of 4 actions done &middot; started 21 August<\/div>'+\n   '<\/div>'+\n   '<div class=\"mod\"><div class=\"modk\">Target<\/div>'+\n   '<h3 class=\"modh\">'+(S.goalSet?usd(goalIncome())+' a month at '+S.retire+', from the trade-offs you set.':usd(TARGET)+' a month at 55, on a plan with the holes named.')+'<\/h3>'+\n   '<div class=\"trow\"><span>Years to go<\/span><b>'+yrsToGo()+'<\/b><\/div>'+\n   '<div class=\"trow\"><span>Service at 55<\/span><b>'+svcYrs()+' years &middot; '+pensionPct()+'%<\/b><\/div>'+\n   '<div class=\"trow\"><span>Clearing each month<\/span><b>'+usd(859.29)+'<\/b><\/div>'+\n   '<div class=\"trow\"><span>Going into savings<\/span><b>'+(S.goalSet&&S.contrib>0?usd(S.contrib)+'/mo':'Not set')+'<\/b><\/div>'+\n   '<div class=\"trow\"><span>Projected at 55<\/span><b>'+usd(pensionMo()+potMo(pot))+'/mo<\/b><\/div>'+\n   '<p class=\"modp\">Nothing is set up yet, and four of the ten figures behind that projection are estimates. Two phone calls fix that.<\/p><\/div>'+\n   '<h1 class=\"secH\">Actions for this priority<\/h1>'+\n   '<div class=\"mod plain\">'+ACTIONS.map(actionCard).join('')+'<\/div>'+\n   limitTracker()+\n   '<div class=\"mod\"><div class=\"modk\">Also watching<\/div>'+\n   '<h3 class=\"modh\">Any change to FRS Special Risk<\/h3>'+\n   '<p class=\"modp\">You said part of why you want your own plan is in case the retirement you were promised isn&rsquo;t there when you reach it. That is a reasonable thing to watch rather than worry about, so I will watch it: if the legislature moves on Special Risk accrual, the DROP terms, or the vesting rules, you hear it from me and we re-run the numbers that day.<\/p><\/div>'+\n   '<div class=\"mod\"><div class=\"modk\">What could change this<\/div>'+\n   '<h3 class=\"modh\">A regular-class filing error<\/h3>'+\n   '<p class=\"modp\">If your FRS statement shows 1.6% rather than 3%, you are filed as regular class and the whole retirement math changes. It is rare and it is a clerical fix, but it outranks everything else on this page until you have looked.<\/p><\/div>'+\n   '<div class=\"mod\"><div class=\"modk\">Questions you&rsquo;ve asked<\/div>'+\n   '<div class=\"qrow\"><div><div class=\"pt2\">How should I plan to retire at 55?<\/div>'+\n   '<div class=\"pb\">The pension, the surplus, the ten-year healthcare bridge, and what actually closes the gap &mdash; 21 August<\/div><\/div>'+\n   '<span class=\"chev\">&#9656;<\/span><\/div><\/div>'+\n   '<div class=\"mod\"><div class=\"modk\">Related<\/div>'+\n   '<div class=\"qrow\"><div><div class=\"pt2\">Stay debt free<\/div>'+\n   '<div class=\"pb\">House and cars only, and you want to keep it that way. The car clearing is worth more to this plan than the account you pick.<\/div><\/div>'+\n   '<span class=\"chev\">&#9656;<\/span><\/div>'+\n   '<div class=\"qrow\"><div><div class=\"pt2\">Three months of expenses in reserve<\/div>'+\n   '<div class=\"pb\">Your own short-term goal. It draws on the same $859 as this does, and it should probably go first.<\/div><\/div>'+\n   '<span class=\"chev\">&#9656;<\/span><\/div><\/div>'+\n   '<div style=\"height:20px\"><\/div><\/div>'+dock();\n}\nfunction viewPack(){\n  return lightBar()+'<div class=\"body page\" id=\"scroll\">'+\n   '<div class=\"pghead\">'+\n     '<span class=\"eyebrow\">RETIRE AT 55<\/span>'+\n     '<h2 class=\"pgt\">Pull the FRS benefits statement<\/h2>'+\n     '<div class=\"progbar\"><i style=\"width:0%\"><\/i><\/div>'+\n     '<div class=\"progl\">0 of 3 steps done<\/div>'+\n   '<\/div>'+\n   '<div class=\"mod\"><div class=\"modk\">Why this first<\/div>'+\n   '<h3 class=\"mo modp\">A verbal quote from a benefits office is worth what you paid for it. Ask them to put it in writing.<\/p><\/div>'+\n   '<div class=\"mod\"><div class=\"modk\">Also counts toward<\/div>'+\n   '<div class=\"qrow\" data-go=\"priority\"><div><div class=\"pt2\">Retire at 55<\/div>'+\n   '<div class=\"pb\">Four of the ten figures behind your projection unlock from this one document.<\/div><\/div>'+\n   '<span class=\"chev\">&#9656;<\/span><\/div><\/div>'+\n   '<div style=\"height:20px\"><\/div><\/div>'+dock();\n}\nfunction viewEntry(){\n  return topBar()+'<div class=\"body\" style=\"display:flex;flex-direction:column;justify-content:center\">'+\n   '<div class=\"avatar c\">F<\/div><div class=\"hero\">What&rsquo;s on your<br>money mind?<\/div><\/div>'+\n   '<div class=\"dock\"><div class=\"inp\"><span class=\"ic\">&#128206;<\/span><span class=\"ic\">&#127908;<\/span>'+\n   '<span class=\"ph\" style=\"color:#2c1d24\">I am looking for ways to retire within the next 15 years when I reach 55. I am a firefighter in the state of Florida and will &ldquo;age out&rdquo; in my department so I will not take a penalty on my FRS retirement. How should I start planning and saving so I can live comfortably and well within my means if I retire at 55?<\/span>'+\n   '<button class=\"snd\" data-go=\"0\">&uarr;<\/button><\/div><\/div>';\n}\n\nfunction viewTurn(){\n  var t=D[S.t];\n  var h=thread()+henceBlock(S.t,false);\n  if(t.opts){\n    h+='<div class=\"opts\">'+t.opts.map(function(o,i){\n      return '<button class=\"opt\" data-opt=\"'+i+'\">'+o+'<\/button>'}).join('')+'<\/div>';\n    if(t.banded) h+='<div class=\"fieldfoot\"><span>Or enter a specific answer below<\/span>'+\n      '<span class=\"skip\" data-opt=\"0\">Skip this question<\/span><\/div>';\n  }\n  if(t.more && !t.gate) h+='<button class=\"pill-more\" data-more=\"1\">'+t.cta+'<\/button>';\n  h+='<\/div><div style=\"height:26px\"><\/div>';\n  return topBar()+'<div class=\"body\" id=\"scroll\">'+h+'<\/div>'+\n    (t.answer l('[data-decline]').forEach(function(e){e.onclick=function(){\n    S.declined=true;\n    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;\n    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});\n  s.querySelectorAll('[data-goal]').forEach(function(e){e.onclick=function(){\n    S.goalSet=true;\n    S.log.push({who:'hence',i:S.t});\n    S.t=S.t+1; S.expOpen=false;\n    render(); scrollToTurn();}});\n  s.querySelectorAll('[data-refopen]').forEach(function(e){e.onclick=function(){\n    S.refineOpen=!S.refineOpen;\n    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;\n    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});\n  s.querySelectorAll('[data-refine]').forEach(function(e){e.onclick=function(){\n    var k=this.getAttribute('data-refine'); S.refine[k]=!S.refine[k];\n    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;\n    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});\n  s.querySelectorAll('[data-exp]').forEach(function(e){e.onclick=function(){\n    S.expOpen=true; render();\n    var mods=document.querySelectorAll('#curturn .mod');\n    if(mods.length) mods[mods.length-1].scrollIntoView({block:'start'});}});\n  s.querySelectorAll('[data-path]').forEach(function(e){e.onclick=function(){\n    S.path=this.getAttribute('data-path');\n    S.retire=(PATHS.filter(function(x){return x.id===S.path})[0]||PATHS[0]).age;\n    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;\n    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;\n  }});\n  s.querySelectorAll('input[type=range]').forEach(function(e){\n    /* live label while dragging; full recompute on release, so the drag\n       isn't interrupted by the DOM being rebuilt underneath the thumb */\n    e.oninput=function(){\n      var k=this.getAttribute('data-k');\n      S[k]=parseInt(this.value,10);\n      var lab=this.parentNode.querySelector('label b');\n      if(lab) lab.innerHTML = (k==='spouse'||k==='contrib') ? usd(S[k])+'/mo' : usd(S[k]);\n    };\n    e.onchange=function(){\n      var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;\n      render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;\n    };\n  });\n  s.querySelectorAll('[data-fan]').forEach(function(e){e.onclick=function(){S.fan=true;render();}});\n  s.querySelectorAll('[data-sheet]').forEach(function(e){e.onclick=function(){\n    S.sheet=this.getAttribute('data-sheet')==='1'; render();}});\n  s.querySelectorAll('[data-tab]').forEach(function(e){e.onclick=function(){\n    S.tab=this.getAttribute('data-tab'); render();}});\n  s.querySelectorAll('[data-conf]').forEach(function(e){e.onclick=function(){\n    S.confOpen=!S.confOpen;\n    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;\n    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});\n}\n\nfunction scrollToTurn(){\n  var b=document.getElementById('scroll');\n  if(!b) return;\n  var t=document.getElementById('curturn');\n  if(!t){ b.scrollTop=0; return; }\n  b.scrollTop += t.getBoundingClientRect().top - b.getBoundingClientRect().top - 8;\n}\n\ndocument.getElementById('steps').innerHTML=STEPS.map(function(x){\n  return '<button data-v=\"'+x[1]+'\">'+x[0]+'<\/button>'}).join('');\ndocument.getElementById('vsw').onclick=function(e){\n  var m=e.target.getAttribute&&e.target.getAttribute('data-m'); if(!m) return;\n  S.mode=m; render(); scrollToTurn();\n};\ndocument.getElementById('steps').onclick=function(e){\n  var v=e.target.getAttribute&&e.target.getAttribute('data-v');if(!v)return;\n  S.log=[];\n  S.expOpen=false;\n  if(v==='entry'||v==='priority'||v==='pack'||v==='home'||v==='signup'||v==='welcome'){S.t=v;render();return;}\n  var n=parseInt(v,10);\n  for(var i=0;i<n;i++){ S.log.push({who:'hence',i:i});\n    var a=D[i].answer||D[i].answered; if(a) S.log.push({who:'me',text:a}); }\n  S.t=n; render(); scrollToTurn();\n};\n\nrender();\n<\/script>\n<\/body>\n<\/html>\n"};

 {id:'chad', name:'Chad', q:'Find out what the $50,000 in card debt is actually costing, and clear it', file:'chad-ask.html'},
 {id:'whitney', name:'Whitney', q:'Finance the truck without taking the dealer&rsquo;s word for the rate', file:'whitney-ask.html'},
 {id:'luke',    name:'Luke',    q:'Move up from the 2018 starter house, land outside the Portland city limits', file:'luke-ask.html'},
 {id:'heather', name:'Heather', q:'Save for Nolan&rsquo;s first car, and make it feel like it doesn&rsquo;t exist', file:'heather-ask.html'},
 {id:'josh',    name:'Josh',    q:'Retire at 55 on the FRS pension, with a plan that has no holes in it', file:'josh-ask.html'}
];

var STAGES=[
 {n:'Entry',        note:'Their real question, verbatim, sitting typed in the composer.',
  m:{chad:'entry', whitney:'entry', luke:'entry', heather:'entry', josh:'entry'}},
 {n:'Why are you asking', note:'An open, voiced question that asks nothing about money. The answer is theirs, from the transcript.',
  m:{chad:'0', whitney:'0', luke:'0', heather:'0', josh:'0'}},
 {n:'The reframe',  note:'The question under their question, named back and confirmed. <b>Watch: is it earned from what they said, or asserted from their data?</b>',
  m:{chad:'1', whitney:'1', luke:'1', heather:'1', josh:'1'}},
 {n:'Intake',       note:'The motive prunes the questions. Each carries a one-line rationale, and they run as one block. A priority is created here as a toast.',
  m:{chad:'2', whitney:'2', luke:'3', heather:'2', josh:'2'}},

var st=0, mode='laced', show={chad:true,whitney:true,luke:true,heather:true,josh:true};

function drawStages(){
  document.getElementById('stage').innerHTML=STAGES.map(function(s,i){
    return '<button data-i="'+i+'"'+(i===st?' class="on"':'')+'>'+s.n+'</button>';
  }).join('');
  document.querySelectorAll('#stage button').forEach(function(b){
    b.onclick=function(){ st=parseInt(this.getAttribute('data-i'),10); drawStages(); drawGrid(); };
  });
  document.getElementById('note').innerHTML='<b>'+STAGES[st].n+'.</b> '+STAGES[st].note;
}

function drawGrid(){
  var s=STAGES[st];
  document.getElementById('grid').innerHTML=PEOPLE.filter(function(p){return show[p.id]}).map(function(p){
    var target=s.m[p.id];
    var body = target
      ? '<iframe id="fr-'+p.id+'"></iframe>'
      : '<div class="miss">No equivalent beat in '+p.name+'&rsquo;s flow.</div>';
    return '<div class="col"><div class="chead"><span class="who">'+p.name+'</span>'+
      '<span class="qq">'+p.q+'</span></div>'+
      '<div class="beat">'+(target?s.n:'&mdash;')+'</div>'+
      '<div class="frame">'+body+'</div></div>';
  }).join('');
  PEOPLE.forEach(function(p){
    var target=s.m[p.id]; if(!target) return;
    var fr=document.getElementById('fr-'+p.id); if(!fr) return;
    fr.onload=function(){ jump(fr, target); };
    fr.srcdoc=DOCS[p.id];
  });
}

function jump(fr, target){
  try{
    var w=fr.contentWindow, d=fr.contentDocument;
    /* drive the prototype through its own step switcher, so state is built the same way */
    var btn=d.querySelector('#steps button[data-v="'+target+'"]');
    if(btn) btn.click();
    /* apply the insight mode */
    var mb=d.querySelector('#vsw button[data-m="'+mode+'"]');
    if(mb) mb.click();
    /* hide the prototype's own chrome so only the phone shows */
    var c=d.querySelector('.chrome'); if(c) c.style.display='none';
    d.body.style.padding='0';
    d.body.style.background='transparent';
    d.body.style.minHeight='0';
  }catch(e){ console.warn('jump failed', e); }
}

document.querySelectorAll('[data-mode]').forEach(function(b){
  b.onclick=function(){
    mode=this.getAttribute('data-mode');
    document.querySelectorAll('[data-mode]').forEach(function(x){x.classList.remove('on')});
    this.classList.add('on'); drawGrid();
  };
});
document.querySelectorAll('[data-show]').forEach(function(b){
  b.onclick=function(){
    var k=this.getAttribute('data-show');
    show[k]=!show[k]; this.classList.toggle('on',show[k]); drawGrid();
  };
});
document.getElementById('prev').onclick=function(){ if(st>0){st--;drawStages();drawGrid();} };
document.getElementById('next').onclick=function(){ if(st<STAGES.length-1){st++;drawStages();drawGrid();} };
document.onkeydown=function(e){
  if(e.key==='ArrowRight'){document.getElementById('next').click();}
  if(e.key==='ArrowLeft'){document.getElementById('prev').click();}
};

drawStages(); drawGrid();
</script>
