 had been built. He said he would have corrected it before\n   answering anything else \u2014 \"I do need to make a correction on the\n   income amount to then go ahead and update that stuff\" \u2014 so it\n   opens the analysis here rather than closing it.\n\n   Tone is emotion-neutral throughout. He named that as the thing he\n   liked: \"it's being very emotion neutral... some other AI platforms\n   can be a little too yes-man, rah-rah.\"\n------------------------------------------------------------------- */\n\nvar S={ t:'entry', path:'aval', expOpen:false, goalSet:false, declined:false, refineOpen:false, refine:{}, fan:false, sheet:false, tab:'cal', mode:'laced', log:[], confOpen:false, corrected:false,\n        debt:50000, apr:17.5, ess:9750, pay:500 };\n\nfunction usd(n){var v=Math.round(n);return (v<0?'&minus;$':'$')+Math.abs(v).toLocaleString('en-US');}\nfunction takeHome(){return 11000;}\nfunction surplus(){return takeHome()-S.ess;}\nfunction intMo(apr){return S.debt*apr/100/12;}\nfunction monthsToClear(bal,apr,pay){\n  var r=apr/100/12;\n  if(r<=0) return pay>0 ? bal/pay : null;   /* 0% transfer: no interest to outrun */\n  if(pay<=bal*r) return null;\n  return -Math.log(1-bal*r/pay)/Math.log(1+r);\n}\n\n/* ---------------- artifacts ---------------- */\n\nfunction modConfidence(){\n  var open=S.confOpen;\n  return '<div class=\"conf\" data-conf=\"1\">'+\n   '<div class=\"ch\"><span class=\"ck\">Confidence<\/span>'+\n     '<span class=\"cv\">Moderate &middot; 60%<\/span>'+\n     '<span class=\"cchev\">'+(open?'&#9650;':'&#9660;')+'<\/span><\/div>'+\n   '<div class=\"cbar\"><i style=\"width:60%\"><\/i><\/div>'+\n   '<div class=\"cd\">What this measures: how much of the answer rests on figures you gave me, against figures I inferred. It is at 60% because two of your figures are bands rather than numbers, and one input was skipped.<\/div>'+\n   (open?'<div class=\"clist\">'+\n     '<div class=\"cli\"><i>&#10003;<\/i><span>Your balance, take-home, card count, APR band, payment status and employer match &mdash; used exactly as given<\/span><\/div>'+\n     '<div class=\"cli\"><i>&#10003;<\/i><span>Today&rsquo;s balance-transfer terms, personal loan rate ranges and the average card APR &mdash; looked up today<\/span><\/div>'+\n     '<div class=\"cli miss\"><i>&#8722;<\/i><span>Per-card APRs. Without them I can tell you the shape of each path but not which one wins.<\/span><\/div>'+\n     '<div class=\"cli miss\"><i>&#8722;<\/i><span>Your exact savings balance and your exact monthly necessities. Both are bands, and the necessities band alone swings your payoff time by years.<\/span><\/div>'+\n     '<div class=\"cd\">The APR list is the one thing standing between this and high.<\/div>'+\n   '<\/div>':'')+\n  '<\/div>';\n}\n\n\nfunction modSurplus(){\n  var s=surplus(), lo=takeHome()-10500, hi=takeHome()-9000;\n  return '<div class=\"mod\"><h3>'+usd(s)+' a month against the debt<\/h3>'+\n   '<div class=\"cap\">You gave necessities as a band. Move it &mdash; the width of that band is the widest thing in this answer.<\/div>'+\n   '<div class=\"sl\"><label>Fixed monthly necessities <b>'+usd(S.ess)+'<\/b><\/label>'+\n     '<input type=\"range\" data-k=\"ess\" min=\"9000\" max=\"10500\" step=\"50\" value=\"'+S.ess+'\"><\/div>'+\n   '<div class=\"trows\">'+\n     '<div class=\"trow\"><span>Household take-home<\/span><b>'+usd(takeHome())+'<\/b><\/div>'+\n     '<div class=\"trow\"><span>Fixed necessities<\/span><b>&minus;'+usd(S.ess)+'<\/b><\/div>'+\n     '<div class=\"trow\"><span>Interest accruing at '+S.apr+'%<\/span><b class=\"neg\">&minus;'+usd(intMo(S.apr))+'<\/b><\/div>'+\n     '<div class=\"trow tot\"><span>Actually reducing the balance<\/span><b'+(s-intMo(S.apr)<=0?' class=\"neg\"':'')+'>'+usd(s-intMo(S.apr))+'<\/b><\/div>'+\n   '<\/div>'+\n   '<div class=\"modnote\">Across the band you gave me the surplus runs '+usd(lo)+' to '+usd(hi)+'. '+\n   '<b>Interest alone is '+usd(intMo(S.apr))+' a month.<\/b> Anything below that is not slow progress &mdash; it is no progress. '+\n   'One month of tracking settles which end of that band you are actually at.<\/div><\/div>';\n}\n\nvar PATHS=[\n {id:'aval', n:'Avalanche', how:'Highest APR first', best:'Costs least', catch:'No early wins',\n  d:'Pay minimums on everything, throw every extra dollar at the card with the highest interest rate. Mathematically optimal &mdash; saves the most money and gets you out fastest. Works best if you can stay disciplined for two to three years without needing a quick win.'},\n {id:'snow', n:'Snowball',  how:'Smallest balance first', best:'Early wins', catch:'Costs more',\n  d:'Pay minimums on everything, attack the smallest balance until it&rsquo;s gone, then roll that payment to the next. Costs a bit more in total interest but delivers early wins that keep people on track. Choose this if you know you need momentum to stay motivated.'},\n {id:'cons', n:'Consolidation', how:'0% BT or personal loan', best:'Freezes the rate', catch:'Needs 670+ credit', apr:0,\n  d:'Freezes or lowers your interest rate and simplifies to one payment, but requires good credit and the discipline not to reload the cards. A 0% balance transfer has a deadline cliff at 18&ndash;21 months; a personal loan is slower but safer. Whether it makes sense depends on your individual card APRs, which I don&rsquo;t have yet.'}\n];\n\nfunction goalPay(){ return S.pay; }\n\nvar REFINE=[\n {id:'aprs', t:'Your actual APRs',\n  w:'If any card is above 25%, that card jumps to the front of the line regardless of balance. If all cards are at 15%, the avalanche-versus-snowball difference shrinks and momentum becomes a reasonable default.'},\n {id:'efund', t:'Your emergency fund balance',\n  w:'If you&rsquo;re at $5,000, I&rsquo;d pause aggressive paydown briefly to build to $10,000 first. At $15,000, go straight to offense.'},\n {id:'credit', t:'Your credit score',\n  w:'If it&rsquo;s below 670, balance-transfer cards likely aren&rsquo;t available to you and t eturn p.id===S.path})[0]||PATHS[0];\n  var h='<div class=\"mod\"><h3>Three ways to clear it<\/h3>'+\n   '<div class=\"cap\">I can describe all three. I can&rsquo;t rank them until I have your per-card APRs &mdash; the input you skipped. Tap a column.<\/div>'+\n   '<div class=\"cmpt three\" style=\"background:transparent;padding:0;margin-top:14px\"><table>'+\n   '<tr><th>&nbsp;<\/th>'+PATHS.map(function(p){\n      return '<th class=\"'+(p.id===S.path?'selth':'')+'\" data-path=\"'+p.id+'\" style=\"cursor:pointer\">'+p.n+'<\/th>';}).join('')+'<\/tr>'+\n   '<tr><td>Method<\/td>'+PATHS.map(function(p){\n      return '<td class=\"neu'+(p.id===S.path?' selc':'')+'\" data-path=\"'+p.id+'\" style=\"font-weight:400;font-size:10.5px\">'+p.how+'<\/td>';}).join('')+'<\/tr>'+\n   '<tr class=\"hi\"><td>Clears in<\/td>'+PATHS.map(function(p){\n      var apr=p.apr!==undefined?p.apr:S.apr;\n      var n=monthsToClear(S.debt,apr,S.pay);\n      var over=(p.id==='xfer'&&n!==null&&n>21);\n      var floor=Math.ceil(intMo(apr)/25)*25+25;\n      return '<td class=\"'+(n===null||over?'up':'neu')+(p.id===S.path?' selc':'')+'\" data-path=\"'+p.id+'\">'+\n        (n===null\n          ? 'Needs '+usd(floor)+'<span class=\"dl\">before the balance starts falling<\/span>'\n          : Math.round(n)+' mo'+(p.id==='xfer'?'<span class=\"dl\">'+(over?'past the 21-mo window':'inside the window')+'<\/span>':''))+\n        '<\/td>';}).join('')+'<\/tr>'+\n   '<tr><td>Strength<\/td>'+PATHS.map(function(p){\n      return '<td class=\"win'+(p.id===S.path?' selc':'')+'\" data-path=\"'+p.id+'\" style=\"font-size:10.5px\">'+p.best+'<\/td>';}).join('')+'<\/tr>'+\n   '<tr><td>Cost<\/td>'+PATHS.map(function(p){\n      return '<td class=\"up'+(p.id===S.path?' selc':'')+'\" data-path=\"'+p.id+'\" style=\"font-weight:400;font-size:10.5px\">'+p.catch+'<\/td>';}).join('')+'<\/tr>'+\n   '<\/table><\/div>'+\n   '<div class=\"selbox\"><div class=\"selk\">'+sel.n+'<\/div><div class=\"selp\">'+sel.d+'<\/div><\/div>'+\n   '<div v class=\"dk\">What I found while you were answering<\/div>'+\n   '<div class=\"di\"><div class=\"dt\">Interest alone is $625&ndash;$833 a month<\/div>'+\n   '<div class=\"dd\">At $50,000 and 15&ndash;20%. Any payment under that figure means the balance rises rather than falls, which makes it the first number to check your surplus against.<\/div><\/div>'+\n   '<div class=\"di\"><div class=\"dt\">Your rate is below the market average<\/div>'+\n   '<div class=\"dd\">Cards average around 21.4% right now. At 15&ndash;20% you are already better placed than most &mdash; which also means a consolidation loan has less room to beat you than the marketing suggests.<\/div><\/div>'+\n   '<div class=\"di\"><div class=\"dt\">Transfer offers run 18&ndash;21 months at a 3&ndash;5% fee<\/div>'+\n   '<div class=\"dd\">The fee on $50,000 is $1,500 at 3%. Whether that is worth paying depends entirely on whether the balance can be gone before the window closes.<\/div><\/div><\/div>';\n}\n\nfunction henceBlock(n,past){\n  var t=D[n];\n  var h='<div class=\"turn'+(past?'':(t.bare?' dissolve':' fade'))+'\"'+(past?'':' id=\"curturn\"')+'>';\n  if(t.toastFn) h+='<div class=\"toast'+(past?'':' fade3')+'\" data-go=\"priority\">'+\n    '<span class=\"tk\">&#10003;<\/span><span class=\"tt\">'+t.toastFn()+'<\/span>'+\n    '<span class=\"tv\">View<\/span><\/div>';\n  if(!t.bare&&t.says) h+='<div class=\"avatar\">F<\/div>';\n  if(t.says) h+='<div class=\"said\">'+t.says+'<\/div>';\n  if(t.math) h+='<div class=\"mathhead\">'+t.math+'<\/div>';\n  if(t.sub) h+='<div class=\"sub'+(past?'':' fade2')+'\">'+t.sub+'<\/div>';\n  if(t.toast) h+='<div class=\"toast'+(past?'':' fade3')+'\" data-go=\"priority\">'+\n    '<span class=\"tk\">&#10003;<\/span>'+\n    '<span class=\"tt\">'+t.toast+'<\/span>'+\n    '<span class=\"tv\">View<\/span><\/div>';\n  if(t.lace && S.mode==='laced') h+='<div class=\"lace'+(past?'':' fade3')+'\"><div class=\"lk\">'+t.lace[0]+'<\/div><p>'+t.lace[1]+'<\/p><\/div>';\n  if(t.recapRo  ? '<div class=\"mine\"><div class=\"b\">'+m.text+'<\/div><\/div>'\n      : henceBlock(m.i,true)+'<\/div>';\n  }).join('');\n}\n\nfunction lightBar(){\n  return '<div class=\"top light\"><div class=\"wm\" data-go=\"entry\">Finneas<\/div>'+\n    '<div class=\"burger\"><span><\/span><span><\/span><\/div><\/div>';\n}\nfunction eyebrowOf(p){\n  return p.pri.slice(0,2).join(', ').toUpperCase()+(p.pri.length>2?', +'+(p.pri.length-2):'');\n}\nfunction actionCard(p,i){\n  return '<div class=\"pcard\" data-go=\"pack\"><div class=\"eyebrow\">'+eyebrowOf(p)+'<\/div>'+\n   '<div class=\"pt\">'+p.t+'<\/div><div class=\"pb\">'+p.b+'<\/div>'+\n   '<div class=\"prow\"><span class=\"dur\">'+p.tag+'<\/span>'+\n   '<span class=\"ta\">'+(p.cta||'Take action')+' <i>&#9656;<\/i><\/span><\/div><\/div>';\n}\nfunction aprTracker(){\n  var W=300,H=72,PAD=8, v=AVG.map(function(r){return r.v});\n  var mx=Math.max.apply(null,v), mn=Math.min.apply(null,v);\n  var X=function(r){return PAD+r.x*(W-PAD*2)};\n  var Y=function(x){return H-PAD-((x-mn)/((mx-mn)||1))*(H-PAD*2)};\n  var last=AVG[AVG.length-1];\n  var pts=AVG.map(function(r){return X(r)+','+Y(r.v)}).join(' ');\n  var area='M'+X(AVG[0])+','+(H-PAD)+' L'+pts.split(' ').join(' L')+' L'+X(last)+','+(H-PAD)+' Z';\n  return '<div class=\"mod\"><div class=\"modk\">Monitoring<\/div>'+\n   '<h3 class=\"modh\">The average card APR, against yours<\/h3>'+\n   '<div class=\"ratenow\">21.4%<span style=\"color:#8a5a4e\">&uarr; 5.1 since 2022<\/span><\/div>'+\n   '<svg viewBox=\"0 0 '+W+' '+H+'\" class=\"ratesvg\">'+\n     '<path d=\"'+area+'\" fill=\"rgba(176,124,216,.14)\"/>'+\n     '<polyline fill=\"none\" stroke=\"#b07cd8\" stroke-width=\"2\" points=\"'+pts+'\"/>'+\n     '<circle cx=\"'+X(last)+'\" cy=\"'+Y(last.v)+'\" r=\"3.5\" fill=\"#b07cd8\"/>'+\n   '<\/svg>'+\n   '<div class=\"ratex\"><span>2022<\/span><span>2023<\/span><span>2024<\/span><span>2025<\/span><span>2026<\/span><\/div>'+\n   '<p class=\"modp\">Your 15&ndash;20% sits below the market average. That is worth knowing before you consolidate: a personal loan quoted at 10&ndash;18% is a narrower win against your cards than against most people&rsquo;s, and at the top of that range it is no win at all.<\/p>'+\n   '<p class=\"modp\">Issuers reprice variable APRs without much notice. If any of your cards moves, I&rsquo;ll tell you which and what it does to the payoff order.<\/p>'+\n   '<div class=\"src\">Federal Reserve G.19, average APR on accounts assessed interest &middot; checked 21 August 2026<\/div><\/div>';\n}\nfunction viewPriority(){\n  var s=surplus();\n  return lightBar()+'<div class=\"body page\" id=\"scroll\">'+\n   '<div class=\"pghead\">'+\n     '<span class=\"urg high\">Running<\/span>'+\n     '<h2 class=\"pgt\">Get the debt under control<\/h2>'+\n     '<div class=\"progbar\"><i style=\"width:0%\"><\/i><\/div>'+\n     '<div class=\"progl\">0 of 4 actions done &middot; started 21 August<\/div>'+\n   '<\/div>'+\n   '<div class=\"mod\"><div class=\"modk\">Target<\/div>'+\n   '<h3 class=\"modh\">$50,000 cleared, on a schedule built from real rates rather than a band.<\/h3>'+\n   '<div class=\"trow\"><span>Balance<\/span><b>'+usd(S.debt)+'<\/b><\/div>'+\n   '<div class=\"trow\"><span>Accounts<\/span><b>4&ndash;6<\/b><\/div>'+\n   '<div class=\"trow\"><span>Interest accruing<\/span><b>'+usd(intMo(S.apr))+'/mo<\/b><\/div>'+\n   '<div class=\"trow\"><span>Surplus<\/span><b>$500&ndash;$2,000<\/b><\/div>'+\n   '<div class=\"trow\"><span>Payoff order<\/span><b>Not yet built<\/b><\/div>'+\n   '<p class=\"modp\">No schedule exists yet, and one built on a 15&ndash;20% band would be a guess. The card list is what turns this into a plan.<\/p><\/div>'+\n   '<h1 class=\"secH\">Actions for this priority<\/h1>'+\n   '<div class=\"mod plain\">'+ACTIONS.map(actionCard).join('')+'<\/div>'+\n   aprTracker()+\n   '<div class=\"mod\"><div class=\"modk\">What could change this<\/div>'+\n   '<h3 class=\"modh\">Which end of the surplus band you are actually on<\/h3>'+\n   '<p class=\"modp\">At $2,000 a month this clears in under three years. At $500 the balance grows, because interest alone is '+usd(intMo(S.apr))+'. Those are not two versions of the same plan &mdash; one of them is not a plan. One month of tracking settles it.<\/p><\/div>'+\n   '<div class=\"mod\"><div class=\"modk\">Questions you&rsquo;ve asked<\/div>'+\n   '<div class=\"qrow\"><div><div class=\"pt2\">What questions do I need to answer to begin a plan?<\/div>'+\n   '<div class=\"pb\">Answered directly &mdash; nine figures held, two missing, one conflict resolved &mdash; 21 August<\/div><\/div>'+\n   '<span class=\"chev\">&#9656;<\/span><\/div><\/div>'+\n   '<div class=\"mod\"><div class=\"modk\">Related<\/div>'+\n   '<div class=\"qrow\"><div><div class=\"pt2\">Build a budget<\/div>'+\n   '<div class=\"pb\">The same month of tracking answers both. You said getting a budget under control was the bigger challenge of the two.<\/div><\/div>'+\n   '<span class=\"chev\">&#9656;<\/span><\/div>'+\n   '<div class=\"qrow\"><div><div class=\"pt2\">The emergency buffer<\/div>'+\n   '<div class=\"pb\">$5,000&ndash;$15,000. At the bottom of that it outranks the debt payoff; at the top it does not.<\/div><\/div>'+\n   '<span class=\"chev\">&#9656;<\/span><\/div><\/div>'+\n   '<div style=\"height:20px\"><\/div><\/div>'+dock();\n}\nfunction viewPack(){\n  return lightBar()+'<div class=\"body page\" id=\"scroll\">'+\n   '<div class=\"pghead\">'+\n     '<span class=\"eyebrow\">GET THE DEBT UNDER CONTROL<\/span>'+\n     '<h2 class=\"pgt\">Pull the APR and balance on each card<\/h2>'+\n     '<div class=\"progbar\"><i style=\"width:0%\"><\/i><\/div>'+\n     '<div class=\"progl\">0 of 3 steps done<\/div>'+\n   '<\/div>'+\n   '<div class=\"mod\"><div class=\"modk\">Why this first<\/div>'+\n   '<h3 class=\"modh\">Every branch of the analysis turns on it.<\/h3>'+\n   '<div class=\"modnote\">Which method saves the most, whether a transfer beats paying down, how long this takes and what it costs &mdash; all four are decided by the per-card rates, and none of them can be answered honestly without them. '+\n   'It is twenty minutes of looking things up, which is tedious rather than difficult. You said it yourself: the output is only as good as what goes in.<\/div><\/div>'+\n   '<div class=\"mod\"><div class=\"modk\">Steps<\/div>'+\n   ACT_STEPS.map(function(p){\n     return '<div class=\"stepc\"><div class=\"stepn\">'+p.n+'<\/div><div class=\"stepb\">'+\n       '<div class=\"pt\">'+p.t+'<\/div><div class=\"pb\">'+p.b+'<\/div>'+\n       '<div class=\"prow\"><span class=\"dur\">'+p.tag.toUpperCase()+'<\/span>'+\n       '<span class=\"ta\">'+p.cta+' <i>&#9656;<\/i><\/span><\/div><\/div><\/div>';\n   }).join('')+'<\/div>'+\n   '<div class=\"mod\"><div class=\"modk\">Also counts toward<\/div>'+\n   '<div class=\"qrow\" data-go=\"priority\"><div><div class=\"pt2\">Get the debt under control<\/div>'+\n   '<div class=\"pb\">The payoff order, the timeline and the transfer decision all unlock from this one list.<\/div><\/div>'+\n   '<span class=\"chev\">&#9656;<\/span><\/div><\/div>'+\n   '<div style=\"height:20px\"><\/div><\/div>'+dock();\n}\nfunction viewEntry(){\n  return topBar()+'<div class=\"body\" style=\"display:flex;flex-direction:column;justify-content:center\">'+\n   '<div class=\"avatar c\">F<\/div><div class=\"hero\">What&rsquo;s on your<br>money mind?<\/div><\/div>'+\n   '<div class=\"dock\"><div class=\"inp\"><span class=\"ic\">&#128206;<\/span><span class=\"ic\">&#127908;<\/span>'+\n   '<span class=\"ph\" style=\"color:#2c1d24\">I am in roughly $50,000 in credit card debt due to some recent major purchases. My wife and I currently bring home roughly $11,000 per month. Our family consists of myself, my wife, and our two children. We What questions do I need to answer for you to help me begin a plan to get out of that debt?<\/span>'+\n   '<button class=\"snd\" data-go=\"0\">&uarr;<\/button><\/div><\/div>';\n}\n\nfunction viewTurn(){\n  var t=D[S.t];\n  var h=thread()+henceBlock(S.t,false);\n  if(t.opts){\n    h+='<div class=\"opts\">'+t.opts.map(function(o,i){\n      return '<button class=\"opt\" data-opt=\"'+i+'\">'+o+'<\/button>'}).join('')+'<\/div>';\n    if(t.banded) h+='<div class=\"fieldfoot\"><span>Or enter a specific answer below<\/span>'+\n      '<span class=\"skip\" data-opt=\"0\">Skip this question<\/span><\/div>';\n  }\n  if(t.more && !t.gate) h+='<button class=\"pill-more\" data-more=\"1\">'+t.cta+'<\/button>';\n  h+='<\/div><div style=\"height:26px\"><\/div>';\n  return topBar()+'<div class=\"body\" id=\"scroll\">'+h+'<\/div>'+\n    (t.answer?dockTyped(t.answer):dock());\n}\n\nfunction render(){\n  var s=document.getElementById('screen');\n  s.innerHTML = S.t==='signup' ? viewSignup() : S.t==='welcome' ? viewWelcome() : S.t==='home' ? viewHome() : S.t==='entry' ? viewEntry() : S.t==='priority' ? viewPriority() : S.t==='pack' ? viewPack() : viewTurn();\n  wire();\n  document.getElementById('note').textContent=NOTES[S.t]||'';\n  document.querySelectorAll('#vsw button').forEach(function(b){\n    b.classList.toggle('on',b.getAttribute('data-m')===S.mode)});\n  document.querySelectorAll('#steps button').forEach(function(b){\n    b.classList.toggle('on',b.getAttribute('data-v')===String(S.t))});\n  if(S.welcomeTimer){clearTimeout(S.welcomeTimer);S.welcomeTimer=null;}\n  if(S.t==='welcome') S.welcomeTimer=setTimeout(function(){S.t='home';render();},1900);\n}\n\nfunction wire(){\n  var s=document.getElementById('screen');\n  s.querySelectorAll('[data-go]').forEach(function(e){e.onclick=function(){\n    var g=e.getAttribute('data-go');\n    if(g==='entry'){S.t='entry';S.log=[];}\n    else if(g==='priority'||g==='pack'||g==='home'||g==='signup'||g==='welcome'){S.t=g;}\n    else {S.t=parseInt(g,10);}\n    render();scrollToTurn();}});\n  s.querySelectorAll('[data-opt]').forEach(function(e){e.onclick=function(){\n    var t=D[S.t];\n    S.log.push({who:'hence',i:S.t});\n    if(t.answered) S.log.push({who:'me',text:t.answered});\n    S.t=S.t+1;syncCorrected();render();scrollToTurn();}});\n  s.querySelectorAll('[data-send]').forEach(function(e){e.onclick=function(){\n    var t=D[S.t];\n    S.log.push({who:'hence',i:S.t});\n    S.log.push({who:'me',text:t.answer});\n    S.t=S.t+1;syncCorrected();render();scrollToTurn();}});\n  s.querySelectorAll('[data-more]').forEach(function(e){e.onclick=function(){\n    S.log.push({who:'hence',i:S.t});\n    S.t=S.t+1;syncCorrected();render();scrollToTurn();}});\n  s.querySelectorAll('input[type=range]').forEach(function(e){e.oninput=function(){\n    var k=this.getAttribute('data-k');\n    if(k==='apr10') S.apr=parseInt(this.value,10)/10;\n    else S[k]=parseInt(this.value,10);\n    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;\n    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;\n  }});\n  s.querySelectorAll('[data-exp]').forEach(function(e){e.onclick=function(){\n    S.expOpen=true; render();\n    var mods=document.querySelectorAll('#curturn .mod');\n    if(mods.length) mods[mods.length-1].scrollIntoView({block:'start'});}});\n  s.querySelectorAll('[data-goal]').forEach(function(e){e.onclick=function(){\n    S.goalSet=true; S.log.push({who:'hence',i:S.t}); S.t=S.t+1; S.expOpen=false;\n    render(); scrollToTurn();}});\n  s.querySelectorAll('[data-decline]').forEach(function(e){e.onclick=function(){\n    S.declined=true;\n    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;\n    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});\n  s.querySelectorAll('[data-path]').forEach(function(e){e.onclick=function(){\n    S.path=this.getAttribute('data-path');\n    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;\n    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});\n  s.querySelectorAll('[data-refopen]').forEach(function(e){e.onclick=function(){\n    S.refineOpen=!S.refineOpen;\n    var b=document.getElementById('scr in-top:7px}\n.pastwrap{background:#ebe4d6;border-radius:7px;padding:2px 13px;margin-top:10px}\n.past:last-child{border-bottom:0}\n.filt .sep{color:#b3a795;font-weight:400}\n.abk{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8a7f70;\n  padding:11px 0 4px}\n.abr{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;\n  padding:11px 0;border-bottom:1px solid #ddd5c6}\n.abr:last-child{border-bottom:0}\n.licon{font-size:15px;color:#4a4038}\n.fitem{text-align:center;font-size:12px;font-weight:600}\n.fitem.unknown{color:#a89b8a}\n.fdot{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;\n  margin:0 auto 7px;color:#fff;font-size:15px}\n.fdot.ok{background:#7ba86c}\n.fdot.grey{background:transparent;border:1.5px dashed #bdb2a0;color:#a89b8a;font-size:14px}\n.fnote{font-size:11.5px;line-height:1.45;color:#8a7f70;margin-top:11px}\n.viewf{text-align:right;font-size:12.5px;font-weight:600;margin-top:12px;cursor:pointer}\n.viewf i{font-style:normal;font-size:9px;vertical-align:1px;margin-left:2px}\n.ask{font-size:16px;font-weight:600;line-height:1.4;margin-top:18px;color:#fff}\n.assume{background:#e6e0d1;border-radius:8px;padding:12px 13px;font-size:12.5px;line-height:1.45;\n  margin-top:14px;color:#5c5145}\n.assume b{color:var(--ink)}\n<\/style>\n<\/head>\n<body>\n\n<div class=\"chrome\">\n  <h1>Finneas \u00b7 Ask, paced \u00b7 Whitney \u00b7 financing the truck &nbsp;\u00b7&nbsp; BUILD 18:23:41<\/h1>\n  <div class=\"steps\" id=\"steps\"><\/div>\n  <div class=\"vsw\" id=\"vsw\"><span>Insights:<\/span><button data-m=\"laced\">Laced through<\/button><button data-m=\"held\">Held to the end<\/button><\/div>\n<\/div>\n\n<div class=\"device\"><div class=\"screen\" id=\"screen\"><\/div><\/div>\n<div class=\"note\" id=\"note\"><\/div>\n\n<script>\n/* ------------------------------------------------------------------\n   Whitney E \u2014 financing a $45,000 truck.\n   Her question and figures from the Round 1 session (34459).\n   Beat 0's answer is her own words, stitched from three moments in\n   the transcript: the truck ask at 26:18, the credit-union line at\n   27:52, and \"I don't ever like to walk into a situation with no\n   information\" at 31:20. Nothing invented to bridge a gap.\n   Interaction mirrors Luke's and Heather's: typed answers send from\n   the dock, banded answers are pills, analysis advances on a pill.\n------------------------------------------------------------------- */\n\nvar S={ t:'entry', lend:'cu', expOpen:false, goalSet:false, declined:false, refineOpen:false, refine:{}, fan:false, sheet:false, tab:'cal', mode:'laced', log:[], confOpen:false,\n        price:45000, down:10000, term:72, apr:6.5 };\n\nfunction usd(n){return '$'+Math.round(n).toLocaleString('en-US');}\nfunction usd0(n){return '$'+Math.round(n/1000)+'K';}\n/* level payment on an amortising loan */\nfunction pmt(principal,apr,months){\n  var r=apr/100/12;\n  return principal*r/(1-Math.pow(1+r,-months));\n}\nfunction financed(){return S.price-S.down;}\n\n/* ---------------- artifacts ---------------- */\n\nfunction modPayment(){\n  var f=financed(), p=pmt(f,S.apr,S.term), paid=p*S.term, int=paid-f;\n  var MAX=900, fill=Math.min(p/MAX*100,100), ceil=768/MAX*100;\n  var over=p>768;\n  return '<div class=\"mod\"><h3>'+usd(p)+' a month<\/h3>'+\n   '<div class=\"cap\">'+usd(S.down)+' down on a '+usd(S.price)+' truck &mdash; '+usd(f)+\n     ' financed over '+S.term+' months at '+S.apr+'%. All three move.<\/div>'+\n   '<div class=\"bar\"><div class=\"bl\"><span>Your payment<\/span><b>'+usd(p)+'<\/b><\/div>'+\n     '<div class=\"tr\"><div class=\"fl\" style=\"width:'+fill+'%;background:'+(over?'var(--t-a)':'var(--t-c)')+'\"><\/div>'+\n     '<div class=\"ceil\" style=\"left:'+ceil+'%\"><\/div><\/div>'+\n     '<div class=\"ceill\">The line is $768 &mdash; the payment you looked at and said absolutely not to.<\/div><\/div>'+\n   '<div class=\"sl\"><label>Down payment <b>'+usd(S.down)+'<\/b><\/label>'+\n     '<input type=\"range\" data-k=\"down\" min=\"0\" max=\"15000\" step=\"500\" value=\"'+S.down+'\"><\/div>'+\n   '<div class=\"sl\"><label>Term <b>'+S.term+' months<\/b><\/label>'+\n     '<input type=\"range\" data-k=\"term\" min=\"36\" max=\"84\" step=\"12\" value=\"'+S.term+'\"><\/div>'+\n   '<div class=\"sl\"><label>Rate <b>'+S.apr.toFixed(1)+'%<\/b><\/label>'+\n     '<input type=\"range\" data-k=\"apr\" min=\"3.5\" max=\"9\" step=\"0.1\" value=\"'+S.apr+'\"><\/div>'+\n   '<div class=\"trows\">'+\n     '<div class=\"trow\"><span>Amount financed<\/span><b>'+usd(f)+'<\/b><\/div>'+\n     '<div class=\"trow\"><span>Total interest over '+S.term+' months<\/span><b>'+usd(int)+'<\/b><\/div>'+\n     '<div class=\"trow tot\"><span>Total paid for the truck<\/span><b>'+usd(paid+S.down)+'<\/b><\/div>'+\n   '<\/div>'+\n   '<div class=\"modnote\">'+(over\n     ? '<b>That is past the number you turned down.<\/b> More down or a lower rate brings it back under; a longer term does too, but you pay for it in interest.'\n     : 'Every $1,000 more down takes about <b>$17 a month<\/b> off. The rate is the lender&rsquo;s to set, not yours &mdash; it moves here so you can see what shopping it is actually worth.')+\n   '<\/div><\/div>';\n}\n\nfunction modTrue(){\n  var p=pmt(financed(),S.apr,S.term);\n  var lo=p+165+100+80, hi=p+350+350+200;\n  return '<div class=\"mod\"><h3>'+usd(lo)+' to '+usd(hi)+' a month to actually own it<\/h3>'+\n   '<div class=\"cap\">None of this is on the loan paperwork. These are ranges for a new truck in the Dallas area, not figures you gave me.<\/div>'+\n   '<div class=\"trows\">'+\n     '<div class=\"trow\"><span>Loan payment<\/span><b>'+usd(p)+'<\/b><\/div>'+\n     '<div class=\"trow\"><span>Insurance<span class=\"dl2\">New truck, good credit, two drivers<\/span><\/span><b>$165&ndash;$350<\/b><\/div>'+\n     '<div class=\"trow\"><span>Fuel<span class=\"dl2\">Depends entirely on the commute<\/span><\/span><b>$100&ndash;$350<\/b><\/div>'+\n     '<div class=\"trow\"><span>Set aside for maintenance<\/span><b>$80&ndash;$200<\/b><\/div>'+\n     '<div class=\"trow tot\"><span>All in<\/span><b>'+usd(lo)+'&ndash;'+usd(hi)+'<\/b><\/div>'+\n   '<\/div>'+\n   '<div class=\"modnote\">The working rule is that a truck costs roughly <b>twice the payment<\/b> to own. On '+usd(p)+\n     ' that means budgeting near '+usd(Math.round((lo+hi)/2/50)*50)+' a month, not '+usd(p)+\n     '. This is the number to test against your cash flow &mdash; the payment on its own will always look affordable.<\/div><\/div>';\n}\n\nfunction modDaycare(){\n  var p=pmt(financed(),S.apr,S.term);\n  var lo=900-p, hi=1200-p;\n  return '<div class=\"mod\"><h3>The payment fits inside money already leaving your account<\/h3>'+\n   '<div class=\"cap\">Your son starts kindergarten in August. That is the whole reason this is a now question and not a someday one.<\/div>'+\n   '<div class=\"trows\">'+\n     '<div class=\"trow\"><span>His daycare, today<span class=\"dl2\">The band you picked, not a figure you gave me<\/span><\/span><b>$900&ndash;$1,200<\/b><\/div>'+\n     '<div class=\"trow\"><span>His daycare, from August<\/span><b>$0<\/b><\/div>'+\n     '<div class=\"trow\"><span>The truck payment<\/span><b>&minus;'+usd(p)+'<\/b><\/div>'+\n     '<div class=\"trow tot\"><span>Still free every month<\/span><b>'+usd(Math.max(lo,0))+'&ndash;'+usd(Math.max(hi,0))+'<\/b><\/div>'+\n   '<\/div>'+\n   '<div class=\"modnote\"><b>Your daughter&rsquo;s daycare does not end.<\/b> This is only your son&rsquo;s share coming back, so treat the freed-up figure as the ceiling rather than the plan. '+\n   'And the truck is the first claim on it &mdash; worth knowing that before it becomes the only claim on it.<\/div><\/div>';\n}\n\nvar LEND=[\n {id:'dealer', n:'Dealer',      apr:6.5, get:'Nothing &mdash; they do it at the desk',\n  qual:'Easiest', note:'They may mark the rate up over what the lender actually offered.'},\n {id:'cu',     n:'Credit union',apr:5.5, get:'Join and apply &middot; 1&ndash;2 days',\n  qual:'Easy for your tier', note:'Member-owned, and more flexible than a bank at 700&ndash;749.'},\n {id:'online', n:'Online',      apr:4.9, get:'Shop 2&ndash;3 &middot; 1&ndash;2 hours',\n  qual:'Hardest to lock', note:'LightStream, PenFed. Cheapest money here, and the least guaranteed.'}\n];\n\nfunction goalPmt(){ return pmt(financed(), lenderApr(), S.term); }\nfunction lenderApr(){\n  var l=LEND.filter(function(x){return x.id===S.lend})[0]||LEND[1];\n  return l.apr;\n}\n\nvar REFINE=[\n {id:'credit', t:'Your credit tier',\n  w:'You skipped it, and it moves the payment more than the lender choice does &mdash; excellent against fair is $50 to $100 a month on this loan. Everything here is priced at good credit because I had to assume something.'},\n {id:'curate', t:'What your credit union actually charges',\n  w:'You said they usually come in under 5%. I modelled 5.5% because that is the market, not because it is them. One call settles it, and it widens the gap in your favour.'},\n {id:'tax', t:'Your state&rsquo;s sales tax, title and fees',\n  w:'None of it is in these figures. Rolling it into the loan adds roughly $35 to $65 a month.'},\n {id:'subs', t:'Whether the manufacturer is running subsidised financing',\n  w:'0.9% or 2.9% on the truck you want and the dealer wins outright. Ask before you assume they can&rsquo;t.'}\n];\n\nfunction modRefine(){\n  var n=0; REFINE.forEach(function(r){ if(S.refine[r.id]) n++; });\n  var open=S.refineOpen;\n  var h='<div class=\"mod refm\"><div class=\"rfhead\" data-refopen=\"1\">'+\n    '<div><div class=\"rfk\">Refine this answer<\/div>'+\n    '<div class=\"rfs\">'+(n?n+' added &mdash; I&rsquo;ll redo the numbers when they land':REFINE.length+' figures I had to estimate. Optional.')+'<\/div><\/div>'+\n    '<span class=\"rfchev\">'+(open?'&#9650;':'&#9660;')+'<\/span><\/div>';\n  if(open){\n    h+='<div class=\"rfbody\">'+REFINE.map(function(r){\n      var on=S.refine[r.id];\n      return '<div class=\"rfi\"><div class=\"rfh\"><div><div class=\"rft\">'+r.t+'<\/div>'+\n        '<div class=\"rfw\">'+r.w+'<\/div><\/div>'+\n        '<button class=\"rfb'+(on?' on':'')+'\" data-refine=\"'+r.id+'\">'+(on?'Added &#10003;':'&#43; Add')+'<\/button>'+\n        '<\/div><\/div>';\n    }).join('')+\n    '<div class=\"modnote\">None of it is required &mdash; the answer stands without it. Anything you add goes on your plan as something to find.<\/div><\/div>';\n  }\n  return h+'<\/div>';\n}\n\nfunction modLenders(){\n  var f=financed();\n  var sel=LEND.filter(function(x){return x.id===S.lend})[0]||LEND[1];\n  var rows=LEND.map(function(l){ var p=pmt(f,l.apr,S.term); return {l:l,p:p,int:p*S.term-f}; });\n  var base=rows[0];\n  var h='<div class=\"mod\"><h3>Three places will write this loan<\/h3>'+\n   '<div class=\"cap\">Same truck, same '+usd(f)+', same '+S.term+' months. The only thing that changes is who you borrow from. Tap a column.<\/div>'+\n   '<div class=\"cmpt three\" style=\"background:transparent;padding:0;margin-top:14px\"><table>'+\n   '<tr><th>&nbsp;<\/th>'+LEND.map(function(l){\n      return '<th class=\"'+(l.id===S.lend?'selth':'')+'\" data-lend=\"'+l.id+'\" style=\"cursor:pointer\">'+l.n+'<\/th>';}).join('')+'<\/tr>'+\n   '<tr><td>Monthly<\/td>'+rows.map(function(r,i){\n      return '<td class=\"'+(i===0?'neu':'win')+(r.l.id===S.lend?' selc':'')+'\" data-lend=\"'+r.l.id+'\">'+usd(r.p)+'<span class=\"dl\">'+r.l.apr+'%<\/span><\/td>';}).join('')+'<\/tr>'+\n   '<tr><td>Total interest<\/td>'+rows.map(function(r,i){\n      return '<td class=\"'+(i===0?'up':'neu')+(r.l.id===S.lend?' selc':'')+'\" data-lend=\"'+r.l.id+'\">'+usd(r.int)+'<\/td>';}).join('')+'<\/tr>'+\n   '<tr class=\"hi\"><td>Against the dealer<\/td>'+rows.map(function(r,i){\n      return '<td class=\"'+(i===0?'neu':'win')+(r.l.id===S.lend?' selc':'')+'\" data-lend=\"'+r.l.id+'\">'+(i===0?'&mdash;':'&minus;'+usd(base.p-r.p)+'<span class=\"dl\">'+usd((base.p-r.p)*S.term)+' total<\/span>')+'<\/td>';}).join('')+'<\/tr>'+\n   '<tr><td>What it takes<\/td>'+rows.map(function(r){\n      return '<td class=\"neu'+(r.l.id===S.lend?' selc':'')+'\" data-lend=\"'+r.l.id+'\" style=\"font-weight:400;font-size:10.5px\">'+r.l.get+'<\/td>';}).join('')+'<\/tr>'+\n   '<\/table><\/div>'+\n   '<div class=\"selbox\"><div class=\"selk\">'+sel.n+'<\/div><div class=\"selp\">'+sel.note+' '+sel.qual+' to qualify at your tier.<\/div><\/div>'+\n   '<div class=\"modnote\">The whole spread is <b>'+usd(base.p-rows[2].p)+' a month<\/b> &mdash; '+usd((base.p-rows[2].p)*S.term)+' across the '+(S.term/12)+' years. <b>Every rate check inside a 14-day window counts as one hard pull<\/b>, so asking all three costs your credit report the same as asking one.<\/div><\/div>';\n  if(S.expOpen || S.goalSet) h+=modTrade();\n  if(!S.expOpen && !S.goalSet) h+='<button class=\"pill-more\" data-exp=\"1\" style=\"margin:16px auto 0\">Explore trade-offs<\/button>';\n  return h;\n}\n\nfunction modTrade(){\n  var f=financed(), sel=LEND.filter(function(x){return x.id===S.lend})[0]||LEND[1];\n  var p=pmt(f,sel.apr,S.term), tot=p*S.term-f;\n  var p60=pmt(f,sel.apr,60);\n  return '<div class=\"mod\">'+\n   '<div class=\"modk\">Explore trade-offs<\/div>'+\n   '<div class=\"trows\" style=\"margin-top:14px\">'+\n     '<div class=\"trow\"><span>Financed<span class=\"dl2\">'+usd(S.price)+' less '+usd(S.down)+' down<\/span><\/span><b>'+usd(f)+'<\/b><\/div>'+\n     '<div class=\"trow\"><span>Interest over '+(S.term/12)+' years<span class=\"dl2\">at '+sel.apr+'%<\/span><\/span><b>'+usd(tot)+'<\/b><\/div>'+\n     '<div class=\"trow\"><span>60 months instead of '+S.term+'<span class=\"dl2\">higher payment, less interest<\/span><\/span><b>'+usd(p60)+'/mo<\/b><\/div>'+\n   '<\/div>'+\n   '<div class=\"sl\"><label>Down payment <b>'+usd(S.down)+'<\/b><\/label>'+\n     '<input type=\"range\" data-k=\"down\" min=\"0\" max=\"20000\" step=\"500\" value=\"'+S.down+'\"><\/div>'+\n   '<div class= aced', log:[], confOpen:false, opt:'edge', taxRate:3, rothYrs:27, price:600000, rate:6.5, downPct:20 };\n\nfunction usd(n){return '$'+Math.round(n).toLocaleString('en-US');}\nfunction usd0(n){return '$'+Math.round(n/1000)+'K';}\nfunction pi(price,rate,downPct){\n  var loan=price*(1-downPct/100), r=rate/100/12;\n  return loan*r/(1-Math.pow(1+r,-360));\n}\n\n/* ---------------- artifacts ---------------- */\n\nvar PACK=[\n {n:1,t:'Get a lender pre-approval before you shortlist anything',\n  d:'Parcels over an acre with outbuildings are a different product to some lenders, and a few won&rsquo;t write them at all. I&rsquo;ll shortlist the ones that do; you&rsquo;ll need two years of personal returns and three months of pay statements, yours and your wife&rsquo;s.',\n  who:'h',wl:'I&rsquo;ll find them &middot; you apply'},\n {n:2,t:'Drive the commute before you fall in love with a listing',\n  d:'Tuesday, 8am, from each of the three distances. Nine miles out is 14 minutes longer than you drive now; thirty-one is 40 minutes longer, which is 29 hours a month you haven&rsquo;t lived yet. This is the trade the money can&rsquo;t settle.',\n  who:'u',wl:'Let&rsquo;s talk it through'},\n {n:3,t:'Check zoning and insurance on any parcel you shortlist',\n  d:'Not every parcel outside the line permits livestock, and chickens and outbuildings aren&rsquo;t covered by a standard homeowners policy. I&rsquo;ll run both on anything you send me, before you make an offer.',\n  who:'h',wl:'I&rsquo;ll run this on anything you shortlist'},\n {n:4,t:'Get a comparative market analysis on N Russet',\n  d:'Two or three Portland listing agents. The $555,700 estimate is a baseline; agents have the block-level comps, and they&rsquo;ll tell you what&rsquo;s worth doing before listing. Watch for anyone suggesting $30K of pre-sale work &mdash; that rarely comes back.',\n  who:'u',wl:'You book them &middot; I&rsquo;ll brief you'},\n {g:'What I&rsquo;ll watch', w:true,\n  t:'Portland comps on your block :'Talk it through'},\n {pri:['Get the acre'], t:'Check zoning and insurance on any parcel',\n  b:\"Chickens and outbuildings aren't covered by default, and not every parcel outside the line permits livestock.\",\n  tag:\"I'LL RUN IT\", cta:'Send to Finneas'},\n {pri:['Get the acre','Cash flow'], t:'Get a comparative market analysis on N Russet',\n  b:\"Two or three Portland listing agents. The $555,700 estimate is a baseline; agents have the block-level comps.\",\n  tag:'2 STEPS', cta:'Send to Finneas'}\n];\n\nvar ACT_STEPS=[\n {n:1,t:'Send me your returns and pay statements',\n  b:\"Two years of personal returns and three months of pay statements. Your wife's too &mdash; both incomes are on the application.\",\n  cta:'Add information', tag:'10 min'},\n {n:2,t:'Find lenders who write acreage loans',\n  b:\"Parcels over an acre and outbuildings put some lenders off. I&rsquo;ll shortlist the ones that don&rsquo;t blink.\",\n  cta:'Send to Finneas', tag:\"I'll run it\"},\n {n:3,t:'Choose which lender to apply to',\n  b:\"Compare what each will lend against the acre, and what they charge for it.\",\n  cta:'Talk it through', tag:'6 min'},\n {n:4,t:'Submit the application',\n  b:\"You submit it &mdash; lenders require the applicant to do this. I&rsquo;ll have everything filled in.\",\n  cta:'You do this', tag:'15 min'}\n];\n\nvar RATES=[{x:0,v:6.00},{x:.34,v:6.22},{x:.67,v:6.51},{x:1,v:6.69}];\n\nvar OPTS=[\n {id:'edge', name:'Just past the line', miles:9, drive:32, plus:14,\n  where:'Happy Valley, Damascus, Boring, Sherwood',\n  acres:'Half an acre to an acre', price:735000, x:0.30},\n {id:'out', name:'Real farmland', miles:24, drive:52, plus:34,\n  where:'Canby, Molalla, Estacada, Sandy',\n  acres:'Two acres or more', price:610000, x:0.60},\n {id:'land', name:'Bare land, then build', miles:31, drive:58, plus:40,\n  where:'Parcels south and east of Estacada',\n  acres:'Whatever you buy &mdash; five acres is normal out here', price:520000, x:0.88}\n];\n\nfunction mapSVG(){\n  var sel=OPTS.map(function(o){return o.id}).indexOf(S.opt);\n  var pts='';\n  OPTS.forEach(function(o,i){\n    var cx=40+o.x*300, cy= i===0?54: i===1?76:96;\n    pts+='<circle cx=\"'+cx+'\" cy=\"'+cy+'\" r=\"'+(i===sel?9:5)+'\" fill=\"'+(i===sel?'#2c1d24':'#b3a893')+'\"/>';\n    if(i===sel) pts+='<circle cx=\"'+cx+'\" cy=\"'+cy+'\" r=\"15\" fill=\"none\" stroke=\"#2c1d24\" stroke-opacity=\".3\"/>';\n  });\n  var rings=[[9,'10 mi'],[24,'25 mi'],[31,'30 mi']];\n  var r='';\n  [60,120,180,240].forEach(function(rad){\n    r+='<circle cx=\"40\" cy=\"70\" r=\"'+rad+'\" fill=\"none\" stroke=\"#cfc6b5\" stroke-dasharray=\"3 4\"/>';\n  });\n  return '<svg viewBox=\"0 0 340 130\" xmlns=\"http://www.w3.org/2000/svg\">'+\n    r+\n    '<circle cx=\"40\" cy=\"70\" r=\"11\" fill=\"#8a7f70\"/>'+\n    '<text x=\"40\" y=\"74\" text-anchor=\"middle\" font-size=\"9\" fill=\"#f3efe5\" font-family=\"Hanken Grotesk\">P<\/text>'+\n    '<text x=\"40\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#8a7f70\" font-family=\"Hanken Grotesk\">Portland<\/text>'+\n    '<text x=\"40\" y=\"18\" font-size=\"8\" fill=\"#a89b8a\" font-family=\"Hanken Grotesk\">4130 N Russet &middot; your office<\/text>'+\n    pts+\n  '<\/svg>';\n}\n\nfunction modConfidence(){\n  var open=S.confOpen;\n  return '<div class=\"conf\" data-conf=\"1\">'+\n   '<div class=\"ch\"><span class=\"ck\">Confidence<\/span>'+\n     '<span class=\"cv\">Moderate &middot; 55%<\/span>'+\n     '<span class=\"cchev\">'+(open?'&#9650;':'&#9660;')+'<\/span><\/div>'+\n   '<div class=\"cbar\"><i style=\"width:55%\"><\/i><\/div>'+\n   '<div class=\"cd\">Built on eleven figures. Four are yours, five I looked up, and two I estimated because you haven&rsquo;t told me yet.<\/div>'+\n   (open?'<div class=\"clist\">'+\n     '<div class=\"cli\"><i>&#10003;<\/i><span>Your mortgage balance band, rate, liquid savings and retirement rate &mdash; from your answers<\/span><\/div>'+\n     '<div class=\"cli\"><i>&#10003;<\/i><span>Portland median list and year-over-year change, 30-year fixed rate, Clackamas acreage prices, Oregon property tax rate, &sect;121 exclusion &mdash; looked up today<\/span><\/div>'+\n     '<div class=\"cli miss\"><i>&#8722;<\/i><span>Your exact payoff balance. I used the middle of your band, which moves the target by $150,000 either way.<\/span><\/div>'+\n     '<div class=\"cli miss\"><i>&#8722;<\/i><span>Your current commute. Every &ldquo;minutes longer&rdquo; figure here is measured against an assumed 18 minutes.<\/span><\/div>'+\n     '<div class=\"cd\">Tell me those two and this goes to high.<\/div>'+\n   '<\/div>':'')+\n  '<\/div>';\n}\n\nfunction goalIncome(){\n  var o=OPTS.filter(function(x){return x.id===S.opt})[0]||OPTS[0];\n  var P=pi(S.price,S.rate,20);\n  return P+S.price*0.0105/12+175+S.price*0.01/12;\n}\nfunction stayCost(){\n  return 1209+555700*0.0105/12+150+555700*0.01/12+(220000-200000)*S.taxRate/100/12;\n}\nfunction costAt(o,price){\n  var P=pi(price,S.rate,20);\n  return P+price*0.0105/12+175+price*0.01/12;\n}\n\nvar REFINE=[\n {id:'payoff', t:'Your exact mortgage payoff balance',\n  w:'You gave me $200K&ndash;$350K. The two ends are $150,000 apart, which moves what you can buy more than any other figure here.'},\n {id:'commute', t:'Your real commute today',\n  w:'Every &ldquo;minutes longer&rdquo; figure is measured against it. I have assumed 18 minutes and I am guessing.'},\n {id:'income', t:'Your household take-home, to the dollar',\n  w:'I have worked from $220K combined gross. The affordability band moves with the real number, not the estimate.'}\n];\n\nfunction modRefine(){\n  var n=0; REFINE.forEach(function(r){ if(S.refine[r.id]) n++; });\n  var open=S.refineOpen;\n  var h='<div class=\"mod refm\"><div class=\"rfhead\" data-refopen=\"1\">'+\n    '<div><div class=\"rfk\">Refine this answer<\/div>'+\n    '<div class=\"rfs\">'+(n?n+' added &mdash; I&rsquo;ll redo the numbers when they land':REFINE.length+' figures I had to estimate. Optional.')+'<\/div><\/div>'+\n    '<span class=\"rfchev\">'+(open?'&#9650;':'&#9660;')+'<\/span><\/div>';\n  if(open){\n    h+='<div class=\"rfbody\">'+REFINE.map(function(r){\n      var on=S.refine[r.id];\n      return '<div class=\"rfi\"><div class=\"rfh\"><div><div class=\"rft\">'+r.t+'<\/div>'+\n        '<div class=\"rfw\">'+r.w+'<\/div><\/div>'+\n        '<button class=\"rfb'+(on?' on':'')+'\" data-refine=\"'+r.id+'\">'+(on?'Added &#10003;':'&#43; Add')+'<\/button>'+\n        '<\/div><\/div>';\n    }).join('')+\n    '<div class=\"modnote\">None of it is required &mdash; the answer stands without it. Anything you add goes on your plan as something to find.<\/div><\/div>';\n  }\n  return h+'<\/div>';\n}\n\n\nfunction modOptions(){\n  var sel=OPTS.filter(function(x){return x.id===S.opt})[0]||OPTS[0];\n  var stay=stayCost();\n  var h='<div class=\"mod\"><h3>Three ways to get the acre<\/h3>'+\n   '<div class=\"cap\">All of them are outside the city limits, so all of them end the '+S.taxRate+'% Portland tax. What separates them is how far out you go. Tap a column.<\/div>'+\n   '<div class=\"cmpt three\" style=\"background:transparent;padding:0;margin-top:14px\"><table>'+\n   '<tr><th>&nbsp;<\/th>'+OPTS.map(function(x){\n      return '<th class=\"'+(x.id===S.opt?'selth':'')+'\" data-opt2=\"'+x.id+'\" style=\"cursor:pointer\">'+x.miles+' mi<\/th>';}).join('')+'<\/tr>'+\n   '<tr><td>Land<\/td>'+OPTS.map(function(x){\n      return '<td class=\"neu'+(x.id===S.opt?' selc':'')+'\" data-opt2=\"'+x.id+'\" style=\"font-weight:400;font-size:10.5px\">'+x.acres+'<\/td>';}).join('')+'<\/tr>'+\n   '<tr><td>Around<\/td>'+OPTS.map(function(x){\n      return '<td class=\"neu'+(x.id===S.opt?' selc':'')+'\" data-opt2=\"'+x.id+'\">'+usd0(x.price)+'<\/td>';}).join('')+'<\/tr>'+\n   '<tr class=\"hi\"><td>Every month<\/td>'+OPTS.map(function(x){\n      return '<td class=\"neu'+(x.id===S.opt?' selc':'')+'\" data-opt2=\"'+x.id+'\">'+usd(costAt(x,x.price))+'<span class=\"dl\">'+usd(costAt(x,x.price)-stay)+' more than staying<\/span><\/td>';}).join('')+'<\/tr>'+\n   '<tr><td>The drive<\/td>'+OPTS.map(function(x){\n      return '<td class=\"neu'+(x.id===S.opt?' selc':'')+'\" data-opt2=\"'+x.id+'\" style=\"font-weight:400;font-size:10.5px\">+'+x.plus+' min each way<\/td>';}).join('')+'<\/tr>'+\n   '<\/table><\/div>'+\n   '<div class=\"selbox\"><div class=\"selk\">'+sel.name+'<\/div><div class=\"selp\">'+sel.where+'. '+sel.acres+'.<\/div><\/div>'+\n   '<div class=\"modnote\">Every ten miles further out takes roughly $60,000 off the price and adds about fifteen minutes each way. <b>'+sel.plus+' minutes each way is '+Math.round(sel.plus*2*22/60)+' more hours a month in the car<\/b> than you drive today.<\/div><\/div>';\n  if(S.expOpen || S.goalSet) h+=modTrade();\n  if(!S.expOpen && !S.goalSet) h+='<button class=\"pill-more\" data-exp=\"1\" style=\"margin:16px auto 0\">Explore trade-offs<\/button>';\n  return h;\n}\n\nfunction modTrade(){\n  var sel=OPTS.filter(function(x){return x.id===S.opt})[0]||OPTS[0];\n  var all=costAt(sel,S.price), stay=stayCost(), d=all-stay;\n  var Pw=pi(S.price,6.0,20+(60000/S.price*100));\n  var allw=Pw+S.price*0.0105/12+175+S.price*0.01/12;\n  var idx=OPTS.map(function(x){return x.id}).indexOf(sel.id);\n  return '<div class=\"mod\">'+\n   '<div class=\"modk\">Explore trade-offs<\/div>'+\n   '<div class=\"mapw\">'+mapSVG()+\n     '<input class=\"mapsl\" type=\"range\" data-k=\"optIdx\" min=\"0\" max=\"2\" step=\"1\" value=\"'+idx+'\">'+\n     '<div class=\"maplab\">'+OPTS.map(function(x,i){\n       return '<span class=\"'+(i===idx?'on':'')+'\">'+x.miles+' mi<\/span>';}).join('')+'<\/div>'+\n   '<\/div>'+\n   '<div class=\"trows\">'+\n     '<div class=\"trow\"><span>Cost against staying<\/span><b>'+usd(d)+' a month more<\/b><\/div>'+\n     '<div class=\"trow\"><span>Wait until 2028<span class=\"dl2\">$60K more down, rates at 6%<\/span><\/span><b>saves '+usd(all-allw)+'<\/b><\/div>'+\n   '<\/div>'+\n   '<div class=\"sl\"><label>Purchase price <b>'+usd0(S.price)+'<\/b><\/label>'+\n     '<input type=\"range\" data-k=\"price\" min=\"450000\" max=\"850000\" step=\"10000\" value=\"'+S.price+'\"><\/div>'+\n   modConfidence()+\n   '<div class=\"modfoot\"><div class=\"mfl\"><div class=\"mfh\">'+usd(all)+' a month<\/div>'+\n     '<div class=\"mfs\">'+sel.miles+' miles out, '+usd0(S.price)+'<\/div><\/div>'+\n     (S.goalSet\n       ? '<span class=\"btn-set ghost\">Target set &#10003;<\/span>'\n       : '<button class=\"btn-set\" data-goal=\"1\">Set my target<\/button>')+\n   '<\/div><\/div>';\n}\n\nfunction modCompare(){\n  var P=pi(S.price,S.rate,S.downPct);\n  var stayPI=1209, stayTax=(220000-200000)*S.taxRate/100/12;\n  var moveTax=0;\n  var stayAll=stayPI+306000*0+ (555700*0.0105/12) + 150 + 555700*0.01/12;\n  var moveAll=P+S.price*0.0105/12+175+S.price*0.01/12;\n  var diff=moveAll-(stayAll+stayTax);\n  return '<div class=\"mod\"><h3>'+usd(diff)+' more a month to buy a home outside Portland<\/h3>'+\n   '<div class=\"cap\">Staying put against moving at '+usd0(S.price)+', on your numbers. The bottom half is what the money buys.<\/div>'+\n   '<div class=\"cmpt\" style=\"background:transparent;padding:0;margin-top:14px\"><table>'+\n   '<tr><th>Per month<\/th><th>Stay<\/th><th>Move<br>'+usd0(S.price)+'<\/th><\/tr>'+\n   '<tr><td>Mortgage P&amp;I<span class=\"dl\">2.5% now, '+S.rate+'% on the new loan<\/span><\/td>'+\n     '<td class=\"neu\">'+usd(stayPI)+'<\/td><td class=\"up\">'+usd(P)+'<\/td><\/tr>'+\n   '<tr><td>Tax, insurance, maintenance<\/td>'+\n     '<td class=\"neu\">'+usd(stayAll-stayPI)+'<\/td><td class=\"up\">'+usd(moveAll-P)+'<\/td><\/tr>'+\n   '<tr><td>Portland tax over $200K<span class=\"dl\">'+S.taxRate+'%, gone outside the city limits<\/span><\/td>'+\n     '<td class=\"neu\">'+usd(stayTax)+'<\/td><td>$0<\/td><\/tr>'+\n   '<tr class=\"hi\"><td>Total per month<\/td>'+\n     '<td class=\"neu\">'+usd(stayAll+stayTax)+'<\/td><td class=\"up\">'+usd(moveAll)+'<\/td><\/tr>'+\n   '<tr class=\"sec\"><td>Quality of life<\/td><td><\/td><td><\/td><\/tr>'+\n   '<tr><td>Land<\/td><td class=\"ql\">Quarter acre<\/td><td class=\"ql\">An acre or more<\/td><\/tr>'+\n   '<tr><td>Animals<span class=\"dl\">Three dogs, chickens, room for more<\/span><\/td>'+\n     '<td class=\"ql\">At the city limit<\/td><td class=\"ql\">What you came for<\/td><\/tr>'+\n   '<tr><td>Commute<\/td><td class=\"ql\">What you have now<\/td><td class=\"ql\">Longer, and you own it<\/td><\/tr>'+\n   '<tr><td>Travel fund<span class=\"dl\">Your wife&rsquo;s first trip abroad<\/span><\/td>'+\n     '<td class=\"ql\">Keeps filling<\/td><td class=\"ql\">Competes with the down payment<\/td><\/tr>'+\n   '<tr><td>The 2018 plan<\/td><td class=\"ql\">Runs longer<\/td><td class=\"ql\">Done<\/td><\/tr>'+\n   '<\/table><\/div>'+\n   '<div class=\"modnote\">Everything below breaks that number into its parts &mdash; what the sale gives you, what the new loan costs, and whether the tax saving is worth anything against it.<\/div><\/div>';\n}\nfunction modNet(){\n  var lo=555700*0.92-350000, hi=555700*0.92-200000;\n  return '<div class=\"mod\"><h3>What you&rsquo;d net at sale<\/h3>'+\n   '<div class=\"cap\">4130 N Russet &middot; Trulia/Zillow-range estimate $555,700, pulled from current web data. Transaction costs at 8% &mdash; agent commissions, closing costs, transfer taxes.<\/div>'+\n   '<div class=\"big\">'+usd(lo)+'&ndash;'+usd(hi)+'<\/div><div class=\"bigsub\">net to you, before any of your liquid savings<\/div>'+\n   '<div class=\"trows\">'+\n     '<div class=\"trow\"><span>Sale price<\/span><b>$555,700<\/b><\/div>'+\n     '<div class=\"trow\"><span>Transaction costs at 8%<\/span><b class=\"neg\">&minus;'+usd(555700*0.08)+'<\/b><\/div>'+\n     '<div class=\"trow\"><span>Mortgage payoff<\/span><b class=\"neg\">&minus;$200K to $350K<\/b><\/div>'+\n     '<div class=\"trow tot\"><span>Net proceeds<\/span><b>'+usd(lo)+'&ndash;'+usd(hi)+'<\/b><\/div><\/div>'+\n   '<div class=\"modnote\">The spread is your payoff band, not something to tune &mdash; tell me the exact balance and this becomes one number. Portland transaction costs run 7&ndash;9%; 8% is the middle.<\/div><\/div>';\n}\nfunction modPayment(){\n  var P=pi(S.price,S.rate,S.downPct);\n  var tax=S.price*0.0105/12, ins=175, maint=S.price*0.01/12, all=P+tax+ins+maint;\n  var cP=1209, cTax=555700*0.0105/12, cIns=150, cMaint=555700*0.01/12;\n  var cAll=cP+cTax+cIns+cMaint;\n  var rates=[6.5,7,7.5];\n  return '<div class=\"mod\"><h3>What it costs to carry<\/h3>'+\n   '<div class=\"cap\">Your mortgage now against the one that replaces it. Verify the live rate at bankrate.com or your lender before committing.<\/div>'+\n   '<div class=\"cmpt\" style=\"background:transparent;padding:0;margin-top:14px\"><table>'+\n   '<tr><th>Per month<\/th><th>Now<span class=\"dl\">$306K, 2.5%<\/span><\/th><th>New<span class=\"dl\">'+usd0(S.price)+', '+S.rate+'%<\/span><\/th><\/tr>'+\n   '<tr><td>Principal &amp; interest<\/td><td class=\"neu\">'+usd(cP)+'<\/td><td class=\"up\">'+usd(P)+'<\/td><\/tr>'+\n   '<tr><td>Property tax<span class=\"dl\">Oregon, ~1.0&ndash;1.1%<\/span><\/td><td class=\"neu\">'+usd(cTax)+'<\/td><td class=\"up\">'+usd(tax)+'<\/td><\/tr>'+\n   '<tr><td>Homeowners insurance<\/td><td class=\"neu\">'+usd(cIns)+'<\/td><td class=\"up\">'+usd(ins)+'<\/td><\/tr>'+\n   '<tr><td>Maintenance reserve<span class=\"dl\">1% of value a year<\/span><\/td><td class=\"neu\">'+usd(cMaint)+'<\/td><td class=\"up\">'+usd(maint)+'<\/td><\/tr>'+\n   '<tr class=\"hi\"><td>Total carrying cost<\/td><td class=\"neu\">'+usd(cAll)+'<\/td><td class=\"up\">'+usd(all)+'<\/td><\/tr>'+\n   '<\/table><\/div>'+\n   '<div class=\"sl\"><label>Purchase price <b>'+usd(S.price)+'<\/b><\/label>'+\n     '<input type=\"range\" data-k=\"price\" min=\"500000\" max=\"850000\" step=\"10000\" value=\"'+S.price+'\"><\/div>'+\n   '<div class=\"scen\">'+rates.map(function(r){\n      var on=(S.rate===r)?' on':'';\n      return '<div class=\"c'+on+'\" data-scen=\"'+S.price+'|'+r+'\">'+\n        '<div class=\"k\">At '+r+'%<\/div>'+\n        '<div class=\"v\">'+usd(pi(S.price,r,S.downPct))+'<\/div><div class=\"s\">/mo P&amp;I<\/div><\/div>';}).join('')+'<\/div>'+\n   '<div class=\"modnote\">At '+usd0(S.price)+' and '+S.rate+'% you are paying <b>'+usd(all-cAll)+' a month more<\/b> than you do today &mdash; '+usd((all-cAll)*12)+' a year. Assumes 20% down; the rest of your capital stays liquid.<\/div><\/div>';\n}\nfunction modAfford(){\n  var P=pi(S.price,S.rate,S.downPct), all=P+S.price*0.0105/12+175+S.price*0.01/12;\n  var pg=all/18333*100, ptLo=all/14000*100, ptHi=all/12500*100;\n  var c1=pg<=30?'var(--ok)':pg<=35?'var(--warn)':'var(--bad)';\n  var c2=ptHi<=35?'var(--ok)':ptHi<=44?'var(--warn)':'var(--bad)';\n  return '<div class=\"mod\"><h3>The affordability check<\/h3>'+\n   '<div class=\"cap\">At '+usd0(S.price)+' and '+S.rate+'%, carrying '+usd(all)+'/mo. The mark is the 35% guideline.<\/div>'+\n   '<div class=\"bar\"><div class=\"bl\"><span>Share of gross &mdash; $18,333/mo<\/span><b>'+pg.toFixed(0)+'%<\/b><\/div>'+\n     '<div class=\"tr\"><div class=\"fl\" style=\"width:'+Math.min(pg*2,100)+'%;background:'+c1+'\"><\/div>'+\n     '<div class=\"ceil\" style=\"left:70%\"><\/div><\/div><\/div>'+\n   '<div class=\"bar\"><div class=\"bl\"><span>Share of take-home &mdash; $12,500&ndash;$14,000<\/span><b>'+ptLo.toFixed(0)+'&ndash;'+ptHi.toFixed(0)+'%<\/b><\/div>'+\n     '<div class=\"tr\"><div class=\"fl\" style=\"width:'+Math.min(ptHi*2,100)+'%;background:'+c2+'\"><\/div>'+\n     '<div class=\"ceil\" style=\"left:70%\"><\/div><\/div><\/div>'+\n   '<div class=\"modnote\">The 30&ndash;35% housing guideline puts your ceiling at $5,500&ndash;$6,400/month in total housing costs. <b>The bank will approve you for more than this; that approval is a ceiling, not a target.<\/b><\/div><\/div>';\n}\n\nfunction modStack(){\n  var need=S.price*0.20, hi=611000;\n  return '<div class=\"mod\"><h3>Where the capital goes<\/h3>'+\n   '<div class=\"cap\">Sale proceeds plus liquid savings, against 20% down on '+usd0(S.price)+'.<\/div>'+\n   '<div class=\"stack\">'+\n     '<div style=\"flex:'+need+';background:var(--t-a)\">'+usd0(need)+'<\/div>'+\n     '<div style=\"flex:82500;background:var(--t-b)\">$82.5K<\/div>'+\n     '<div style=\"flex:'+Math.max(hi-need-82500,1)+';background:var(--t-c)\">'+usd0(hi-need-82500)+'<\/div><\/div>'+\n   '<div class=\"stackkey\"><span><i style=\"background:var(--t-a)\"><\/i>20% down<\/span>'+\n     '<span><i style=\"background:var(--t-b)\"><\/i>Emergency fund<\/span>'+\n     '<span><i style=\"background:var(--t-c)\"><\/i>Stays liquid<\/span><\/div>'+\n   '<div class=\"trows\">'+\n     '<div class=\"trow\"><span>Sale proceeds<\/span><b>$161K&ndash;$311K<\/b><\/div>'+\n     '<div class=\"trow\"><span>Liquid savings<\/span><b>$150K&ndash;$300K<\/b><\/div>'+\n     '<div class=\"trow tot\"><span>Available capital<\/span><b>$311K&ndash;$611K<\/b><\/div><\/div>'+\n   '<div class=\"modnote\">You don&rsquo;t need all of it for the down payment &mdash; 20% on a $700K home is $140K. The rest stays liquid.<\/div><\/div>';\n}\n\nfunction card(eb,title,desc,dur,ctas,belongs){\n  return '<div class=\"card\"><div class=\"eb\">'+eb+'<\/div><div class=\"ct\">'+title+'<\/div>'+\n   '<div class=\"cd\">'+desc+'<\/div>'+\n   '<div class=\"belongs\">Upgrade to a $600&ndash;650K home'+(belongs?' &middot; The Long Game':'')+'<\/div>'+\n   '<div class=\"ctas\">'+ctas.map(function(c,i){\n     return '<button class=\"'+(i===0?'primary':'')+'\">'+c+'<\/button>';}).join('')+'<\/div>'+\n   (dur?'<div class=\"foot\"><span class=\"cnt\">'+(eb.indexOf('Action')===0?'Finneas can run this whole':'')+'<\/span><span class=\"dur\">'+dur+'<\/span><\/div>':'')+\n  '<\/div>';\n}\nfunction modGains(){\n  return '<div class=\"mod\"><h3>No capital gains tax expected on the sale<\/h3>'+\n   '<div class=\"cap\">Three things have to be true. All three are.<\/div>'+\n   '<div class=\"trows\">'+\n     '<div class=\"trow\"><span>Primary residence, 2 of the last 5 years<\/span><b>Met<\/b><\/div>'+\n     '<div class=\"trow\"><span>Federal &sect;121 exclusion, married filing jointly<\/span><b>$500,000<\/b><\/div>'+\n     '<div class=\"trow\"><span>Oregon conformity to the federal exclusion<\/span><b>Yes<\/b><\/div>'+\n     '<div class=\"trow tot\"><span>Your estimated gain<\/span><b>Well under $500K<\/b><\/div><\/div>'+\n   '<div class=\"modnote\">Your gain is the sale price minus your original purchase price plus improvement costs. The moderate updates you&rsquo;ve made &mdash; flooring, fixtures, landscaping &mdash; add to your cost basis, further reducing any theoretical gain.<\/div><\/div>';\n}\nfunction modRoth(){\n  var yrs=S.rothYrs, annual=15000, r=0.07;\n  var fv=annual*((Math.pow(1+r,yrs)-1)/r);\n  var put=annual*yrs;\n  var growth=fv-put;\n  var pctPut=Math.max(put/fv*100,4);\n  return '<div class=\"mod\"><h3>$15,000 a year, both of you, starting now<\/h3>'+\n   '<div class=\"cap\">At $220,000 combined you sit below the 2026 direct-contribution phase-out floor of $242,000 &mdash; $7,500 each, tax-free coming out.<\/div>'+\n   '<div class=\"big\">'+usd(fv)+'<\/div><div class=\"bigsub\">at '+yrs+' years, assuming 7% average annual return<\/div>'+\n   '<div class=\"stack\">'+\n     '<div style=\"flex:'+pctPut+';background:var(--t-a)\">You put in<\/div>'+\n     '<div style=\"flex:'+(100-pctPut)+';background:var(--t-c)\">Growth<\/div><\/div>'+\n   '<div class=\"stackkey\"><span><i style=\"background:var(--t-a)\"><\/i>'+usd(put)+' contributed<\/span>'+\n     '<span><i style=\"background:var(--t-c)\"><\/i>'+usd(growth)+' growth<\/span><\/div>'+\n   '<div class=\"sl\"><label>Years of compounding <b>'+yrs+'<\/b><\/label>'+\n     '<input type=\"range\" data-k=\"rothYrs\" min=\"5\" max=\"35\" step=\"1\" value=\"'+yrs+'\"><\/div>'+\n   '<div class=\"modnote\">It doesn&rsquo;t compete with the home purchase &mdash; it runs in parallel. The 2026 window closes April 15, 2027.<\/div><\/div>';\n}\nfunction modTax(){\n  var over=Math.max(220000-200000,0), save=over*S.taxRate/100;\n  var P=pi(S.price,S.rate,S.downPct), cur=306000*0.025/12/(1-Math.pow(1.002083,-360));\n  var deltaMo=P-1209; var deltaYr=deltaMo*12;\n  return '<div class=\"mod\"><h3>What leaving the city limits is worth<\/h3>'+\n   '<div class=\"cap\">Your figure: an additional 3% on household income above $200,000. Move the rate if the real one differs &mdash; Multnomah and Metro stack, and the thresholds are not identical.<\/div>'+\n   '<div class=\"sl\"><label>Rate above the threshold <b>'+S.taxRate+'%<\/b><\/label>'+\n     '<input type=\"range\" data-k=\"taxRate\" min=\"1\" max=\"4\" step=\"0.5\" value=\"'+S.taxRate+'\"><\/div>'+\n   '<div class=\"trows\">'+\n     '<div class=\"trow\"><span>Household income above $200,000<\/span><b>'+usd(over)+'<\/b><\/div>'+\n     '<div class=\"trow\"><span>Tax you stop paying, per year<\/span><b>'+usd(save)+'<\/b><\/div>'+\n     '<div class=\"trow\"><span>New payment vs. your 2.5% payment, per year<\/span><b class=\"neg\">+'+usd(deltaYr)+'<\/b><\/div>'+\n     '<div class=\"trow tot\"><span>Net, per year<\/span><b class=\"neg\">&minus;'+usd(deltaYr-save)+'<\/b><\/div><\/div>'+\n   '<div class=\"modnote\"><b>Don&rsquo;t move for the tax.<\/b> At your income it&rsquo;s about '+usd(save/12)+' a month, against a payment change of roughly '+usd(deltaMo)+' a month. Move for the acre if you want the acre. The tax saving won&rsquo;t change your position either way.<\/div><\/div>';\n}\nfunction twoSided(){\n  return '<div class=\"two\">'+\n   '<div class=\"f\"><div class=\"fk\">If you move<\/div>'+\n   '<div class=\"fh\">You get the acre. Your payment roughly doubles.<\/div>'+\n   '<div class=\"fd\">You get the land, the animals, and out of the city tax base. You trade a 2.5% mortgage for something near 6.5&ndash;7%, and roughly <b>'+usd(pi(S.price,S.rate,S.downPct)-1209)+' more a month<\/b> in principal and interest alone. Travel funds and the down payment compete directly. At $600K it is comfortable; at $800K it is, in your words, doable but tighter.<\/div><\/div>'+\n   '<div class=\"f\"><div class=\"fk\">If you stay<\/div>'+\n   '<div class=\"fh\">You keep the 2.5%. You stay in the city, on a quarter acre.<\/div>'+\n   '<div class=\"fd\">You keep a 2.5% mortgage and your savings rate. Travel gets funded sooner and retirement keeps compounding. You keep paying the preschool tax, there&rsquo;s no room for more animals, and <b>the 10-to-15-year plan you made in 2018 turns into something longer<\/b>. Portland prices are down 2.8% year-over-year, so waiting has a cost too.<\/div><\/div><\/div>';\n}\nfunction digest(){\n  return '<div class=\"digest\"><div class=\"dk\">What I found while you were answering<\/div>'+\n   '<div class=\"di\"><div class=\"dt\">Portland is a soft market right now<\/div>'+\n   '<div class=\"dd\">Prices are down roughly 2.8% year-over-year. Your sale proceeds shrink, and so does the price of the acre.<\/div><\/div>'+\n   '<div class=\"di\"><div class=\"dt\">The rate swap is the real cost of moving<\/div>'+\n   '<div class=\"dd\">Current 30-year fixed is near 6.5&ndash;7% against your 2.5%. It is the largest single number in this decision.<\/div><\/div>'+\n   '<div class=\"di\"><div class=\"dt\">Crossing the county line changes three things, not one<\/div>'+\n   '<div class=\"dd\">Tax base, commute, and insurance. Rural and semi-rural coverage prices differently, and outbuildings for animals are usually not covered by default.<\/div><\/div><\/div>';\n}\nfunction act(n,t,d,tm,watch){\n  return '<div class=\"act\"><div class=\"n\">'+n+'<\/div><div><div class=\"at\">'+t+'<\/div>'+\n   '<div class=\"ad\">'+d+'<\/div>'+(tm?'<span class=\"tm\">'+tm+'<\/span>':'')+\n   (watch?'<div class=\"watch\"><b>Watch for:<\/b> '+watch+'<\/div>':'')+'<\/div><\/div>';\n}\n\n/* ---------------- dialogue ----------------\n   typed  \u2192 answer sends from the dock\n   banded \u2192 pills\n   more   \u2192 analysis beat, advances on the pill  */\nvar D=[\n\n/* 0 \u2014 open, voiced. Asks nothing about money. */\n{ says:\"Good question &mdash; tell me a little more about why you&rsquo;re asking.\",\n  sub:\"What&rsquo;s making this the thing on your mind right now?\",\n  answer:\"Along with the chickens and the dogs, we&rsquo;d definitely like to have an acre or so for farm animals. The other consideration is we&rsquo;re a married couple that doesn&rsquo;t have kids, and the taxes in Portland are pretty high, especially for high income earners &mdash; above 200k household income it&rsquo;s an additional 3% for a preschool initiative. So we&rsquo;d like to move beyond the city limits just because we&rsquo;re paying for a lot of taxes and services we don&rsquo;t necessarily use.\" },\n\n/* 1 \u2014 Finneas names it back. Earned, not asserted. */\n{ says:\"You&rsquo;re buying land and a lower tax bill. The house is what comes with it.\",\n  sub:\"You want land for the animals, and you want out of a tax base you&rsquo;re funding but not using. A bigger house is how you get there, not the reason you&rsquo;re going.<br><br>That changes what I need to ask you. I don&rsquo;t need to know much about the house you want. I need to know what leaving costs you, and what it saves you.\",\n  ask:\"Does that land right?\",\n  opts:[\"That&rsquo;s it\",\"Close, but there&rsquo;s more to it\",\"Not really &mdash; let me restate it\"],\n  answered:\"That&rsquo;s it\" },\n\n/* 2 \u2014 one more voiced, because the answer routes the rest */\n{ bare:true,\n  toast:\"Started a priority for you &mdash; <b>Get the acre outside the city limits<\/b>. Nothing is saved until you say so.\",\n  ask:\"Anything else going on that this has to fit around?\",\n  answer:\"We bought this house in 2018 with a 10 to 15 year plan of using it as a starter home. Right now we&rsquo;re pretty much in saving mode. We&rsquo;re also building travel funds &mdash; my wife has never been out of the country, so I&rsquo;m trying to get that checked off the list. And I have a 2.5% mortgage, which when we do move will be a painful transition.\" },\n\n/* 3 */\n{ says:\"The 2.5% is the expensive part of this. I&rsquo;ll come back to it.\",\n  sub:\"Five questions, not ten &mdash; the rest I can look up or don&rsquo;t need given what you&rsquo;ve told me.\",\n  ask:\"Roughly what do you still owe?\",\n  meta:\"1 of 5\",\n  why:\"It sets your equity, and equity is what buys the acre.\",\n  banded:true,\n  opts:[\"Under $200K\",\"$200K&ndash;$350K\",\"$350K&ndash;$500K\"],\n  answered:\"$200K&ndash;$350K\" },\n\n/* 4 */\n{ bare:true, meta:\"2 of 5\",\n  ask:\"And the rate on it?\",\n  why:\"You said 2.5%. I want to confirm it before I price what replacing it costs.\",\n  banded:true,\n  opts:[\"Below 3%\",\"3%&ndash;4%\",\"4%&ndash;5%\",\"Above 5%\"],\n  answered:\"Below 3%\",\n  lace:[\"Working while you answer\",\"Portland median list is holding around $545K and prices are down roughly 2.8% year-over-year. Current 30-year fixed is sitting near 6.5&ndash;7%. I&rsquo;ll price the swap on both.\"] },\n\n/* 5 */\n{ bare:true, meta:\"3 of 5\",\n  ask:\"How much do you have in liquid savings?\",\n  why:\"An acre outside the city is a different market from your block. Cash decides whether you can move without a bridge loan.\",\n  banded:true,\n  opts:[\"Under $25K\",\"$25K&ndash;$75K\",\"$75K&ndash;$150K\",\"$150K&ndash;$300K\"],\n  answered:\"$150K&ndash;$300K\" },\n\n/* 6 */\n{ bare:true, meta:\"4 of 5\",\n  ask:\"What would most likely pull this earlier than five years?\",\n  why:\"You said 10 to 15 years in 2018, which puts you at 2028 at the earliest. I want to know what breaks that.\",\n  opts:[\"Growing family / need more space\",\"Finding the right property\",\"Income increase\",\"No specific trigger\"],\n  answered:\"Income increase\",\n  lace:[\"Working while you answer\",\"Land outside the Multnomah line changes your tax picture and your commute, and it usually changes your insurance. I&rsquo;m pulling all three.\"] },\n\n/* 7 */\n{ bare:true, meta:\"5 of 5\",\n  ask:\"Sell first, or buy first?\",\n  why:\"Sell-first means temporary housing with three dogs and chickens. That&rsquo;s a real constraint, not a footnote.\",\n  opts:[\"Sell current home first, then buy\",\"Buy new home first, then sell\",\"Simultaneous close\",\"Not sure yet\"],\n  answered:\"Sell current home first, then buy\" },\n\n/* 8 \u2014 the answered set, editable */\n{ recapRows:true,\n  says:\"That&rsquo;s everything I need.\",\n  sub:\"Change any of it and I&rsquo;ll re-run the numbers.\",\n  cta:\"Show me the math\",\n  more:true },\n\n/* 9 \u2014 the math */\n{ more:true, math:\"The Math\",\n  says:\"Moving costs you about $1,900 a month more than staying.\",\n  sub:\"Your 2.5% mortgage is the expensive part. Replacing it at today&rsquo;s 6.5% roughly doubles the payment on the house, and that is true whichever place you end up in.<br><br>Two things work in your favour. Your home carries a Trulia/Zillow-range estimate of $555,700 against a $200K&ndash;$350K payoff, so the sale gives you real capital. And the &sect;121 exclusion covers the gain, so none of it is taxed.<br><br>The Portland tax is not the reason to go. You said 3% above $200K for services you don&rsquo;t use, which is true &mdash; and it is worth about $50 a month against a payment change of nearly $1,900.\",\n  mod:function(){return modCompare()+modRefine();}, recap:\"Stay against move.\",\n  cta:\"See my options\" },\n\n/* 10 \u2014 the options component */\n{ more:true,\n  mod:modOptions, recap:\"Three distances, and the trade-off you opened.\", gate:true,\n  cta:\"What about the money to do it?\" },\n\n/* 11 \u2014 the capital, and what not to break */\n{ more:true, math:\"The money to do it\",\n  toastFn:function(){\n    var sel=OPTS.filter(function(x){return x.id===S.opt})[0]||OPTS[0];\n    return 'Target added to <b>Get the acre<\/b> &mdash; '+sel.miles+' miles out at '+usd0(S.price)+', '+usd(costAt(sel,S.price))+' a month.';\n  },\n  says:\"You&rsquo;ll have more capital than any of these need.\",\n  mod:modStack,\n  after:\"Sell-first gives you a known number before you make an offer. The gap period is the cost &mdash; three dogs and chickens rule out most short-term rentals, so budget one to three months and start looking early.<br><br><b>Two things this shouldn&rsquo;t break.<\/b> You&rsquo;re contributing 16&ndash;20% to retirement, which is strong; a stretched payment creates pressure to cut it. And your wife&rsquo;s first trip abroad comes from the same money as the down payment &mdash; decide now which one gives.<br><br>Before any of it, drive the commute on a Tuesday at 8am.\",\n  recap:\"You looked at how the capital splits here.\",\n  cta:\"Get a step-by-step guide\" },\n\n/* 12 \u2014 the handoff, the watching, and the save decision */\n{ more:true,\n  says:\"Here&rsquo;s what I&rsquo;d put on your plan.\",\n  sub:\"Nothing here asks you to move money before you know what the house is worth and what a lender will give you.\",\n  handoff:true, authorise:true, gate:true }\n];\n\nvar HOME={hero:'Welcome back, Luke.', sub:'Three things for us this week, and I&rsquo;ve been watching rates.'};\nvar HOME_CARDS=[\n {n:1, pri:['Get the acre'], title:'Send me your returns and pay statements',\n  body:\"Two years of personal returns and three months of pay statements &mdash; yours and your wife&rsquo;s. Both incomes go on the application.\",\n  cta:'Add information'},\n {n:2, pri:['Get the acre','Cash flow'], title:'Find lenders who write acreage loans',\n  body:\"Parcels over an acre with outbuildings put some lenders off. I&rsquo;ll shortlist the ones that don&rsquo;t.\",\n  cta:'Send to Finneas'},\n {n:3, pri:['Get the acre'], title:'Drive the commute before you shortlist',\n  body:\"Tuesday, 8am, from each of the three distances. Forty minutes each way is 29 hours a month you haven&rsquo;t lived yet.\",\n  cta:'Talk it through'}\n];\nvar WEEK_STEPS=[\n {pri:['Get the acre'], t:'Send me your returns and pay statements',\n  b:\"Two years of personal returns, three months of pay statements, both of you.\",\n  tag:'10 MIN', cta:'Add information'},\n {pri:['Get the acre','Cash flow'], t:'Find lenders who write acreage loans',\n  b:\"I&rsquo;ll shortlist the ones that handle land and outbuildings.\",\n  tag:'I&rsquo;LL RUN IT', cta:'Send to Finneas'},\n {pri:['Get the acre'], t:'Drive the commute before you shortlist',\n  b:\"Nine miles, twenty-four, thirty-one. Tuesday morning, all three.\",\n  tag:'2 HRS', cta:'Talk it through'}\n];\nvar CAL={title:'To-Do: Week of Aug 25', sub:'Everything this week points at one thing: what a lender will actually give you on a parcel with animals on it. Until that number is real, the rest is an estimate.',\n weeks:[['Aug 18','Done','done'],['Aug 25','Now','now'],['Sep 1','Next',''],['Sep 8','',''],['Sep 15','','']],\n next:['Pre-approval application &mdash; once your documents are in','Zoning and insurance check on anything you shortlist']};\nvar PRI={t:'Get the acre outside the city limits', b:'Confirm what you can borrow, then settle the drive &mdash; before you settle on a price.', n:4};\nvar REC={t:'Price the insurance before you fall in love', b:'Rural and semi-rural cover prices differently, and outbuildings for animals usually aren&rsquo;t included by default. On a parcel with chickens and three dogs this is not a footnote.',\n why:'It is the one cost nobody quotes you until after you have made an offer.'};\nvar PAST={t:'Upgrading the house', b:'What moving costs, three ways to get the acre, and what the Portland tax is actually worth &mdash; 20 August'};\nvar NOTSTARTED=['Get a CMA on N Russet','Compare Clackamas and Washington County','Model the gap-period housing','Max both Roth IRAs for 2026'];\nvar FOUND=[\n ['Cash','&#9635;','ok','Income and savings known'],\n ['Safety','&#9679;','ok','$150K&ndash;$300K liquid'],\n ['Protection','&#10039;','grey','No cover details yet'],\n ['Debt','&#9636;','ok','Mortgage only'],\n ['Long game','&#9650;','ok','16&ndash;20% going in'],\n ['Taxes','&#9638;','grey','Nothing on tax yet']\n];\nvar FOUND_NOTE='4 of 6 measured. I can only score what you&rsquo;ve told me &mdash; the rest stay blank rather than guessing.';\nvar ASKS=[\n ['What does the drive actually cost me?','29 hours a month at the far end'],\n ['Should I keep the 2.5% and rent it out?','The rental math is worse than it looks'],\n ['How much house does $735K buy out there?','Half an acre to an acre, nine miles out']\n];\n\n/* ---------------- home + plan sheet ---------------- */\n\nfunction ebText(pri){\n  var t=pri.slice(0,2).join(', ')+(pri.length>2?', +'+(pri.length-2):'');\n  return t.replace(/&rsquo;s/g,'S').toUpperCase().replace(/&NDASH;/g,'&ndash;').replace(/&MDASH;/g,'&mdash;');\n}\nfunction homeCard(c){\n  var eb=ebText(c.pri);\n  var act = c.cta==='Send to Finneas'\n    ? '<button class=\"btn-work\">Send to Finneas<\/button>'\n    : '<div class=\"cact\">'+c.cta+' &nbsp;&#9656;<\/div>';\n  return '<div class=\"hcard\"><span class=\"eyebrow\">'+eb+'<\/span>'+\n   '<div class=\"crow2\"><div class=\"num\">'+c.n+'<\/div><div>'+\n   '<div class=\"ctitle\">'+c.title+'<\/div>'+\n   '<div class=\"cbody\">'+c.body+'<\/div>'+act+\n   '<\/div><\/div><\/div>';\n}\n\nfunction stepRow(st){\n  var eb=ebText(st.pri);\n  return '<div class=\"pcard\"><div class=\"eyebrow\">'+eb+'<\/div>'+\n   '<div class=\"pt\">'+st.t+'<\/div><div class=\"pb\">'+st.b+'<\/div>'+\n   '<div class=\"prow\"><span class=\"dur\">'+st.tag+'<\/span>'+\n   '<span class=\"ta\">'+st.cta+' <i>&#9656;<\/i><\/span><\/div><\/div>';\n}\n\nfunction tabCalendar(){\n  return '<div class=\"sect\"><div class=\"sicon\">&#9776;<\/div>'+\n   '<div class=\"stitle\">'+CAL.title+'<\/div>'+\n   '<div class=\"ssub\">'+CAL.sub+'<\/div><\/div>'+\n   '<div class=\"weeks\">'+CAL.weeks.map(function(w){\n     return '<div class=\"wk '+w[2]+'\"><span>Week of<\/span><b>'+w[0]+'<\/b>'+(w[1]?'<i>'+w[1]+'<\/i>':'')+'<\/div>';\n   }).join('')+'<\/div>'+\n   '<div
