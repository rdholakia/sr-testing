<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finneas — Ask, paced. Joshua / retiring at 55</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#4b2a39;--cream:#f3efe5;--cream-2:#e9e4d6;--ink:#2c1d24;--lilac:#b57ce0;
  --t-a:#f0a47f;--t-b:#f2e076;--t-c:#abdfa6;--dim:rgba(255,255,255,.72);
  --ok:#5fa85f;--warn:#d8a24a;--bad:#c96a5a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:'Hanken Grotesk',-apple-system,sans-serif;background:#171015;color:#fff;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 16px 60px;gap:14px}

.chrome{width:100%;max-width:930px;display:flex;flex-direction:column;gap:9px}
.chrome h1{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8a7a83}
.steps{display:flex;gap:5px;flex-wrap:wrap}
.steps button{background:#241a20;border:1px solid #3a2c33;color:#bda9b4;font:inherit;font-size:11px;
  font-weight:600;padding:6px 10px;border-radius:7px;cursor:pointer}
.steps button.on{background:#fff;color:#171015;border-color:#fff}
.steps button.home{border-color:#6b4f5e}
.vsw{display:flex;gap:6px;align-items:center;margin-top:2px}
.vsw span{font-size:11px;color:#7d6d76;margin-right:4px}
.vsw button{background:#241a20;border:1px solid #3a2c33;color:#bda9b4;font:inherit;font-size:11px;
  font-weight:600;padding:6px 11px;border-radius:7px;cursor:pointer}
.vsw button.on{background:var(--lilac);color:#fff;border-color:var(--lilac)}
.slout{font-size:12px;color:#7a6f62;margin-top:5px}
.slout b{color:var(--ink);font-weight:700}
.cmpt th.selth{color:var(--ink);border-bottom:2px solid var(--ink)}
.cmpt td.selc{background:#efe9db}
.selbox{background:#efe9db;border-radius:9px;padding:13px 14px;margin-top:14px}
.selk{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#a3967f}
.selp{font-size:13px;line-height:1.5;color:#5c5145;margin-top:6px}
.refm{padding-top:14px;padding-bottom:14px}
.rfhead{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.rfk{font-size:13.5px;font-weight:700;color:var(--ink)}
.rfs{font-size:12px;color:#7a6f62;margin-top:3px}
.rfchev{font-size:10px;color:#a3967f}
.rfbody{border-top:1px solid #e0d9c9;margin-top:13px;padding-top:4px}
.rfi{border-top:1px solid #e0d9c9;padding:13px 0}
.rfi:first-of-type{border-top:0;padding-top:4px}
.rfh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.rft{font-size:14px;font-weight:600;color:var(--ink);line-height:1.35}
.rfw{font-size:12.5px;line-height:1.5;color:#7a6f62;margin-top:5px}
.rfb{flex:none;background:transparent;border:1px solid #b3a795;color:#4a4038;font:inherit;font-size:11.5px;
  font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.rfb.on{background:var(--ink);border-color:var(--ink);color:#fff}
.modfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-top:1px solid #e0d9c9;margin-top:15px;padding-top:14px}
.mfl{flex:1}
.mfh{font-family:'Newsreader',serif;font-size:21px;line-height:1.15;color:var(--ink)}
.mfs{font-size:11.5px;color:#7a6f62;margin-top:3px}
.tgtset{border-top:1px solid #e0d9c9;margin-top:15px;padding-top:14px;text-align:center}
.tgtl{font-size:13px;line-height:1.45;color:#5c5145}
.btn-set{flex:none;background:var(--ink);color:#fff;border:0;font:inherit;font-size:12px;font-weight:700;
  padding:8px 14px;border-radius:999px;cursor:pointer;margin-top:2px;white-space:nowrap}
.btn-set.ghost{background:#e6dfd0;border:0;color:#6b5f52;font-weight:600}
.tgtset.done .tgtl{font-weight:700;color:var(--ink)}
.declined{background:rgba(255,255,255,.08);border-radius:12px;padding:15px 16px 16px;margin-top:16px;text-align:center}
.declined .dh{font-size:16px;font-weight:600;color:#fff}
.declined .dp{font-size:12.5px;line-height:1.5;color:var(--dim);margin-top:6px}
.setgoal{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);border-radius:12px;
  padding:15px 16px 16px;margin-top:16px;text-align:center}
.setgoal.done{background:rgba(181,124,224,.16);border-color:rgba(181,124,224,.5)}
.sgp{font-size:14.5px;font-weight:600;color:#fff}
.sgn{font-size:12.5px;line-height:1.45;color:var(--dim);margin-top:5px}
.pill-ghost{background:transparent;border:1px solid rgba(255,255,255,.34);color:#fff;font:inherit;
  font-size:13px;font-weight:600;padding:9px 18px;border-radius:999px;cursor:pointer;display:block}
.expw{border-top:1px solid #e0d9c9;margin-top:16px;padding-top:14px}
.exph{font-size:13px;font-weight:700;color:var(--ink)}
.expc{font-size:12.5px;line-height:1.5;color:#7a6f62;margin-top:11px}
.agew{margin-top:16px}
.agel{font-size:12.5px;font-weight:600;color:#7a6f62}
.ages{display:flex;gap:4px;margin-top:8px;background:#e0d9c9;border-radius:9px;padding:4px}
.ageb{flex:1;background:transparent;border:0;color:#7a6f62;font:inherit;font-size:13px;font-weight:600;
  padding:9px 0;border-radius:7px;cursor:pointer}
.ageb.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.conf{border-top:1px solid #e0d9c9;margin-top:15px;padding-top:13px;cursor:pointer}
.conf .ch{display:flex;align-items:center;gap:9px}
.conf .ck{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#a3967f}
.conf .cv{font-size:13px;font-weight:700;margin-left:auto}
.conf .cchev{font-size:10px;color:#a89b8a}
.conf .cbar{height:5px;background:#ddd7c9;border-radius:5px;margin-top:9px;overflow:hidden}
.conf .cbar i{display:block;height:100%;background:#c9a227;border-radius:5px}
.conf .cd{font-size:11.5px;color:#7a6f62;margin-top:7px;line-height:1.45}
.conf .clist{margin-top:12px}
.conf .cli{display:flex;gap:9px;font-size:12px;line-height:1.45;color:#5f5459;margin-top:7px}
.conf .cli i{flex:none;font-style:normal;font-size:11px;width:12px}
.conf .cli.miss{color:#8a5a4e}
.toast{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.10);
  border-radius:10px;padding:13px 15px;margin-top:16px}
.toast .tk{flex:none;width:22px;height:22px;border-radius:6px;background:var(--lilac);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px}
.toast .tt{font-size:14px;line-height:1.4;color:rgba(255,255,255,.9)}
.toast .tt b{color:#fff;font-weight:600}
.toast .tv{font-size:12.5px;font-weight:700;color:var(--lilac);cursor:pointer;flex:none;margin-left:auto}
.lace{background:rgba(255,255,255,.08);border-radius:9px;padding:12px 14px;margin-top:14px}
.lace .lk{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--lilac)}
.lace p{font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.82);margin-top:7px}
.digest{margin-top:18px}
.digest .dk{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.digest .di{background:var(--cream);color:var(--ink);border-radius:12px;padding:15px 16px;margin-top:11px}
.digest .dt{font-family:'Newsreader',serif;font-size:19px;line-height:1.2}
.digest .dd{font-size:13.5px;line-height:1.5;color:#6b5f64;margin-top:6px}
.rowa{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
  border-bottom:1px solid rgba(255,255,255,.14);padding:10px 0;font-size:13.5px}
.rowa .q{color:var(--dim);flex:1}
.rowa .a{color:#fff;font-weight:600}
.rowa .ed{color:var(--lilac);font-size:12px;text-decoration:underline;cursor:pointer;flex:none}
.two{display:flex;gap:9px;margin-top:16px}
.two .f{flex:1;background:var(--cream);color:var(--ink);border-radius:12px;padding:15px 14px}
.two .f .fk{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#a3967f}
.two .f .fh{font-family:'Newsreader',serif;font-size:18px;line-height:1.2;margin-top:7px}
.two .f .fd{font-size:12.5px;line-height:1.5;color:#5f5459;margin-top:9px}
.two .f .fd b{color:var(--ink)}
.note{font-size:12px;color:#7d6d76;max-width:930px;line-height:1.5;text-align:center}

.device{width:392px;height:812px;background:var(--plum);border-radius:44px;
  box-shadow:0 0 0 10px #100b0e,0 0 0 12px #2c2027,0 34px 70px rgba(0,0,0,.6);overflow:hidden;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px}
.body::-webkit-scrollbar{width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 22px 6px;flex:none}
.wm{font-family:'Newsreader',serif;font-size:19px}
.burger{width:22px}.burger span{display:block;height:1.5px;background:#fff;margin:5px 0}
.avatar{width:34px;height:34px;border-radius:9px;background:var(--lilac);display:flex;align-items:center;
  justify-content:center;font-family:'Newsreader',serif;font-size:19px;margin:16px 0 14px}
.avatar.c{margin:14px auto 16px}
.hero{font-family:'Newsreader',serif;font-size:29px;line-height:1.16;text-align:center}

.said{font-family:'Newsreader',serif;font-size:23px;line-height:1.26;color:#fff}
.sub{font-size:16px;line-height:1.5;color:rgba(255,255,255,.78);margin-top:11px}
.sub b{color:#fff;font-weight:600}
.ask{font-size:16px;font-weight:600;line-height:1.4;margin-top:18px;color:#fff}
.qwhy{font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.6);font-style:italic;margin-top:9px}
.fieldfoot{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:12.5px;color:var(--dim)}
.fieldfoot .skip{cursor:pointer;text-decoration:underline}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{background:transparent;border:1px solid rgba(255,255,255,.42);color:#fff;font:inherit;font-size:14.5px;
  padding:12px 15px;border-radius:22px;text-align:left;cursor:pointer;transition:.14s}
.opt:hover{background:rgba(255,255,255,.1)}
.opt.ghost{border-style:dashed;color:var(--dim)}
.turn{margin-top:8px;max-width:96%;margin-right:auto}
.fade{animation:fu .34s cubic-bezier(.2,.7,.2,1) both}
.fade2{animation:fu .40s cubic-bezier(.2,.7,.2,1) .16s both}
.fade3{animation:fu .40s cubic-bezier(.2,.7,.2,1) .32s both}
@keyframes fu{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes dis{from{opacity:0}to{opacity:1}}
.dissolve{animation:dis .34s ease both}

.mine{display:flex;justify-content:flex-end;margin:26px 0 30px}
.mine .b{background:#5e4557;color:#f3efe5;border-radius:14px;padding:18px 20px;
  font-size:16.5px;line-height:1.45;max-width:88%;text-align:left}
.recap{background:rgba(255,255,255,.08);border-radius:9px;padding:12px 14px;font-size:13.5px;
  line-height:1.45;color:rgba(255,255,255,.8);margin-top:13px}

.mathhead{font-family:'Newsreader',serif;font-size:22px;color:#fff;margin-top:26px}
ul.t{margin:13px 0 0;padding:0;list-style:none}
ul.t li{font-size:15px;line-height:1.5;color:rgba(255,255,255,.8);padding-left:16px;position:relative;margin-top:9px}
ul.t li:before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4)}
ul.t li b{color:#fff;font-weight:600}
.closing{background:rgba(255,255,255,.09);border-left:3px solid var(--lilac);border-radius:0 9px 9px 0;
  padding:14px 15px;margin-top:17px;font-size:15px;line-height:1.5}

/* ---- cream artifacts ---- */
.mod{background:var(--cream);color:var(--ink);border-radius:12px;padding:17px;margin-top:18px}
.mod h3{font-family:'Newsreader',serif;font-size:21px;font-weight:400;line-height:1.18}
.mod .cap{font-size:12px;color:#7a6f74;margin-top:4px;line-height:1.45}
.mod .modnote{font-size:11.5px;line-height:1.5;color:#7a6f74;margin-top:12px}
.mod .modnote b{color:var(--ink)}
.big{font-family:'Newsreader',serif;font-size:36px;line-height:1;margin-top:13px}
.bigsub{font-size:12.5px;color:#7a6f74;margin-top:3px}
.sl{margin-top:15px}
.sl label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:#7a6f74;margin-bottom:2px}
.sl label b{color:var(--ink);font-size:13.5px}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;background:#d3ccbd;border-radius:4px;outline:0;margin-top:7px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--ink);cursor:pointer;border:3px solid var(--cream)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ink);
  cursor:pointer;border:3px solid var(--cream)}
.trow{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:#6b5f52;
  padding:10px 0;border-bottom:1px solid #e0d9c9}
.trows{margin-top:14px;border-top:1px solid #e0d9c9}
.trow b{color:var(--ink);font-weight:700;text-align:right;white-space:nowrap}
.trow.tot{border-bottom:0;padding-top:12px}
.trow.tot span{font-weight:700;color:var(--ink)}
.trow.tot b{font-size:18px}
.trow .neg{color:#8a5a4e}
.cmpt{background:var(--cream);color:var(--ink);border-radius:12px;padding:6px 14px 14px;margin-top:18px}
.cmpt table{border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed}
.cmpt th{text-align:right;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:#7a6f62;padding:12px 0 8px 6px;border-bottom:1px solid #cfc6b5;line-height:1.25}
.cmpt th:first-child{text-align:left;width:42%;padding-left:0}
.cmpt th:nth-child(2){width:26%}
.cmpt td{padding:9px 0 9px 6px;border-bottom:1px solid #e6dfd0;line-height:1.3;text-align:right;
  font-weight:700}
.cmpt td:first-child{text-align:left;font-weight:400;color:#6b5f52;padding-left:0}
.cmpt tr:last-child td{border-bottom:0}
.cmpt tr.hi td{background:#e6dfd0}
.cmpt tr.sec td{padding-top:16px;border-bottom:1px solid #cfc6b5}
.cmpt tr.sec td:first-child{font-size:9px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:#a3967f}
/* three-lender variant — four columns in 392px */
.cmpt.three table{font-size:11px}
.cmpt.three th:first-child{width:31%}
.cmpt.three th{width:23%;padding-left:4px}
.cmpt.three td{padding-left:4px;font-size:11px}
.cmpt.three td:first-child{font-size:11.5px}
.cmpt.three .dl{font-size:9.5px}
.qb{background:#e9e2d4;border-left:3px solid var(--plum);border-radius:0 8px 8px 0;
  padding:12px 13px;margin-top:14px;font-size:14px;line-height:1.5;color:#4a4038;font-style:italic}
.opd{margin-top:15px;border-top:1px solid #e0d9c9;padding-top:14px}
.opd .oh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.opd .on1{font-family:'Newsreader',serif;font-size:21px;line-height:1.15}
.opd .op{font-size:19px;font-weight:700;white-space:nowrap}
.opd .om{font-size:12.5px;color:#7a6f62;margin-top:6px;line-height:1.45}
.opd .orow{display:flex;justify-content:space-between;font-size:13.5px;
  border-bottom:1px solid #e0d9c9;padding:10px 0}
.opd .orow:first-of-type{border-top:1px solid #e0d9c9;margin-top:13px}
.opd .orow span{color:#6b5f52}
.opd .orow b{font-weight:700}
.opd .orow b.up{color:#8a5a4e}
.dl2{display:block;font-size:10.5px;color:#a3967f;margin-top:2px;font-weight:400}
.cmpt td.ql{font-weight:400;font-size:11.5px;color:#4a4038;line-height:1.35;text-align:right}
.cmpt .dl{font-size:10.5px;font-weight:400;color:#8a7f70;display:block;margin-top:2px}
.cmpt .up{color:#8a5a4e}
.cmpt .neu{color:#4a4038}
.cmpt .win{color:#3f6b3f}
.scen{display:flex;gap:7px;margin-top:15px}
.scen .c{flex:1;background:var(--cream-2);border-radius:9px;padding:11px 9px;cursor:pointer;
  border:2px solid transparent;transition:.15s}
.scen .c.on{border-color:var(--ink);background:#fff}
.scen .c .k{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:#7a6f74;font-weight:700;line-height:1.3}
.scen .c .v{font-family:'Newsreader',serif;font-size:21px;line-height:1;margin-top:6px}
.scen .c .s{font-size:10.5px;color:#7a6f74;margin-top:3px}
.bar{margin-top:13px}
.bar .bl{display:flex;justify-content:space-between;font-size:12px;color:#6b5f52;margin-bottom:5px}
.bar .bl b{color:var(--ink)}
.bar .tr{height:11px;background:#ddd7c9;border-radius:6px;position:relative;overflow:visible}
.bar .fl{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar .ceil{position:absolute;top:-3px;bottom:-3px;width:2px;background:#7a6f74}
.bar .ceill{font-size:10px;color:#8a5a4e;margin-top:6px}
.stack{display:flex;height:36px;border-radius:8px;overflow:hidden;margin-top:15px}
.stack div{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;
  color:#2c1d24;transition:flex-grow .5s cubic-bezier(.2,.7,.2,1);overflow:hidden;white-space:nowrap}
.stackkey{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:#6b5f52;margin-top:10px}
.stackkey i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}

.grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  font-weight:700;margin-top:20px}

/* handoff / proposed pack — in chat */
.prop{background:var(--cream);color:var(--ink);border-radius:12px;padding:18px 17px;margin-top:16px}
.prop .lab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#7a6f74}
.prop h3{font-family:'Newsreader',serif;font-size:25px;font-weight:400;margin-top:5px;line-height:1.2}
.prop .tgt{font-size:14px;line-height:1.45;color:#4d4048;margin-top:9px}
.pgrp{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#a3967f;
  margin-top:16px;padding-top:14px;border-top:1px solid #ddd7c9}
.prop .pgrp:first-of-type{margin-top:10px;padding-top:0;border-top:0}
.pact.watch .pn{border:0;background:#e6dfd0;color:#7a6f62;font-size:11px}
.pact.watch .pt{font-weight:500}
.pact{display:flex;gap:11px;padding:13px 0;border-top:1px solid #ddd7c9}
.pact .pn{flex:none;width:23px;height:23px;border:1px solid #9c948a;border-radius:5px;display:flex;
  align-items:center;justify-content:center;font-size:12px;margin-top:1px}
.pact .pt{font-size:15px;font-weight:600;line-height:1.3;margin-top:0}
.pact .pd{font-size:12.5px;line-height:1.4;color:#6b5f64;margin-top:3px}
.who{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:2px 7px;border-radius:20px;margin-top:6px}

function fv(start,pmt,rate,yrs){
  var r=rate/100/12,n=yrs*12;
  return start*Math.pow(1+r,n)+pmt*((Math.pow(1+r,n)-1)/r);
}
function potMo(pot){return pot*0.04/12;}
var TARGET=10000;

  var y=svcYrs(), pct=pensionPct(), mo=pensionMo();
  return '<div class="mod"><h3>'+usd(mo)+' a month, for life</h3>'+
   '<div class="cap">'+y+' years of Special Risk service at 3% a year. Move the pay figure &mdash; it is the number the whole pension rests on.</div>'+
   '<div class="sl"><label>Average final compensation <b>'+usd(S.afc)+'</b></label>'+
     '<input type="range" data-k="afc" min="80000" max="140000" step="2500" value="'+S.afc+'"></div>'+
   '<div class="trows">'+
     '<div class="trow"><span>Service at '+S.retire+'</span><b>'+y+' years</b></div>'+
     '<div class="trow"><span>Special Risk accrual<span class="dl2">Higher than the 1.6% for regular class &mdash; confirm the rate</span></span><b>3% assumed</b></div>'+
     '<div class="trow"><span>Share of final pay</span><b>'+pct+'%</b></div>'+
     '<div class="trow tot"><span>Pension, every month</span><b>'+usd(mo)+'</b></div>'+
   '</div>'+
   '<div class="modnote"><b>You have not told me your average final compensation, and I have not guessed at it.</b> '+
   'It is the average of your highest eight years, not your last one. Across the range on that slider your pension moves by '+
   usd(140000*0.69/12-80000*0.69/12)+' a month &mdash; which is why the FRS statement is the first thing on your list and not the fifth. '+
   'Florida has no state income tax, so this figure arrives whole.</div></div>';
}

function modSurplus(){
  var take=10724.84, ess=9865.55, house=2393.90, sur=take-ess;
  var pct=sur/take*100;
  return '<div class="mod"><h3>'+usd(sur)+' a month</h3>'+
   '<div class="cap">Everything that lands, less everything that leaves. Your figures, to the cent.</div>'+
   '<div class="bar"><div class="bl"><span>Share of take-home that is yours to direct</span><b>'+pct.toFixed(1)+'%</b></div>'+
     '<div class="tr"><div class="fl" style="width:'+pct+'%;background:var(--t-b)"></div></div></div>'+
   '<div class="trows">'+
     '<div class="trow"><span>Household take-home</span><b>'+usd(take)+'</b></div>'+
     '<div class="trow"><span>Essentials, all in<span class="dl2">Of which housing carry is '+usd(house)+'</span></span><b>&minus;'+usd(ess)+'</b></div>'+
     '<div class="trow tot"><span>Yours to direct</span><b>'+usd(sur)+'</b></div>'+
   '</div>'+
   '<div class="modnote">Your housing carry is <b>22% of take-home</b>. That is low, and it is the reason there is a surplus here at all.</div></div>';
}

function ssMo(){ return 2400; }  /* estimate, named as one in the confidence list */

function ceiling(){return 859.29;}

function planAt(age,contrib){
  var yrs=age-40;
  var pot=contrib>0?fv(S.start,contrib,7,yrs):0;
  var svc=23+(age-55);
  var pct=Math.min(svc*3,100);
  return { pen:S.afc*pct/100/12, sav:potMo(pot), pot:pot, svc:svc, pct:pct };
}

     '<span class="cchev">'+(open?'&#9650;':'&#9660;')+'</span></div>'+

   '<div class="cd">Four figures are yours, two I looked up, and five I had to estimate. Tap to see which is which.</div>'+

     '<div class="cli miss"><i>&#8722;</i><span><b>Your average final compensation.</b> One phone call. The biggest single estimate here.</span></div>'+
     '<div class="cli miss"><i>&#8722;</i><span><b>Your union retiree premium.</b> Not priced &mdash; the range is $120,000 to $180,000 wide across ten years. One phone call.</span></div>'+

     '<div class="cli miss"><i>&#8722;</i><span><b>Your Social Security at 62.</b> $2,400 assumed. Your SSA statement has the real one.</span></div>'+
     '<div class="cli miss"><i>&#8722;</i><span><b>A 7% blended return.</b> An assumption about markets, and the one nobody can close.</span></div>'+
     '<div class="cd">The two phone calls take this to high. The sliders aren&rsquo;t estimates &mdash; they&rsquo;re yours to set, and they don&rsquo;t count against this score.</div>'+
   '</div>':'')+

}

function modGap(){
  var set=S.contrib>0;
  var p=planAt(S.retire,S.contrib);
  var pen=p.pen, fromPot=p.sav, ss=ssMo();
  var at=pen+fromPot+S.spouse, at62=at+ss;
  var gap=TARGET-at, gap62=TARGET-at62;
  var MAX=12000;
  return '<div class="mod">'+
   '<div class="modk">Explore trade-offs</div>'+
   '<div class="bar" style="margin-top:14px"><div class="bl"><span>At '+S.retire+'</span><b>'+usd(at)+'</b></div>'+
     '<div class="tr"><div class="fl" style="width:'+Math.min(at/MAX*100,100)+'%;background:'+(gap>0?'var(--t-a)':'var(--t-c)')+'"></div>'+
     '<div class="ceil" style="left:'+(TARGET/MAX*100)+'%"></div></div></div>'+
   '<div class="bar"><div class="bl"><span>From 62</span><b>'+usd(at62)+'</b></div>'+
     '<div class="tr"><div class="fl" style="width:'+Math.min(at62/MAX*100,100)+'%;background:'+(gap62>0?'var(--t-b)':'var(--t-c)')+'"></div>'+
     '<div class="ceil" style="left:'+(TARGET/MAX*100)+'%"></div></div>'+
     '<div class="ceill">Line: '+usd(TARGET)+' a month.</div></div>'+
   '<div class="trows">'+
     '<div class="trow"><span>FRS pension<span class="dl2">'+p.pct+'% of '+usd(S.afc)+', my estimate of your final pay</span></span><b>'+usd(pen)+'</b></div>'+
     '<div class="trow"><span>Social Security, from 62</span><b>'+usd(ss)+'</b></div>'+
   '</div>'+
   '<div class="agew"><div class="agel">Stop working at</div><div class="ages">'+
     [55,56,57,58,59,60].map(function(y){
       return '<button class="ageb'+(S.retire===y?' on':'')+'" data-age="'+y+'">'+y+'</button>';}).join('')+'</div></div>'+
   '<div class="sl"><label>Added monthly savings <b>'+(set?usd(S.contrib)+'/mo':'&mdash;')+'</b></label>'+
     '<input type="range" data-k="contrib" min="0" max="'+Math.round(ceiling())+'" step="25" value="'+S.contrib+'"></div>'+
   (set?'<div class="slout">Adds <b>'+usd(fromPot)+' a month</b> in retirement</div>':'')+
   '<div class="sl"><label>Her retirement income <b>'+(S.spouse>0?usd(S.spouse)+'/mo':'&mdash;')+'</b></label>'+
     '<input type="range" data-k="spouse" min="0" max="5000" step="100" value="'+S.spouse+'"></div>'+
   modConfidence()+
   '<div class="modfoot"><div class="mfl"><div class="mfh">'+usd(at)+' a month at '+S.retire+'</div>'+
     '<div class="mfs">'+usd(at62)+' once Social Security starts at 62</div></div>'+
     (S.goalSet
       ? '<span class="btn-set ghost">Target set &#10003;</span>'
       : '<button class="btn-set" data-goal="1">Set my target</button>')+
   '</div></div>';
}

function goalIncome(){
  var q=planAt(S.retire,S.contrib);
  return q.pen+q.sav+S.spouse;
}

  if(open){
    h+='<div class="rfbody">'+REFINE.map(function(r){

      return '<div class="rfi"><div class="rfh"><div><div class="rft">'+r.t+'</div>'+

        '<button class="rfb'+(on?' on':'')+'" data-refine="'+r.id+'">'+(on?'Added &#10003;':'&#43; Add')+'</button>'+

function modOptions(){
  var path=PATHS.filter(function(x){return x.id===S.path})[0]||PATHS[0];
  function incomeAt(x){ var q=planAt(x.age,S.contrib); return q.pen+q.sav+S.spouse; }
  var h='<div class="mod"><h3>Three ways to close it</h3>'+
   '<div class="cap">'+(S.contrib>0||S.spouse>0
     ? 'Built on what you&rsquo;ve set &mdash; '+(S.contrib>0?usd(S.contrib)+' a month saved':'nothing saved')+
       (S.spouse>0?' and '+usd(S.spouse)+' from her side':' and nothing from her side')+'.'
     : 'On your income alone, with nothing set aside yet.')+' Tap a column.</div>'+
   '<div class="cmpt three" style="background:transparent;padding:0;margin-top:14px"><table>'+
   '<tr><th>&nbsp;</th>'+PATHS.map(function(x){
      return '<th class="'+(x.id===S.path?'selth':'')+'" data-path="'+x.id+'" style="cursor:pointer">'+x.n+'</th>';}).join('')+'</tr>'+
   '<tr><td>Pension</td>'+PATHS.map(function(x){
      var q=planAt(x.age,S.contrib);
      return '<td class="neu'+(x.id===S.path?' selc':'')+'" data-path="'+x.id+'">'+usd(q.pen)+'<span class="dl">'+q.svc+' yrs</span></td>';}).join('')+'</tr>'+
   '<tr><td>Income at that age</td>'+PATHS.map(function(x){
      return '<td class="neu'+(x.id===S.path?' selc':'')+'" data-path="'+x.id+'">'+usd(incomeAt(x))+'</td>';}).join('')+'</tr>'+
   '<tr class="hi"><td>Against the target</td>'+PATHS.map(function(x){
      var d=x.tgt-incomeAt(x);
      return '<td class="'+(d>0?'up':'neu')+(x.id===S.path?' selc':'')+'" data-path="'+x.id+'">'+(d>0?'&minus;'+usd(d):'clears')+'<span class="dl">'+usd(x.tgt)+' target</span></td>';}).join('')+'</tr>'+
   '<tr><td>Years of bridge</td>'+PATHS.map(function(x){
      return '<td class="neu'+(x.id===S.path?' selc':'')+'" data-path="'+x.id+'" style="font-weight:400;font-size:11px">'+(65-x.age)+' years</td>';}).join('')+'</tr>'+
   '</table></div>'+
   '<div class="selbox"><div class="selk">'+path.n+'</div><div class="selp">'+path.d+'</div></div>';

  h+='<div class="modnote">None of these is fixed. Open the trade-offs and you can move what you save, when you stop, or what her side brings &mdash; every column moves with it.</div></div>';
  if(S.expOpen || S.goalSet) h+=modGap();
  if(!S.expOpen && !S.goalSet) h+='<button class="pill-more" data-exp="1" style="margin:16px auto 0">Explore trade-offs</button>';
  return h;
}

function eyebrowOf(p){ return ebText(p.pri); }
function actionCard(p,i){
  return '<div class="pcard" data-go="pack"><div class="eyebrow">'+eyebrowOf(p)+'</div>'+
   '<div class="pt">'+p.t+'</div><div class="pb">'+p.b+'</div>'+
   '<div class="prow"><span class="dur">'+p.tag+'</span>'+
   '<span class="ta">'+(p.cta||'Take action')+' <i>&#9656;</i></span></div></div>';
}
function limitTracker(){
  var W=300,H=72,PAD=8, v=LIMITS.map(function(r){return r.v});
  var mx=Math.max.apply(null,v), mn=Math.min.apply(null,v);
  var X=function(r){return PAD+r.x*(W-PAD*2)};
  var Y=function(x){return H-PAD-((x-mn)/((mx-mn)||1))*(H-PAD*2)};
  var last=LIMITS[LIMITS.length-1];
  var pts=LIMITS.map(function(r){return X(r)+','+Y(r.v)}).join(' ');
  var area='M'+X(LIMITS[0])+','+(H-PAD)+' L'+pts.split(' ').join(' L')+' L'+X(last)+','+(H-PAD)+' Z';
  return '<div class="mod"><div class="modk">Monitoring</div>'+
   '<h3 class="modh">The 457(b) limit rises most years</h3>'+
   '<div class="ratenow">$24,500<span>&uarr; $4,000 since 2022</span></div>'+
   '<svg viewBox="0 0 '+W+' '+H+'" class="ratesvg">'+
     '<path d="'+area+'" fill="rgba(176,124,216,.14)"/>'+
     '<polyline fill="none" stroke="#b07cd8" stroke-width="2" points="'+pts+'"/>'+
     '<circle cx="'+X(last)+'" cy="'+Y(last.v)+'" r="3.5" fill="#b07cd8"/>'+
   '</svg>'+
   '<div class="ratex"><span>2022</span><span>2023</span><span>2024</span><span>2025</span><span>2026</span></div>'+
   '<p class="modp">Not urgent while you are contributing $200 a month against a $24,500 ceiling. It matters later, if what you put aside grows into it &mdash; I will tell you when the limit moves so you can raise the deduction rather than discovering it in April.</p>'+
   '<div class="src">IRS elective deferral limit, governmental 457(b) &middot; checked 21 August 2026</div></div>';
}
function viewPriority(){
  var pot=fv(S.start,S.contrib,7,yrsToGo());
  return lightBar()+'<div class="body page" id="scroll">'+
   '<div class="pghead">'+
     '<span class="urg high">Running</span>'+
     '<h2 class="pgt">Retire at 55</h2>'+
     '<div class="progbar"><i style="width:0%"></i></div>'+
     '<div class="progl">0 of 4 actions done &middot; started 21 August</div>'+
   '</div>'+
   '<div class="mod"><div class="modk">Target</div>'+
   '<h3 class="modh">'+(S.goalSet?usd(goalIncome())+' a month at '+S.retire+', from the trade-offs you set.':usd(TARGET)+' a month at 55, on a plan with the holes named.')+'</h3>'+
   '<div class="trow"><span>Years to go</span><b>'+yrsToGo()+'</b></div>'+
   '<div class="trow"><span>Service at 55</span><b>'+svcYrs()+' years &middot; '+pensionPct()+'%</b></div>'+
   '<div class="trow"><span>Clearing each month</span><b>'+usd(859.29)+'</b></div>'+
   '<div class="trow"><span>Going into savings</span><b>'+(S.goalSet&&S.contrib>0?usd(S.contrib)+'/mo':'Not set')+'</b></div>'+
   '<div class="trow"><span>Projected at 55</span><b>'+usd(pensionMo()+potMo(pot))+'/mo</b></div>'+
   '<p class="modp">Nothing is set up yet, and four of the ten figures behind that projection are estimates. Two phone calls fix that.</p></div>'+
   '<h1 class="secH">Actions for this priority</h1>'+
   '<div class="mod plain">'+ACTIONS.map(actionCard).join('')+'</div>'+
   limitTracker()+
   '<div class="mod"><div class="modk">Also watching</div>'+
   '<h3 class="modh">Any change to FRS Special Risk</h3>'+
   '<p class="modp">You said part of why you want your own plan is in case the retirement you were promised isn&rsquo;t there when you reach it. That is a reasonable thing to watch rather than worry about, so I will watch it: if the legislature moves on Special Risk accrual, the DROP terms, or the vesting rules, you hear it from me and we re-run the numbers that day.</p></div>'+
   '<div class="mod"><div class="modk">What could change this</div>'+
   '<h3 class="modh">A regular-class filing error</h3>'+
   '<p class="modp">If your FRS statement shows 1.6% rather than 3%, you are filed as regular class and the whole retirement math changes. It is rare and it is a clerical fix, but it outranks everything else on this page until you have looked.</p></div>'+
   '<div class="mod"><div class="modk">Questions you&rsquo;ve asked</div>'+
   '<div class="qrow"><div><div class="pt2">How should I plan to retire at 55?</div>'+
   '<div class="pb">The pension, the surplus, the ten-year healthcare bridge, and what actually closes the gap &mdash; 21 August</div></div>'+
   '<span class="chev">&#9656;</span></div></div>'+
   '<div class="mod"><div class="modk">Related</div>'+
   '<div class="qrow"><div><div class="pt2">Stay debt free</div>'+
   '<div class="pb">House and cars only, and you want to keep it that way. The car clearing is worth more to this plan than the account you pick.</div></div>'+
   '<span class="chev">&#9656;</span></div>'+
   '<div class="qrow"><div><div class="pt2">Three months of expenses in reserve</div>'+
   '<div class="pb">Your own short-term goal. It draws on the same $859 as this does, and it should probably go first.</div></div>'+
   '<span class="chev">&#9656;</span></div></div>'+
   '<div style="height:20px"></div></div>'+dock();
}
function viewPack(){
  return lightBar()+'<div class="body page" id="scroll">'+
   '<div class="pghead">'+
     '<span class="eyebrow">RETIRE AT 55</span>'+
     '<h2 class="pgt">Pull the FRS benefits statement</h2>'+
     '<div class="progbar"><i style="width:0%"></i></div>'+
     '<div class="progl">0 of 3 steps done</div>'+
   '</div>'+
   '<div class="mod"><div class="modk">Why this first</div>'+
   '<h3 class="modh">Your pension is 69% of a number you have not seen.</h3>'+
   '<div class="modnote">Everything else on this priority sizes off your average final compensation. Across the range I had to model, it moves your monthly pension by '+
   usd(140000*0.69/12-80000*0.69/12)+' &mdash; which is larger than every other lever on the page put together. '+
   'It is one document, and it also tells you whether you are correctly filed as Special Risk.</div></div>'+
   '<div class="mod"><div class="modk">Steps</div>'+
   ACT_STEPS.map(function(p){
     return '<div class="stepc"><div class="stepn">'+p.n+'</div><div class="stepb">'+
       '<div class="pt">'+p.t+'</div><div class="pb">'+p.b+'</div>'+
       '<div class="prow"><span class="dur">'+p.tag.toUpperCase()+'</span>'+
       '<span class="ta">'+p.cta+' <i>&#9656;</i></span></div></div></div>';
   }).join('')+'</div>'+
   '<div class="mod"><div class="modk">On the timings</div>'+
   '<h3 class="modh">Where there is no honest estimate, there is no estimate.</h3>'+
   '<p class="modp">You said you would guarantee that calling HR takes longer than fifteen minutes, and you were right &mdash; that is their queue, not your task. Anything on this plan that depends on somebody else answering the phone carries no time estimate at all. Where a duration appears, it is because the step is yours alone and the figure comes from the provider&rsquo;s own published flow.</p></div>'+
   '<div class="mod"><div class="modk">The three questions</div>'+
   '<h3 class="modh">Ask for the answer in an email.</h3>'+
   '<div class="trow"><span>1. What is the monthly premium for retiree coverage at 55, for me and my spouse?</span></div>'+
   '<div class="trow"><span>2. Does it change at 60, at 62, or at Medicare eligibility at 65?</span></div>'+
   '<div class="trow"><span>3. Is the plan guaranteed for life, or renegotiated each year?</span></div>'+
   '<p class="modp">A verbal quote from a benefits office is worth what you paid for it. Ask them to put it in writing.</p></div>'+
   '<div class="mod"><div class="modk">Also counts toward</div>'+
   '<div class="qrow" data-go="priority"><div><div class="pt2">Retire at 55</div>'+
   '<div class="pb">Four of the ten figures behind your projection unlock from this one document.</div></div>'+
   '<span class="chev">&#9656;</span></div></div>'+
   '<div style="height:20px"></div></div>'+dock();
}
function viewEntry(){
  return topBar()+'<div class="body" style="display:flex;flex-direction:column;justify-content:center">'+
   '<div class="avatar c">F</div><div class="hero">What&rsquo;s on your<br>money mind?</div></div>'+
   '<div class="dock"><div class="inp"><span class="ic">&#128206;</span><span class="ic">&#127908;</span>'+
   '<span class="ph" style="color:#2c1d24">I am looking for ways to retire within the next 15 years when I reach 55. I am a firefighter in the state of Florida and will &ldquo;age out&rdquo; in my department so I will not take a penalty on my FRS retirement. How should I start planning and saving so I can live comfortably and well within my means if I retire at 55?</span>'+
   '<button class="snd" data-go="0">&uarr;</button></div></div>';
}

function viewTurn(){
  var t=D[S.t];
  var h=thread()+henceBlock(S.t,false);
  if(t.opts){
    h+='<div class="opts">'+t.opts.map(function(o,i){
      return '<button class="opt" data-opt="'+i+'">'+o+'</button>'}).join('')+'</div>';
    if(t.banded) h+='<div class="fieldfoot"><span>Or enter a specific answer below</span>'+
      '<span class="skip" data-opt="0">Skip this question</span></div>';
  }
  if(t.more && !t.gate) h+='<button class="pill-more" data-more="1">'+t.cta+'</button>';
  h+='</div><div style="height:26px"></div>';
  return topBar()+'<div class="body" id="scroll">'+h+'</div>'+
    (t.answer?dockTyped(t.answer):dock());
}

function render(){
  var s=document.getElementById('screen');
  s.innerHTML = S.t==='signup' ? viewSignup() : S.t==='welcome' ? viewWelcome() : S.t==='home' ? viewHome() : S.t==='entry' ? viewEntry() : S.t==='priority' ? viewPriority() : S.t==='pack' ? viewPack() : viewTurn();
  wire();
  document.getElementById('note').textContent=NOTES[S.t]||'';
  document.querySelectorAll('#vsw button').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-m')===S.mode)});
  document.querySelectorAll('#steps button').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-v')===String(S.t))});
  if(S.welcomeTimer){clearTimeout(S.welcomeTimer);S.welcomeTimer=null;}
  if(S.t==='welcome') S.welcomeTimer=setTimeout(function(){S.t='home';render();},1900);
}

function wire(){
  var s=document.getElementById('screen');
  s.querySelectorAll('[data-go]').forEach(function(e){e.onclick=function(){
    var g=e.getAttribute('data-go');
    if(g==='entry'){S.t='entry';S.log=[];}
    else if(g==='priority'||g==='pack'||g==='home'||g==='signup'||g==='welcome'){S.t=g;}
    else {S.t=parseInt(g,10);}
    render();scrollToTurn();}});
  s.querySelectorAll('[data-opt]').forEach(function(e){e.onclick=function(){
    var t=D[S.t]; var ix=parseInt(this.getAttribute('data-opt'),10);
    if(t.optSet && t.optSet[ix]) S.explore=t.optSet[ix];
    S.log.push({who:'hence',i:S.t});
    if(t.answered) S.log.push({who:'me',text:(t.optSet? t.opts[ix] : t.answered)});
    S.t=S.t+1;render();scrollToTurn();}});
  s.querySelectorAll('[data-send]').forEach(function(e){e.onclick=function(){
    var t=D[S.t];
    S.log.push({who:'hence',i:S.t});
    S.log.push({who:'me',text:t.answer});
    S.t=S.t+1;render();scrollToTurn();}});
  s.querySelectorAll('[data-more]').forEach(function(e){e.onclick=function(){
    S.log.push({who:'hence',i:S.t});
    S.t=S.t+1; S.expOpen=false; render();scrollToTurn();}});
  s.querySelectorAll('[data-decline]').forEach(function(e){e.onclick=function(){
    S.declined=true;
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
  s.querySelectorAll('[data-goal]').forEach(function(e){e.onclick=function(){
    S.goalSet=true;
    S.log.push({who:'hence',i:S.t});
    S.t=S.t+1; S.expOpen=false;
    render(); scrollToTurn();}});
  s.querySelectorAll('[data-refopen]').forEach(function(e){e.onclick=function(){
    S.refineOpen=!S.refineOpen;
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
  s.querySelectorAll('[data-refine]').forEach(function(e){e.onclick=function(){
    var k=this.getAttribute('data-refine'); S.refine[k]=!S.refine[k];
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
  s.querySelectorAll('[data-exp]').forEach(function(e){e.onclick=function(){
    S.expOpen=true; render();
    var mods=document.querySelectorAll('#curturn .mod');
    if(mods.length) mods[mods.length-1].scrollIntoView({block:'start'});}});
  s.querySelectorAll('[data-age]').forEach(function(e){e.onclick=function(){
    S.retire=parseInt(this.getAttribute('data-age'),10);
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
  s.querySelectorAll('[data-path]').forEach(function(e){e.onclick=function(){
    S.path=this.getAttribute('data-path');
    S.retire=(PATHS.filter(function(x){return x.id===S.path})[0]||PATHS[0]).age;
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;
  }});
  s.querySelectorAll('input[type=range]').forEach(function(e){
    /* live label while dragging; full recompute on release, so the drag
       isn't interrupted by the DOM being rebuilt underneath the thumb */
    e.oninput=function(){
      var k=this.getAttribute('data-k');
      S[k]=parseInt(this.value,10);
      var lab=this.parentNode.querySelector('label b');
      if(lab) lab.innerHTML = (k==='spouse'||k==='contrib') ? usd(S[k])+'/mo' : usd(S[k]);
    };
    e.onchange=function(){
      var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
      render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;
    };
  });
  s.querySelectorAll('[data-fan]').forEach(function(e){e.onclick=function(){S.fan=true;render();}});
  s.querySelectorAll('[data-sheet]').forEach(function(e){e.onclick=function(){
    S.sheet=this.getAttribute('data-sheet')==='1'; render();}});
  s.querySelectorAll('[data-tab]').forEach(function(e){e.onclick=function(){
    S.tab=this.getAttribute('data-tab'); render();}});
  s.querySelectorAll('[data-conf]').forEach(function(e){e.onclick=function(){
    S.confOpen=!S.confOpen;
    var b=document.getElementById('scroll'), pos=b?b.scrollTop:0;
    render(); var nb=document.getElementById('scroll'); if(nb) nb.scrollTop=pos;}});
}

function scrollToTurn(){
  var b=document.getElementById('scroll');
  if(!b) return;
  var t=document.getElementById('curturn');
  if(!t){ b.scrollTop=0; return; }
  b.scrollTop += t.getBoundingClientRect().top - b.getBoundingClientRect().top - 8;
}

document.getElementById('steps').innerHTML=STEPS.map(function(x){
  return '<button data-v="'+x[1]+'">'+x[0]+'</button>'}).join('');
document.getElementById('vsw').onclick=function(e){
  var m=e.target.getAttribute&&e.target.getAttribute('data-m'); if(!m) return;
  S.mode=m; render(); scrollToTurn();
};
document.getElementById('steps').onclick=function(e){
  var v=e.target.getAttribute&&e.target.getAttribute('data-v');if(!v)return;
  S.log=[];
  S.expOpen=false;
  if(v==='entry'||v==='priority'||v==='pack'||v==='home'||v==='signup'||v==='welcome'){S.t=v;render();return;}
  var n=parseInt(v,10);
  for(var i=0;i<n;i++){ S.log.push({who:'hence',i:i});
    var a=D[i].answer||D[i].answered; if(a) S.log.push({who:'me',text:a}); }
  S.t=n; render(); scrollToTurn();
};

render();
</script>
</body>
</html>
